name: BSUK Sword and Trowel audit
on:
  push:
    paths:
      - bsuk_worker/audit_sword_trowel.py
      - .github/workflows/bsuk-sword-trowel-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python bsuk_worker/audit_sword_trowel.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-sword-trowel-audit
          path: sword_trowel_audit.json
          if-no-files-found: error
          retention-days: 1
