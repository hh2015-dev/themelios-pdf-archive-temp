name: BSUK Ashland vol11 inspection

on:
  push:
    paths:
      - 'bsuk_worker/inspect_ashland_vol11.py'
      - '.github/workflows/bsuk-ashland-inventory-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pymupdf
      - name: Inspect suspected Volume 11 pages
        run: python bsuk_worker/inspect_ashland_vol11.py
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashland-vol11-check
          path: ashland_vol11_check/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
