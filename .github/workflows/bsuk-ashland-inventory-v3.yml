name: BSUK Ashland final accessible-volume measurement

on:
  push:
    paths:
      - 'bsuk_worker/ashland_final_measure_v8.py'
      - '.github/workflows/bsuk-ashland-inventory-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pymupdf
      - name: Measure complete Ashland volume PDFs
        run: python bsuk_worker/ashland_final_measure_v8.py
