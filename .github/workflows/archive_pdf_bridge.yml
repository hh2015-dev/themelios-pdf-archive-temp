name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch-archive-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Download Reimarus alternate PDF from Archive.org
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive_bridge
          curl -L --retry 3 --connect-timeout 20 --max-time 600 -A 'Mozilla/5.0' -fSs -o archive_bridge/10041651bsb_text.pdf 'https://archive.org/download/10041651bsb/10041651bsb_text.pdf'
          [ "$(head -c 5 archive_bridge/10041651bsb_text.pdf)" = "%PDF-" ]
          sha256sum archive_bridge/10041651bsb_text.pdf
          stat -c 'SIZE=%s' archive_bridge/10041651bsb_text.pdf
      - name: Upload Reimarus PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: reimarus-1791-alt-pdf
          path: archive_bridge/10041651bsb_text.pdf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
