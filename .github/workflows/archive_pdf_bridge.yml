name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-three-replacements:
    runs-on: ubuntu-latest
    steps:
      - name: Verify three Archive.org PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/items.tsv <<'EOF'
          abridgedprayerbo00jews	https://archive.org/download/abridgedprayerbo00jews/abridgedprayerbo00jews.pdf
          actsofearlymarty0000jamf	https://archive.org/download/actsofearlymarty0000jamf/actsofearlymarty0000jamf.pdf
          calvinscommentar0000calv_f0b6	https://archive.org/download/calvinscommentar0000calv_f0b6/calvinscommentar0000calv_f0b6.pdf
          EOF
          while IFS=$'\t' read -r id url; do
            curl -L --retry 2 --connect-timeout 20 --max-time 1200 -A 'Mozilla/5.0' -fSs -o "out/$id.pdf" "$url"
            [ "$(head -c 5 "out/$id.pdf")" = "%PDF-" ]
            echo "PASS $id SIZE=$(stat -c%s "out/$id.pdf")"
          done < /tmp/items.tsv
