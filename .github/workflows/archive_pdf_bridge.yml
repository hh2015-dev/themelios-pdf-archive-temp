name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  drive-credential-diagnostic:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
      RCLONE_CONFIG_BASE64_SECRET: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      GOOGLE_SERVICE_ACCOUNT_JSON_SECRET: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT_JSON_SECRET: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CREDENTIALS_SECRET: ${{ secrets.GOOGLE_CREDENTIALS }}
      GDRIVE_TOKEN_SECRET: ${{ secrets.GDRIVE_TOKEN }}
      RCLONE_TOKEN_SECRET: ${{ secrets.RCLONE_TOKEN }}
    steps:
      - name: Check whether an existing Drive credential is available
        shell: bash
        run: |
          set -euo pipefail
          found=0
          check() {
            n="$1"; v="$2"
            if [ -n "$v" ]; then echo "PRESENT:$n"; found=1; else echo "ABSENT:$n"; fi
          }
          check RCLONE_CONFIG "$RCLONE_CONFIG_SECRET"
          check RCLONE_CONFIG_BASE64 "$RCLONE_CONFIG_BASE64_SECRET"
          check GOOGLE_SERVICE_ACCOUNT_JSON "$GOOGLE_SERVICE_ACCOUNT_JSON_SECRET"
          check GDRIVE_SERVICE_ACCOUNT_JSON "$GDRIVE_SERVICE_ACCOUNT_JSON_SECRET"
          check GOOGLE_CREDENTIALS "$GOOGLE_CREDENTIALS_SECRET"
          check GDRIVE_TOKEN "$GDRIVE_TOKEN_SECRET"
          check RCLONE_TOKEN "$RCLONE_TOKEN_SECRET"
          echo "FOUND_ANY=$found"
