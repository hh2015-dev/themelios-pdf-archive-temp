name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch-archive-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public PDF variants on Archive.org
        shell: bash
        run: |
          set -euo pipefail
          for id in bookofcommonpray00revs alnetanqustiones00huet abhandlungenvond00reim; do
            echo "=== $id ==="
            curl -fsSL "https://archive.org/metadata/$id" -o "/tmp/$id.json"
            jq -r '.files[] | select((.name|ascii_downcase|endswith(".pdf"))) | select((.private // "false") != "true") | [.name, (.size // ""), (.source // ""), (.format // "")] | @tsv' "/tmp/$id.json" | sort -k2,2n
          done
