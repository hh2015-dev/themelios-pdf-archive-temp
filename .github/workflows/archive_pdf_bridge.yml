name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  transfer-three-selected:
    runs-on: ubuntu-latest
    steps:
      - name: Download selected Archive.org PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/items.tsv <<'EOF'
          remnantsoflaters0000unse	https://archive.org/download/remnantsoflaters0000unse/remnantsoflaters0000unse.pdf
          gtu_A32400002882532B	https://archive.org/download/gtu_A32400002882532B/gtu_A32400002882532B.pdf
          sacredarchaeolog0000mack	https://archive.org/download/sacredarchaeolog0000mack/sacredarchaeolog0000mack.pdf
          EOF
          while IFS=$'\t' read -r id url; do
            curl -L --retry 2 --connect-timeout 20 --max-time 1200 -A 'Mozilla/5.0' -fSs -o "out/$id.pdf" "$url"
            [ "$(head -c 5 "out/$id.pdf")" = "%PDF-" ]
            echo "$id SIZE=$(stat -c%s "out/$id.pdf") SHA256=$(sha256sum "out/$id.pdf" | cut -d' ' -f1)"
          done < /tmp/items.tsv
      - name: Upload selected PDFs
        uses: actions/upload-artifact@v4
        with:
          name: gtu-selected-three-pdfs
          path: out/*.pdf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
