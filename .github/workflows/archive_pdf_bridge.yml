name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-journal-proposals:
    runs-on: ubuntu-latest
    steps:
      - name: Download five proposed journal PDFs from Archive.org
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/items.tsv <<'EOF'
          american-academy-of-religion-journal_1940-02_8_1	https://archive.org/download/american-academy-of-religion-journal_1940-02_8_1/american-academy-of-religion-journal_1940-02_8_1.pdf
          american-academy-of-religion-journal_1940-05_8_2	https://archive.org/download/american-academy-of-religion-journal_1940-05_8_2/american-academy-of-religion-journal_1940-05_8_2.pdf
          american-academy-of-religion-journal_1940-08_8_3	https://archive.org/download/american-academy-of-religion-journal_1940-08_8_3/american-academy-of-religion-journal_1940-08_8_3.pdf
          american-academy-of-religion-journal_1940-11_8_4	https://archive.org/download/american-academy-of-religion-journal_1940-11_8_4/american-academy-of-religion-journal_1940-11_8_4.pdf
          expository-times_1910-11_22_2	https://archive.org/download/expository-times_1910-11_22_2/expository-times_1910-11_22_2.pdf
          EOF
          while IFS=$'\t' read -r id url; do
            curl -L --retry 3 --connect-timeout 20 --max-time 900 -A 'Mozilla/5.0' -fSs -o "out/$id.pdf" "$url"
            [ "$(head -c 5 "out/$id.pdf")" = "%PDF-" ]
            echo "$id SIZE=$(stat -c%s "out/$id.pdf") SHA256=$(sha256sum "out/$id.pdf" | cut -d' ' -f1)"
          done < /tmp/items.tsv
      - name: Upload journal proposal PDFs
        uses: actions/upload-artifact@v4
        with:
          name: gtu-journal-proposal-pdfs
          path: out/*.pdf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
