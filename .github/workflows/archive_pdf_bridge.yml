name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-five-journal-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Verify five proposed journal PDFs from Archive.org
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/items.tsv <<'EOF'
          american-bible-society-record_1863-07_8_7	https://archive.org/download/american-bible-society-record_1863-07_8_7/american-bible-society-record_1863-07_8_7.pdf
          american-missionary_1888-02_42_2	https://archive.org/download/american-missionary_1888-02_42_2/american-missionary_1888-02_42_2.pdf
          baptist-magazine-1809_1850-01_42	https://archive.org/download/baptist-magazine-1809_1850-01_42/baptist-magazine-1809_1850-01_42.pdf
          near-eastern-archaeology_1973-1982_36-45_index	https://archive.org/download/near-eastern-archaeology_1973-1982_36-45_index/near-eastern-archaeology_1973-1982_36-45_index.pdf
          luther-life_1898-07_11_1	https://archive.org/download/luther-life_1898-07_11_1/luther-life_1898-07_11_1.pdf
          EOF
          while IFS=$'\t' read -r id url; do
            curl -L --retry 2 --connect-timeout 20 --max-time 900 -A 'Mozilla/5.0' -fSs -o "out/$id.pdf" "$url"
            [ "$(head -c 5 "out/$id.pdf")" = "%PDF-" ]
            echo "$id SIZE=$(stat -c%s "out/$id.pdf") SHA256=$(sha256sum "out/$id.pdf" | cut -d' ' -f1)"
          done < /tmp/items.tsv
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtu-next-five-journals
          path: out/*.pdf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
