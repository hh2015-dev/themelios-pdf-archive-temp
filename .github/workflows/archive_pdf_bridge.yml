name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-journal-replacement:
    runs-on: ubuntu-latest
    steps:
      - name: Verify replacement journal PDF from Archive.org
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          url='https://archive.org/download/evangelicalmagaz0001vari/evangelicalmagaz0001vari.pdf'
          curl -L --retry 2 --connect-timeout 20 --max-time 900 -A 'Mozilla/5.0' -fSs -o out/evangelicalmagaz0001vari.pdf "$url"
          [ "$(head -c 5 out/evangelicalmagaz0001vari.pdf)" = "%PDF-" ]
          echo "SIZE=$(stat -c%s out/evangelicalmagaz0001vari.pdf) SHA256=$(sha256sum out/evangelicalmagaz0001vari.pdf | cut -d' ' -f1)"
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtu-journal-replacement-verify
          path: out/*.pdf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
