name: Archive PDF Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch-archive-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Download original PDF from Archive.org
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive_bridge
          id='achtsermon00luth'
          url='https://archive.org/download/achtsermon00luth/achtsermon00luth.pdf'
          out="archive_bridge/${id}.pdf"
          curl -L --retry 3 --connect-timeout 20 --max-time 300 -A 'Mozilla/5.0' -fSs -o "$out" "$url"
          [ "$(head -c 5 "$out")" = "%PDF-" ]
          sha256sum "$out"
          stat -c 'SIZE=%s' "$out"
      - name: Upload original PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: achtsermon00luth-original-pdf
          path: archive_bridge/achtsermon00luth.pdf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
