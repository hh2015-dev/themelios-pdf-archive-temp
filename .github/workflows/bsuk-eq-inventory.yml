name: BSUK EQ full inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'bsuk_worker/eq_inventory.py'
      - '.github/workflows/bsuk-eq-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Parse all EQ pages and validate PDF links
        run: python bsuk_worker/eq_inventory.py
      - name: Upload EQ inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: eq-inventory
          path: eq_inventory_out/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
