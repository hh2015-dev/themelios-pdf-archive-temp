name: Midwestern gap search
on:
  pull_request:
    paths:
      - 'midwestern-gap-trigger.txt'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search official MBTS media for 2013 and 2019 issues
        shell: bash
        run: |
          set -u
          mkdir -p out/media
          python - <<'PY'
          import urllib.request,urllib.parse,pathlib,json,csv
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u,t=60):
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=t) as r:return r.read()
          terms=['MJT 2013','MJT Spring 2013','MJT Fall 2013','MJT 12 1','MJT 12 2','MJT 2019','MJT Spring 2019','MJT 18 1','SP19 MJT','Spring19 MJT']
          rows=[]
          for i,term in enumerate(terms):
              api='https://www.mbts.edu/wp-json/wp/v2/media?search='+urllib.parse.quote(term)+'&per_page=100'
              try:
                  b=get('https://r.jina.ai/'+api);pathlib.Path(f'out/media/{i:02d}.txt').write_bytes(b);t=b.decode('utf-8','replace');arr=json.loads(t.split('Markdown Content:',1)[-1].strip())
              except Exception as e:rows.append((term,'ERROR','','','','',repr(e)));continue
              for d in arr:
                  title=d.get('title',{}).get('rendered',''); typ=d.get('mime_type',''); src=d.get('source_url','')
                  if typ=='application/pdf' or 'mjt' in title.lower(): rows.append((term,typ,d.get('id',''),title,src,d.get('date',''),''))
          with open('out/results.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t');w.writerow(['term','mime','id','title','source_url','date','error']);w.writerows(rows)
          print('ROWS',len(rows))
          for r in rows:print(*r[:6],sep='\t')
          PY
      - name: Upload gap media search
        uses: actions/upload-artifact@v4
        with:
          name: midwestern-gap-media-final
          path: out/
          retention-days: 1
