name: Midwestern gap search
on:
  pull_request:
    paths:
      - 'midwestern-gap-trigger.txt'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Probe missing issue files and official media
        shell: bash
        run: |
          set -u
          mkdir -p out/files out/media
          python - <<'PY'
          import urllib.request,urllib.parse,pathlib,re,json,csv,subprocess
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u,t=60):
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=t) as r:return r.read(),r.geturl(),dict(r.headers)
          bases=[
            'https://biblicalstudies.gospelstudies.org.uk/pdf/midwestern-journal-theology/vols/',
            'https://www.gospelstudies.org.uk/biblicalstudies/pdf/midwestern-journal-theology/vols/'
          ]
          names=[]
          for v in ['12','18']:
              names += [f'{v}-1.pdf',f'{v}-2.pdf',f'{v}-1_2.pdf',f'{v}-1-2.pdf',f'{v}.pdf',f'{v}-01.pdf',f'{v}-02.pdf',f'{v}_1.pdf',f'{v}_2.pdf']
          results=[];n=0
          for base in bases:
              for name in names:
                  n+=1; u=base+name
                  try:b,fu,h=get(u,35); status='PDF' if b.startswith(b'%PDF-') else 'NOTPDF'
                  except Exception as e: results.append((u,'ERROR',0,'','',repr(e)[:120]));continue
                  pages='';first=''
                  if status=='PDF':
                      fn=pathlib.Path(f'out/files/{n:03d}-{name}');fn.write_bytes(b)
                      try:
                          info=subprocess.check_output(['pdfinfo',str(fn)],text=True,stderr=subprocess.DEVNULL);m=re.search(r'^Pages:\s*(\d+)',info,re.M);pages=m.group(1) if m else '?'
                          first=subprocess.check_output(['pdftotext','-f','1','-l','2',str(fn),'-'],text=True,stderr=subprocess.DEVNULL)[:700].replace('\n',' | ')
                      except:pass
                  results.append((u,status,len(b),pages,first,''))
          # Official WP media searches for Spring 2021 under several naming variants.
          terms=['MJT SP 21','MJT Spring 2021','MJT 20 1','MJT Vol 20','Spring 21 MJT','MJT-SP-21','MJT-SP21','MJT 2021']
          media=[]
          for i,term in enumerate(terms):
              api='https://www.mbts.edu/wp-json/wp/v2/media?search='+urllib.parse.quote(term)+'&per_page=100'
              reader='https://r.jina.ai/'+api
              try:b,fu,h=get(reader,60); pathlib.Path(f'out/media/{i:02d}.txt').write_bytes(b);t=b.decode('utf-8','replace'); raw=t.split('Markdown Content:',1)[-1].strip();arr=json.loads(raw)
              except Exception as e:media.append((term,'ERROR','','','','',repr(e)));continue
              for d in arr:
                  if d.get('mime_type')=='application/pdf':
                      media.append((term,'PDF',d.get('id',''),d.get('title',{}).get('rendered',''),d.get('source_url',''),d.get('date',''),''))
                  elif 'mjt' in str(d.get('title',{}).get('rendered','')).lower():
                      media.append((term,d.get('mime_type',''),d.get('id',''),d.get('title',{}).get('rendered',''),d.get('source_url',''),d.get('date',''),''))
          with open('out/file-probes.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t');w.writerow(['url','status','bytes','pages','first_text','error']);w.writerows(results)
          with open('out/media-results.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t');w.writerow(['term','type','id','title','source_url','date','error']);w.writerows(media)
          print('SOURCE_PDFS',sum(r[1]=='PDF' for r in results))
          for r in results:
              if r[1]=='PDF': print('FOUND_SOURCE',*r[:4],sep='\t')
          print('MEDIA_ROWS',len(media))
          for r in media: print('MEDIA',*r[:6],sep='\t')
          PY
      - name: Upload gap probes
        uses: actions/upload-artifact@v4
        with:
          name: midwestern-gap-probes
          path: out/
          retention-days: 1
