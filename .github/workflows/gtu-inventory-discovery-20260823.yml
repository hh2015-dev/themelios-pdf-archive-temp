name: GTU inventory discovery 20260823
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection and verify public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re, time
          queries = [
            'collection:graduatetheologicalunion AND (title:(biblical OR bible OR testament OR gospel OR psalm OR isaiah OR genesis OR exodus OR jeremiah OR ezekiel OR daniel OR prophets))',
            'collection:graduatetheologicalunion AND (title:(hebrew OR aramaic OR syriac OR semitic OR chaldee OR targum OR talmud OR mishnah OR rabbinic))',
            'collection:graduatetheologicalunion AND (title:(greek OR septuagint OR papyri OR manuscript OR textual OR criticism OR lexicon OR grammar OR concordance))',
            'collection:graduatetheologicalunion AND (title:(archaeology OR assyrian OR babylonian OR akkadian OR ugarit OR palestine OR egyptian OR cuneiform))',
            'collection:graduatetheologicalunion AND (title:(philo OR josephus OR apocrypha OR pseudepigrapha OR maccabees OR qumran OR scrolls))',
            'collection:graduatetheologicalunion AND (title:(commentary OR commentaries OR interpretation OR exegesis OR exegetical))',
            'collection:graduatetheologicalunion AND (title:(patristic OR fathers OR origen OR augustine OR chrysostom OR irenaeus OR tertullian OR eusebius OR ephraem))',
            'collection:graduatetheologicalunion AND (title:(calvin OR luther OR reformation OR reformers))',
            'collection:graduatetheologicalunion AND (title:(journal OR quarterly OR studies OR review OR bulletin))',
            'collection:graduatetheologicalunion AND (subject:(Bible OR Biblical OR Hebrew OR Greek OR Syriac OR Aramaic OR Septuagint OR manuscripts OR archaeology))'
          ]
          seen=set(); candidates=[]; examined=0
          for qi,q in enumerate(queries):
            for page in (1,3,7):
              params = {
                'q':q,'fl[]':['identifier','title','creator','date','year','volume','subject','language','contributor'],
                'rows':'80','page':str(page),'output':'json','sort[]':'identifier asc'
              }
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params, doseq=True)
              try:
                data=json.load(urllib.request.urlopen(url, timeout=30))
              except Exception as e:
                print('SEARCHERR',qi,page,e); continue
              docs=data.get('response',{}).get('docs',[]); examined += len(docs)
              for d in docs:
                ident=d.get('identifier')
                if not ident or ident in seen: continue
                seen.add(ident)
                try:
                  meta=json.load(urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident), timeout=30))
                except Exception:
                  continue
                md=meta.get('metadata',{})
                coll=md.get('collection',[])
                if isinstance(coll,str): coll=[coll]
                if 'graduatetheologicalunion' not in coll: continue
                if str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true': continue
                pdf=None
                for f in meta.get('files',[]):
                  name=f.get('name',''); low=name.lower()
                  if low.endswith('.pdf') and not low.endswith('_encrypted.pdf') and not low.endswith('encrypted.pdf') and not low.endswith('.lcpdf') and not f.get('private',False):
                    pdf=name; break
                if not pdf: continue
                pages=md.get('imagecount') or md.get('numpages') or ''
                rec={
                  'identifier':ident,
                  'title':md.get('title',d.get('title','')),
                  'creator':md.get('creator',d.get('creator','')),
                  'date':md.get('date',d.get('date',d.get('year',''))),
                  'volume':md.get('volume',d.get('volume','')),
                  'subject':md.get('subject',d.get('subject','')),
                  'language':md.get('language',d.get('language','')),
                  'contributor':md.get('contributor',d.get('contributor','')),
                  'pages':pages,
                  'pdf':pdf
                }
                candidates.append(rec)
                if len(candidates)>=220: break
              if len(candidates)>=220: break
            if len(candidates)>=220: break
          print('EXAMINED='+str(examined))
          print('VERIFIED='+str(len(candidates)))
          for r in candidates:
            def s(v):
              if isinstance(v,list): return '; '.join(map(str,v))
              return str(v or '')
            print('GTU\t'+ '\t'.join(s(r[k]).replace('\t',' ').replace('\n',' ') for k in ['identifier','title','creator','date','volume','pages','pdf','subject','language','contributor']))
          PY
