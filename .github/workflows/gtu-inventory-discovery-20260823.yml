name: GTU inventory discovery 20260823
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          base='https://archive.org/advancedsearch.php'
          specs=[
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:(bible OR biblical OR testament OR gospel OR psalm OR isaiah OR genesis OR exodus OR commentary OR concordance OR lexicon OR grammar))',[4,10,16,22]),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:(hebrew OR aramaic OR syriac OR septuagint OR greek OR papyri OR manuscript OR talmud OR targum OR ugarit OR assyrian OR babylonian))',[3,8,13,18]),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (subject:(Bible OR Hebrew OR Syriac OR Aramaic OR Septuagint OR Talmud OR Manuscripts OR Assyriology OR Babylonia OR Archaeology))',[5,12,19]),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:(Calvin OR Luther OR Chrysostom OR Augustine OR Origen OR Eusebius OR Philo OR Josephus OR Irenaeus))',[3,7,11]),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:(Journal OR Quarterly OR Expository OR Scripture OR Archaeologist OR Studies))',[9,18,27]),
          ]
          def one(q,page):
            p={'q':q,'fl[]':['identifier','title','creator','date','year','volume','edition','series','subject','contributor','format'],'rows':100,'page':page,'output':'json'}
            try:return json.load(urllib.request.urlopen(base+'?'+urllib.parse.urlencode(p,doseq=True),timeout=20)).get('response',{}).get('docs',[])
            except Exception:return []
          jobs=[(q,p) for q,ps in specs for p in ps]
          docs=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
            futs=[ex.submit(one,q,p) for q,p in jobs]
            for f in as_completed(futs): docs.extend(f.result())
          byid={}
          for d in docs:
            i=d.get('identifier')
            if i: byid[i]=d
          print('SEARCH_HITS',len(docs),'UNIQUE_IDS',len(byid))
          with open('gtu_search_candidates.json','w',encoding='utf-8') as f:json.dump({'examined':len(docs),'candidates':list(byid.values())},f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-search-candidates
          path: gtu_search_candidates.json
