name: GTU inventory discovery 20260823
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected GTU candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          ids='''labibletraductio0007unse
labibletraductio0012unse
geschichtedesvol0006ewal
textkritischestu0000hout
bibleislamorinfl0000smit_h7p6
introductionauno0000gogu_f3r2
servantofjehovah0000work_v6x5
manualofhistoric0002karl
grammatikdergrie0002mays_z8l6
calvinscommentar0001calv_g7g9
firstdraftofstlu0000tayl
b14093613
popularreligiono00unse
bookofisaiahinfi0000robi_n1z3
essaysinbiblical0000edwi
oldbabylonianlet0006henr
neobabylonianadm0009henr
calvinscommentar0000calv_z1o6
calvinscommentar0043calv
expositionofstpa0000thol
manuelbibliqueou0003vigo
messageoffourthg0000lewi_j5a6
sixthbookofselec0022seve
chaptersofcoming0002unse
mucrocardcatalog0000igna
handbookofaramai0000ross
introductoryhebr0000abda_h0r9
archivesfromerec0002doug
keytosiddurgramm0000slot
comparisonofegyp0000port
historicbiblesin0000wrig
practicalcomment0000fred
commentaryongosp0000revc
storyofenglishne0009gilm
lateroldtestamen0000will
nineveholdtestam0000andr_l3r5'''.splitlines()
          def flat(v):
            if isinstance(v,list): return '; '.join(str(x) for x in v)
            return '' if v is None else str(v)
          def verify(i):
            try: m=json.load(urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(i),timeout=15))
            except Exception as e: return {'identifier':i,'eligible':False,'error':str(e)}
            md=m.get('metadata',{}); coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            pdfs=[]
            for f in m.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith('.pdf') and not n.lower().endswith('.lcpdf') and 'encrypted' not in n.lower() and str(f.get('private','false')).lower()!='true':
                pdfs.append((int(f.get('size',0) or 0),n))
            restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
            eligible=('graduatetheologicalunion' in coll and not restricted and bool(pdfs))
            pdf=max(pdfs)[1] if pdfs else ''
            return {'identifier':i,'eligible':eligible,'title':flat(md.get('title')),'creator':flat(md.get('creator')),'date':flat(md.get('date') or md.get('year')),'volume':flat(md.get('volume')),'edition':flat(md.get('edition')),'series':flat(md.get('series')),'contributor':flat(md.get('contributor')),'subject':flat(md.get('subject')),'pages':flat(md.get('imagecount')),'pdf':pdf,'restricted':restricted,'collections':coll}
          out=[]
          with ThreadPoolExecutor(max_workers=20) as ex:
            futs=[ex.submit(verify,i) for i in ids]
            for f in as_completed(futs): out.append(f.result())
          out.sort(key=lambda x:ids.index(x['identifier']))
          print('VERIFIED',sum(1 for x in out if x.get('eligible')),'OF',len(out))
          with open('gtu_verified_selected.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          for x in out: print(('OK' if x.get('eligible') else 'NO')+'\t'+x['identifier']+'\t'+x.get('title',''))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-selected
          path: gtu_verified_selected.json
