name: GTU inventory 20 discovery 20260823
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection and verify public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries = [
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:"Dead Sea" OR title:Qumran OR title:pseudepigrapha OR title:apocrypha)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:targum OR title:rabbinic OR title:talmud)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:ugarit OR title:ugaritic OR title:assyrian OR title:babylonian OR title:semitic)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:coptic OR title:ethiopic OR title:syriac OR title:aramaic)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:philo OR title:josephus OR title:judaism OR title:jewish)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:septuagint OR title:hexapla OR title:papyrus OR title:papyri)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:origen OR title:jerome OR title:augustine OR title:chrysostom)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:creed OR title:confession OR title:reformation)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:mission OR title:missionary)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:concordance OR title:lexicon OR title:grammar OR title:bibliography)'
          ]
          seen=set(); candidates=[]
          for q in queries:
            url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator','date','year','language','subject'],'rows':50,'page':1,'output':'json'}, doseq=True)
            try: data=json.load(urllib.request.urlopen(url, timeout=20))
            except Exception as e: print('SEARCHERR',e); continue
            for d in data.get('response',{}).get('docs',[]):
              i=d.get('identifier')
              if i and i not in seen:
                seen.add(i); candidates.append(d)
          print('DISCOVERED_UNIQUE',len(candidates))
          out=[]
          for d in candidates[:140]:
            i=d['identifier']
            try: m=json.load(urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(i), timeout=15))
            except Exception: continue
            md=m.get('metadata',{})
            coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if 'graduatetheologicalunion' not in coll: continue
            pdfs=[]
            for f in m.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith('.pdf') and 'encrypted' not in n.lower() and not n.lower().endswith('.lcpdf') and str(f.get('private','false')).lower()!='true': pdfs.append(f)
            if not pdfs: continue
            pdf=max(pdfs,key=lambda f:int(f.get('size') or 0))
            creator=md.get('creator') or d.get('creator') or ''
            if isinstance(creator,list): creator='; '.join(map(str,creator))
            lang=md.get('language') or d.get('language') or ''
            if isinstance(lang,list): lang=' | '.join(map(str,lang))
            subj=md.get('subject') or d.get('subject') or ''
            if isinstance(subj,list): subj=' | '.join(map(str,subj[:8]))
            contributor=md.get('contributor','') or 'Internet Archive'
            if isinstance(contributor,list): contributor='; '.join(map(str,contributor))
            rec={'identifier':i,'title':md.get('title') or d.get('title') or '','creator':creator,'date':str(md.get('date') or d.get('date') or md.get('year') or d.get('year') or ''),'language':str(lang),'subject':str(subj),'volume':str(md.get('volume','')),'edition':str(md.get('edition','')),'series':str(md.get('series','')),'pages':str(md.get('imagecount','')),'contributor':str(contributor),'pdf_size':pdf.get('size',''),'item_link':'https://archive.org/details/'+i,'direct_pdf':'https://archive.org/download/'+i+'/'+urllib.parse.quote(pdf.get('name',''))}
            out.append(rec)
            if len(out)>=70: break
          print('VERIFIED_PUBLIC_PDF',len(out))
          for r in out: print('REC\t'+json.dumps(r,ensure_ascii=False,separators=(',',':')))
          PY
