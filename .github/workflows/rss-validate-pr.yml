name: RSS validate corpus PR
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import collections, concurrent.futures, html, re, urllib.parse, urllib.request
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1)'}
          occ=collections.defaultdict(list)
          for i in range(1,5):
            page=f'https://biblicalstudies.org.uk/articles_rss_{i:02d}.php'
            req=urllib.request.Request(page,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r: raw=r.read(); final=r.geturl()
            soup=BeautifulSoup(raw,'html.parser')
            for a in soup.find_all('a',href=True):
              url=urllib.parse.urljoin(final,html.unescape(a['href'].strip()))
              if not urllib.parse.urlparse(url).path.lower().endswith('.pdf'): continue
              text=re.sub(r'\s+',' ',html.unescape(a.get_text(' ',strip=True))).strip()
              context=text; node=a.parent
              for _ in range(5):
                if re.search(r'Religion,?\s*State\s*(?:&|and)\s*Society\s+\d+',context,re.I): break
                if node is None: break
                context=re.sub(r'\s+',' ',html.unescape(node.get_text(' ',strip=True))).strip(); node=node.parent
              m=re.search(r'Religion,?\s*State\s*(?:&|and)\s*Society\s+(\d+)\.(\d+(?:[-&]\d+)?)',context,re.I)
              if not m: continue
              v=int(m.group(1)); issue=m.group(2)
              occ[url.lower()].append((i,v,issue,url,context[:500]))
          dups={k:v for k,v in occ.items() if len(v)>1}
          print('UNIQUE',len(occ),'DUPLICATE_URLS',len(dups),'EXTRA_OCCURRENCES',sum(len(v)-1 for v in dups.values()))
          for k,rows in dups.items():
            print('DUP_URL',rows[0][3])
            for row in rows: print('  OCC',row[0],row[1],row[2],row[4])
          def check(item):
            k,rows=item; url=rows[0][3]
            try:
              req=urllib.request.Request(url,headers={**UA,'Range':'bytes=0-8191'})
              with urllib.request.urlopen(req,timeout=60) as r:
                data=r.read(8192); status=r.status; ctype=r.headers.get('Content-Type',''); final=r.geturl()
              return (k,True,status,data.startswith(b'%PDF-'),len(data),ctype,final,'')
            except Exception as e:
              return (k,False,None,False,0,'','',repr(e))
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
            for res in ex.map(check,occ.items()): results.append(res)
          bad=[r for r in results if not r[1] or not r[3]]
          print('VALIDATED',len(results),'BAD',len(bad))
          for r in bad: print('BAD_URL',occ[r[0]][0][3],r[1:])
          print('PDF_SIGNATURE_OK',sum(1 for r in results if r[3]))
          PY
