name: GTU inventory 20 discovery
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Deep-mine GTU collection only
        shell: bash
        run: |
          cat > /tmp/deep.py <<'PY'
          import json, urllib.parse, urllib.request
          from collections import OrderedDict
          BASE='https://archive.org'; coll='graduatetheologicalunion'
          def get(url, timeout=15):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GTU-inventory-research/1.0'})
            with urllib.request.urlopen(req,timeout=timeout) as r:return json.load(r)
          specs=[
            (f'collection:{coll} AND mediatype:texts',[21,26,31,36,41,46,51,56,61,66]),
            (f'collection:{coll} AND mediatype:texts AND (Bible OR Biblical OR Testament OR Gospel OR Psalms OR Isaiah OR Genesis OR Exodus OR Job OR Daniel OR Prophets)',[3,4,5,6,7]),
            (f'collection:{coll} AND mediatype:texts AND (Hebrew OR Aramaic OR Syriac OR Semitic OR Ugaritic OR Akkadian OR Assyrian OR Babylonian)',[3,4,5,6,7]),
            (f'collection:{coll} AND mediatype:texts AND (Greek OR Septuagint OR papyri OR manuscript OR textual OR criticism OR lexicon OR grammar OR concordance)',[3,4,5,6,7]),
            (f'collection:{coll} AND mediatype:texts AND (Qumran OR "Dead Sea" OR Targum OR Talmud OR Mishnah OR Midrash OR Philo OR Josephus)',[2,3,4,5]),
            (f'collection:{coll} AND mediatype:texts AND (archaeology OR Palestine OR Canaan OR Mesopotamia OR Egypt OR inscriptions OR epigraphy)',[3,4,5,6]),
            (f'collection:{coll} AND mediatype:texts AND (Augustine OR Origen OR Jerome OR Chrysostom OR Irenaeus OR Calvin OR Luther OR Reformation)',[3,4,5,6]),
            (f'collection:{coll} AND mediatype:texts AND (theology OR church OR doctrine OR creed OR mission OR missions OR Judaism OR Christianity)',[4,6,8,10]),
          ]
          docs=OrderedDict(); appearances=0; calls=0
          for q,pages in specs:
            for page in pages:
              params=[('q',q),('rows','200'),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              for f in ['identifier','title','creator','year','date','volume','edition','series','language','subject','format','collection','contributor']:params.append(('fl[]',f))
              try: got=get(BASE+'/advancedsearch.php?'+urllib.parse.urlencode(params)).get('response',{}).get('docs',[])
              except Exception as e: print('ERR',page,repr(e));continue
              calls+=1; appearances+=len(got)
              for d in got:
                if d.get('identifier'): docs.setdefault(d['identifier'],d)
          out=list(docs.values())
          json.dump(out,open('deep_candidates.json','w',encoding='utf-8'),ensure_ascii=False)
          summary={'calls':calls,'appearances':appearances,'unique_discovered':len(out)}
          json.dump(summary,open('summary.json','w'));print(json.dumps(summary))
          PY
          python3 /tmp/deep.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-deep-candidates
          path: |
            deep_candidates.json
            summary.json
          compression-level: 6
