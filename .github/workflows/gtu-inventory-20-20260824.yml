name: GTU inventory 20 discovery
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection broadly and verify metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re
          queries = [
            'title:(Deuteronomy OR Leviticus OR Ecclesiastes OR Qoheleth OR Canticles OR "Song of Songs")',
            'title:(Hosea OR Amos OR Micah OR Zechariah OR Malachi OR Habakkuk)',
            'title:(Targum OR Targumic OR Midrash OR Midrashic OR Mishnah OR Talmud)',
            'title:(Syriac OR Peshitta OR Armenian OR Ethiopic OR Coptic)',
            'title:(papyri OR papyrus OR ostraca OR inscription OR epigraphy OR cuneiform)',
            'title:(Phoenician OR Moabite OR Nabataean OR Aramaic OR Ugaritic)',
            'title:(Septuagint OR Hexapla OR Origen OR Aquila OR Symmachus OR Theodotion)',
            'title:(canon OR apocrypha OR pseudepigrapha OR apocalypse OR testament)',
            'title:(Irenaeus OR Tertullian OR Chrysostom OR Jerome OR Augustine OR Ephraem)',
            'title:(Luther OR Zwingli OR Melanchthon OR Bucer OR Reformation)',
            'title:(concordance OR lexicon OR grammar OR bibliography OR catalogue)',
            'title:(archaeology OR Palestine OR Assyria OR Babylonia OR Egypt OR Israel)',
            'title:(rabbinic OR Jewish OR Judaism OR synagogue OR messiah OR messianic)',
            'title:(manuscript OR codex OR palaeography OR paleography)',
            'title:(Acts OR Romans OR Corinthians OR Hebrews OR Revelation) AND year:[1800 TO 1940]',
            'title:(Genesis OR Exodus OR Joshua OR Judges OR Samuel OR Kings) AND year:[1800 TO 1940]',
            'title:(Psalms OR Proverbs OR Job OR Isaiah OR Jeremiah OR Ezekiel OR Daniel) AND year:[1800 TO 1940]'
          ]
          ids=[]; seen=set(); examined=0
          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':'GTUInventory/1.0'})
              with urllib.request.urlopen(req, timeout=15) as r: return json.load(r)
          for q in queries:
              full=f'collection:graduatetheologicalunion AND mediatype:texts AND ({q})'
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':full,'fl[]':['identifier'],'rows':30,'page':1,'output':'json','sort[]':'identifier asc'}, doseq=True)
              try: docs=get(url).get('response',{}).get('docs',[])
              except Exception as e: print('SEARCHERR',q,repr(e)); continue
              examined += len(docs)
              for d in docs:
                  i=d.get('identifier')
                  if i and i not in seen: seen.add(i); ids.append(i)
          for page in [11,37,73,109,149]:
              full='collection:graduatetheologicalunion AND mediatype:texts'
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':full,'fl[]':['identifier'],'rows':30,'page':page,'output':'json','sort[]':'identifier asc'}, doseq=True)
              try: docs=get(url).get('response',{}).get('docs',[])
              except Exception as e: print('PAGEERR',page,repr(e)); continue
              examined += len(docs)
              for d in docs:
                  i=d.get('identifier')
                  if i and i not in seen: seen.add(i); ids.append(i)
          print('EXAMINED_SEARCH_HITS',examined); print('UNIQUE_CANDIDATES',len(ids))
          keyA=['bible','biblical','testament','hebrew','aramaic','syriac','semit','greek','septuag','manuscript','codex','targum','talmud','mishnah','midrash','apocry','pseudep','palestine','archaeolog','assyri','babylon','ugarit','cuneiform','papy','inscription','genesis','exodus','levit','deuter','joshua','judges','samuel','kings','psalm','proverb','ecclesiast','isaiah','jeremiah','ezekiel','daniel','hosea','amos','micah','zechar','malachi','matthew','mark','luke','john','acts','romans','corinth','galatian','ephesian','hebrews','revelation','commentar','concordance','lexicon','grammar']
          keyB=['theolog','patrist','augustin','chrysost','irenae','tertull','origen','reformation','luther','calvin','zwingli','mission','creed','confession']
          out=[]
          for i in ids[:120]:
              try: m=get('https://archive.org/metadata/'+urllib.parse.quote(i))
              except Exception: continue
              md=m.get('metadata',{}) or {}; coll=md.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              if 'graduatetheologicalunion' not in coll: continue
              title=md.get('title','') or ''; creator=md.get('creator','') or ''; subject=md.get('subject','') or ''
              if isinstance(creator,list): creator='; '.join(map(str,creator))
              if isinstance(subject,list): subject='; '.join(map(str,subject))
              hay=(title+' '+creator+' '+subject).lower(); score=sum(3 for k in keyA if k in hay)+sum(1 for k in keyB if k in hay)
              if score<2: continue
              restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
              pdf=''
              if not restricted:
                  for f in m.get('files',[]) or []:
                      n=f.get('name','') or ''
                      if re.search(r'\.pdf$',n,re.I) and str(f.get('private','false')).lower()!='true' and not re.search(r'(encrypted|\.lcpdf$)',n,re.I): pdf=n; break
              out.append([score,i,title,creator,md.get('date') or md.get('year') or '',md.get('volume','') or '',md.get('edition','') or '',md.get('series','') or '',md.get('language','') or '',md.get('contributor','') or '',md.get('pages','') or '',restricted,pdf,subject])
          out.sort(key=lambda x:(-x[0],str(x[4]),x[2])); print('VERIFIED_RELEVANT',len(out)); print('BEGIN_CANDIDATES')
          for row in out[:100]: print(json.dumps(row,ensure_ascii=False))
          print('END_CANDIDATES')
          PY
