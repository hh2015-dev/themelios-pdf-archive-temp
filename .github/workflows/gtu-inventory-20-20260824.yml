name: GTU Inventory 20 discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection broadly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time, os
          queries = [
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Bible OR biblical OR testament OR gospel OR psalm OR Isaiah OR Genesis OR Exodus OR Job OR Daniel OR Jeremiah OR Ezekiel OR Torah OR Pentateuch))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Hebrew OR Aramaic OR Syriac OR Semitic OR Akkadian OR Ugaritic OR Assyrian OR Babylonian))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Greek OR Septuagint OR papyri OR manuscript OR textual OR criticism OR lexicon OR grammar OR concordance))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Talmud OR Midrash OR rabbinic OR Judaism OR Jewish OR Josephus OR Philo OR Qumran OR Dead Sea OR apocrypha OR pseudepigrapha))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(archaeology OR archaeological OR Palestine OR Israel OR Canaan OR Mesopotamia OR Near East OR Egypt))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Origen OR Augustine OR Chrysostom OR Jerome OR Irenaeus OR Tertullian OR Eusebius OR patristic OR fathers))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Calvin OR Luther OR Reformation OR commentary OR commentaries OR exegesis OR interpretation))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(theology OR doctrine OR creed OR confession OR apologetics OR mission OR missions OR church history))',
            'collection:graduatetheologicalunion AND mediatype:texts AND year:[1800 TO 1899]',
            'collection:graduatetheologicalunion AND mediatype:texts AND year:[1900 TO 1949]',
            'collection:graduatetheologicalunion AND mediatype:texts AND year:[1950 TO 1979]',
            'collection:graduatetheologicalunion AND mediatype:texts AND year:[1980 TO 2026]'
          ]
          seen = {}
          examined = 0
          for qi,q in enumerate(queries):
              for page in (1,2,3,5,8):
                  params = {
                    'q': q,
                    'fl[]': ['identifier','title','creator','year','language','subject','description','contributor','volume','edition','series','format'],
                    'rows': 100,
                    'page': page,
                    'output': 'json',
                    'sort[]': 'identifier asc'
                  }
                  # custom encode repeated fl[]
                  parts=[]
                  for k,v in params.items():
                      if isinstance(v,list):
                          for x in v: parts.append((k,x))
                      else: parts.append((k,v))
                  url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(parts)
                  try:
                      with urllib.request.urlopen(url, timeout=45) as r:
                          data=json.load(r)
                  except Exception as e:
                      print('ERR', qi, page, repr(e), flush=True)
                      continue
                  docs=data.get('response',{}).get('docs',[])
                  examined += len(docs)
                  for d in docs:
                      ident=d.get('identifier')
                      if ident and ident not in seen:
                          seen[ident]=d
                  time.sleep(0.12)
          os.makedirs('out',exist_ok=True)
          with open('out/candidates.jsonl','w',encoding='utf-8') as f:
              for d in seen.values():
                  f.write(json.dumps(d,ensure_ascii=False)+'\n')
          with open('out/summary.txt','w',encoding='utf-8') as f:
              f.write(f'examined_appearances={examined}\nunique_identifiers={len(seen)}\n')
          print(f'EXAMINED_APPEARANCES={examined} UNIQUE={len(seen)}', flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-discovery-20260824
          path: out
          compression-level: 6
