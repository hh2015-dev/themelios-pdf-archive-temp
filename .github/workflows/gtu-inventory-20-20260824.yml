name: GTU inventory 20 20260824 verify
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected items against Archive metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify.py <<'PY'
          import json, urllib.request, urllib.parse, time
          ids=[
            'newdocumentsillu0005hors','diezeichenfurdie0000kraf','paulsuseofoldtes0000eear_d9y1','newtestamentword0000barc_p4e4','qumranyelnuevote0000casc',
            'linfinitifsemiti0000sola','grammairehebraiq0000touz','hebraischegramma0002beer','ladeessetntuneet0002hvid','rasschamraundsan0000eiss',
            'sanchunjatonvonb0000otto','philoofalexandri0008radi','bibliothecajudai0003furs','historyofprophec0000blen_x8r8','newtestamentcrit0000heda',
            'oldtestamentitsm0000hwhe','sacrificeinoldte00unse','gtu_32400004069450','newtestamentinte0000unse_d1l2','semeiaexperiment0000edga'
          ]
          out=[]
          for ident in ids:
            with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=45) as r:
              j=json.load(r)
            m=j.get('metadata',{})
            coll=m.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            files=j.get('files',[])
            public_pdf=[]
            encrypted_pdf=[]
            for f in files:
              name=str(f.get('name',''))
              if not name.lower().endswith('.pdf'): continue
              if str(f.get('private','false')).lower()=='true': continue
              if name.lower().endswith('.lcpdf') or 'encrypted' in name.lower(): encrypted_pdf.append(name); continue
              public_pdf.append({'name':name,'size':f.get('size'),'source':f.get('source')})
            pages=m.get('imagecount') or m.get('page-progression') or ''
            out.append({
              'identifier':ident,'in_gtu':'graduatetheologicalunion' in coll,'collection':coll,
              'metadata':m,'public_pdf':public_pdf,'encrypted_pdf':encrypted_pdf,
              'files_count':len(files)
            })
            time.sleep(0.1)
          with open('gtu_verified.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False)
          print('VERIFIED',len(out),'GTU',sum(x['in_gtu'] for x in out),'PUBLIC_PDF',sum(bool(x['public_pdf']) for x in out))
          PY
          python /tmp/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-20260824
          path: gtu_verified.json
          compression-level: 6
