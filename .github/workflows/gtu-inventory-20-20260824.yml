name: GTU candidate verification 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact GTU membership and metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify.py <<'PY'
          import json, urllib.request, urllib.parse, re, time
          ids = '''gtu_32400005869056
ourbibleancientm0000sirf_a4p0
gtu_32400004227710_8
introductiontobi0000gern
positionofbookso0000ptho
ugariticstudiesb0043mitc
babylonischassyr0001borg
babylonischassyr0002borg
babylonischassyr0003borg
saintgregoryofny0000unse
historicalcatalo0000mros
semeiaexperiment0000jche
semeiaexperiment0000larr
semeiaexperiment0000char
repertoiredepigr0001unse
repertoiredepigr0002unse
repertoiredepigr0003unse
repertoiredepigr0005unse
repertoiredepigr0006unse
testimonyofjosep0000barn
oldtestamentsinc0000emil
studienzumrabbin0010stem
semitica_1851-1952_4
discoveriesinrui0000laya_q9u1
gtu_32400005923598
fifteenthcentury0000wend
palestine-exploration-quarterly_1875-01
palestine-exploration-quarterly_1882-04
palestine-exploration-quarterly_1883-01
palestine-exploration-quarterly_1888-07
sim_journal-of-semitic-studies_1956-04_1_2
sim_journal-of-semitic-studies_1957-04_2_2
sim_journal-of-semitic-studies_1959-04_4_2
sim_journal-of-semitic-studies_autumn-1961_6_2
mythmiraclemidra0000emil'''.splitlines()
          def flat(x):
            if isinstance(x,list): return '; '.join(map(str,x))
            return str(x or '')
          def year(meta):
            y=meta.get('year') or meta.get('date') or meta.get('publicdate') or ''
            m=re.search(r'(1[0-9]{3}|20[0-9]{2})', flat(y)); return m.group(1) if m else ''
          with open('verified.tsv','w',encoding='utf-8') as out:
            hdr=['identifier','in_gtu','title','creator','year','volume','edition','series','language','contributor','mediatype','restricted','public_pdf','pages','subject']
            out.write('\t'.join(hdr)+'\n')
            for ident in ids:
              try:
                with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident), timeout=45) as r: d=json.load(r)
                m=d.get('metadata',{})
                coll=m.get('collection',[]); coll=[coll] if isinstance(coll,str) else coll
                ingtu='graduatetheologicalunion' in coll
                restricted=str(m.get('access-restricted-item') or m.get('printdisabled') or '').lower()
                pdf=''
                for f in d.get('files',[]):
                  n=f.get('name',''); priv=str(f.get('private','false')).lower()
                  if n.lower().endswith('.pdf') and priv!='true' and not n.lower().endswith('_encrypted.pdf') and not n.lower().endswith('.lcpdf'):
                    pdf='https://archive.org/download/'+ident+'/'+urllib.parse.quote(n); break
                pages=flat(m.get('pages') or m.get('page-count') or m.get('page_count') or '')
                vals=[ident,'YES' if ingtu else 'NO',flat(m.get('title')),flat(m.get('creator')),year(m),flat(m.get('volume')),flat(m.get('edition')),flat(m.get('series')),flat(m.get('language')),flat(m.get('contributor')),flat(m.get('mediatype')),restricted,pdf,pages,flat(m.get('subject'))]
                out.write('\t'.join(v.replace('\t',' ').replace('\n',' ') for v in vals)+'\n')
              except Exception as e:
                out.write(ident+'\tERROR\t'+str(e).replace('\t',' ').replace('\n',' ')+'\n')
              time.sleep(.08)
          PY
          python3 /tmp/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-20260824
          path: verified.tsv
