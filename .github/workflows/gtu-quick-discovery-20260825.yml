name: GTU quick discovery 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - name: Verify final selected items in exact GTU collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          ids='''encyclopediaofhe0004unse
journalofbiblica0104vict
journalofbiblica0106burk
biblicalmotifsor0003alex
shortguidetoacce0000jppo_h1d6
palestine-exploration-quarterly_january-june-1956
palestine-exploration-quarterly_january-june-1957
practicalguidefo0000kost
ancientsynagogue0000suke_e1m2
sim_bulletin-of-the-american-schools-of-oriental-research_1950-12_120
sim_bulletin-of-the-american-schools-of-oriental-research_1951-02_121
gtu_32400001585011_1
sim_journal-of-biblical-literature_1951-03_70_1
sim_near-eastern-archaeology_1942-05_5_2
sim_bulletin-of-the-american-schools-of-oriental-research_1946-02_101
catholic-biblical-quarterly_1939-1948_1-10_index
semeiaexperiment0000kati
rationalviewofbi0000mann
revelationcanoni0000john
sim_journal-of-biblical-literature_1953-03_72_1'''.splitlines()
          out=[]
          for ident in ids:
            url='https://archive.org/metadata/'+urllib.parse.quote(ident)
            md=json.load(urllib.request.urlopen(url,timeout=35))
            m=md.get('metadata',{}) or {}
            col=m.get('collection',[])
            if isinstance(col,str): col=[col]
            files=md.get('files',[]) or []
            pub=[]
            for f in files:
              n=str(f.get('name','') or '')
              if not n.lower().endswith('.pdf'): continue
              if n.lower().endswith('.lcpdf') or 'encrypted' in n.lower(): continue
              if str(f.get('private','false')).lower()=='true': continue
              pub.append(n)
            rec={
              'identifier': ident,
              'in_gtu': 'graduatetheologicalunion' in col,
              'title': m.get('title',''),
              'creator': m.get('creator',''),
              'year': m.get('year',''),
              'date': m.get('date',''),
              'volume': m.get('volume',''),
              'edition': m.get('edition',''),
              'series': m.get('series',''),
              'language': m.get('language',''),
              'subject': m.get('subject',''),
              'contributor': m.get('contributor',''),
              'description': m.get('description',''),
              'access_restricted': m.get('access-restricted-item',''),
              'printdisabled': m.get('printdisabled',''),
              'public_pdf': pub[0] if pub else '',
              'imagecount': m.get('imagecount','')
            }
            out.append(rec)
            print('VERIFY\t'+json.dumps(rec,ensure_ascii=False))
          assert len(out)==20
          assert all(r['in_gtu'] for r in out)
          with open('final.json','w',encoding='utf-8') as f:
            json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-final-candidates
          path: final.json
