name: GTU quick discovery 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact GTU collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          terms=[
          'Bible','biblical','Hebrew','Aramaic','Syriac','Semitic','Greek','Septuagint','textual criticism','manuscript','Qumran','Talmud','Mishnah','Ugaritic','Akkadian','archaeology','Palestine','Calvin','Luther','patristic','Journal of Biblical Literature','Biblical Archaeologist','Journal of Semitic Studies','New Testament Studies','Interpretation']
          seen={}
          for ti,t in enumerate(terms):
            for page in [1,3,6,10,15]:
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND (title:("{t}") OR subject:("{t}"))'
              p=[('q',q),('rows','40'),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              for f in ['identifier','title','creator','year','date','volume','language','subject','contributor']:
                p.append(('fl[]',f))
              try:
                d=json.load(urllib.request.urlopen('https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(p),timeout=25))
              except Exception: continue
              for x in d.get('response',{}).get('docs',[]):
                if x.get('identifier'): seen.setdefault(x['identifier'],x)
          print('QUICK_UNIQUE',len(seen))
          vals=list(seen.values())
          vals.sort(key=lambda x:(sum(ord(c) for c in x.get('identifier',''))%211,x.get('identifier','')))
          with open('quick.tsv','w',encoding='utf-8') as f:
            for i,x in enumerate(vals[:400],1):
              cr=x.get('creator',''); cr='; '.join(cr) if isinstance(cr,list) else str(cr)
              su=x.get('subject',''); su='; '.join(map(str,su[:3])) if isinstance(su,list) else str(su)
              row=[str(i),x.get('identifier',''),str(x.get('year',x.get('date',''))),str(x.get('volume','')),cr.replace('\t',' '),str(x.get('title','')).replace('\t',' '),su.replace('\t',' ')]
              line='\t'.join(row)
              f.write(line+'\n')
              print('Q\t'+line[:800])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-quick-candidates
          path: quick.tsv
