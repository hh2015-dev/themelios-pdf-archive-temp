name: TCHS Bridge Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tchs-bridge-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download one TCHS issue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge/tchs
          curl -fL --retry 4 --retry-delay 3 -A 'Mozilla/5.0' 'https://biblicalstudies.org.uk/pdf/congregational-history/01-1.pdf' -o bridge/tchs/01-1.pdf
          test "$(head -c 5 bridge/tchs/01-1.pdf)" = '%PDF-'
          ls -lh bridge/tchs/01-1.pdf
      - name: Commit bridge file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bridge/tchs/01-1.pdf
          git commit -m 'Temporary TCHS bridge file 01-1' || exit 0
          git push
