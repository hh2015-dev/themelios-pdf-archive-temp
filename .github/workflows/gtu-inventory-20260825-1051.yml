name: GTU inventory discovery 20260825
on:
  push:
    branches: [ gtu-inventory-20260825-1051 ]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine and verify GTU-only candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          BASE='https://archive.org'
          queries=[
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Hebrew OR Aramaic OR Syriac OR Semitic OR Ugaritic OR Akkadian)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Greek OR Septuagint OR LXX OR papyri OR manuscript)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Qumran OR "Dead Sea" OR Talmud OR Midrash OR Apocrypha OR Pseudepigrapha)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Genesis OR Exodus OR Isaiah OR Jeremiah OR Ezekiel OR Psalms OR Job OR Daniel)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Matthew OR Mark OR Luke OR John OR Acts OR Romans OR Corinthians OR Hebrews OR Revelation)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:("Biblical Archaeology" OR Palestine OR Assyria OR Babylonia OR Canaan OR archaeology)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Calvin OR Luther OR Augustine OR Origen OR Chrysostom OR Jerome)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:("Journal of Biblical Literature" OR "Biblical Archaeologist" OR "Bible Translator" OR "Semitic Studies" OR "Biblical Quarterly")',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Bible OR Biblical OR Judaism OR "Early Christianity") AND year:[1800 TO 1969]',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:("Hebrew language" OR "Greek language" OR "Syriac language" OR "Aramaic language")'
          ]
          def fetchjson(url,timeout=25):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GTUInventory/1.0'})
            with urllib.request.urlopen(req,timeout=timeout) as r:return json.load(r)
          def search_one(args):
            q,page=args
            p=[('q',q),('fl[]','identifier'),('fl[]','title'),('fl[]','creator'),('fl[]','year'),('fl[]','date'),('fl[]','subject'),('fl[]','language'),('rows','50'),('page',str(page)),('output','json')]
            try:return fetchjson(BASE+'/advancedsearch.php?'+urllib.parse.urlencode(p)).get('response',{}).get('docs',[])
            except Exception:return []
          docs={}; appearances=0
          tasks=[(q,p) for q in queries for p in (1,2,4,7,11)]
          with ThreadPoolExecutor(max_workers=12) as ex:
            for found in ex.map(search_one,tasks):
              appearances+=len(found)
              for d in found:
                if d.get('identifier'):docs[d['identifier']]=d
          A=['bible','biblical','old testament','new testament','hebrew','aramaic','syriac','semitic','greek','septuagint','lxx','textual','manuscript','qumran','dead sea','apocrypha','pseudepigrapha','talmud','midrash','assyri','babylon','canaan','archaeolog','genesis','exodus','isaiah','jeremiah','ezekiel','psalm','job','daniel','matthew','mark','luke','john','acts','romans','corinth','hebrews','revelation','calvin','luther','augustine','origen','chrysostom','jerome','concordance','lexicon','grammar','papyri']
          B=['theology','church history','reformation','patrist','doctrine','creed','confession','apolog','mission','judaism','early christian','religion']
          def score(d):
            txt=' '.join(str(d.get(k,'')) for k in ('title','subject','creator')).lower()
            return sum(3 for k in A if k in txt)+sum(1 for k in B if k in txt)+1
          ranked=sorted(docs.values(),key=lambda d:score(d),reverse=True)[:180]
          def verify(d):
            ident=d['identifier']
            try:m=fetchjson(BASE+'/metadata/'+urllib.parse.quote(ident))
            except Exception:return None
            md=m.get('metadata',{}); coll=md.get('collection',[])
            if isinstance(coll,str):coll=[coll]
            if 'graduatetheologicalunion' not in coll:return None
            files=m.get('files',[]); pubpdf=''
            for f in files:
              n=f.get('name','')
              if n.lower().endswith('.pdf') and not n.lower().endswith('.lcpdf') and 'encrypted' not in n.lower() and str(f.get('private','false')).lower()!='true':
                pubpdf=BASE+'/download/'+urllib.parse.quote(ident)+'/'+urllib.parse.quote(n);break
            return {'score':score(d),'identifier':ident,'title':md.get('title') or d.get('title',''),'creator':md.get('creator') or d.get('creator',''),'date':md.get('date') or md.get('year') or d.get('year') or d.get('date') or '','volume':md.get('volume',''),'edition':md.get('edition',''),'series':md.get('series',''),'subject':md.get('subject') or d.get('subject',''),'language':md.get('language') or d.get('language',''),'contributor':md.get('contributor',''),'pages':md.get('pages',''),'public_pdf':pubpdf,'restricted':md.get('access-restricted-item') or md.get('printdisabled') or '','collection':coll,'item_link':BASE+'/details/'+ident}
          verified=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
            futs=[ex.submit(verify,d) for d in ranked]
            for f in as_completed(futs):
              r=f.result()
              if r:verified.append(r)
          verified.sort(key=lambda r:r['score'],reverse=True)
          print('DISCOVERY_COUNTS\t'+json.dumps({'appearances':appearances,'unique':len(docs),'metadata_verified':len(verified)}))
          for r in verified[:140]:print('GTUCAND\t'+json.dumps(r,ensure_ascii=False,separators=(',',':')))
          PY
