name: ERT transfer test
on:
  pull_request:
    paths:
      - 'ert-transfer-trigger.txt'
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Download final ERT issues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2020/10/ERT-44-4.pdf' -o 'out/ERT-44-4.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2021/01/ERT-45-1_digital.pdf' -o 'out/ERT-45-1.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2021/04/ERT-45-2_digital.pdf' -o 'out/ERT-45-2.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2021/07/ERT-45-3-final.pdf' -o 'out/ERT-45-3.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2021/11/ERT-45-4_digital.pdf' -o 'out/ERT-45-4.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2022/02/ERT-46-1_digital.pdf' -o 'out/ERT-46-1.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2022/06/ERT-46-2c.pdf' -o 'out/ERT-46-2.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2022/09/ERT-46-3b.pdf' -o 'out/ERT-46-3.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2022/11/ERT-46-4_digital.pdf' -o 'out/ERT-46-4.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2023/01/ERT-47-1_web.pdf' -o 'out/ERT-47-1.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2023/05/ERT-47-2_web.pdf' -o 'out/ERT-47-2.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2023/07/ERT-47-3.pdf' -o 'out/ERT-47-3.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2023/10/ERT-47-4_web.pdf' -o 'out/ERT-47-4.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2024/01/ERT-48-1_web.pdf' -o 'out/ERT-48-1.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2024/05/ERT-48-2_web.pdf' -o 'out/ERT-48-2.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2024/08/ERT-48-3.pdf' -o 'out/ERT-48-3.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2024/10/ERT-48-4_web.pdf' -o 'out/ERT-48-4.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2025/05/ERT-49-1-print.pdf' -o 'out/ERT-49-1.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2025/12/ERT-49-2-web-updated.pdf' -o 'out/ERT-49-2.pdf'
          curl -L --fail --retry 3 'https://theology.worldea.org/wp-content/uploads/2026/06/ERT-50-1-2.pdf' -o 'out/ERT-50-1.pdf'
          test "$(find out -maxdepth 1 -type f -name 'ERT-*.pdf' | wc -l)" -eq 20
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ert-final-20
          path: out/*.pdf
          compression-level: 0
          retention-days: 1
