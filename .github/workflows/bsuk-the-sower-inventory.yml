name: BSUK The Sower inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bsuk-the-sower-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify all annual complete volumes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, os, pathlib, urllib.request
          outdir=pathlib.Path('bridge/the-sower/inventory')
          outdir.mkdir(parents=True, exist_ok=True)
          rows=[]
          ua={'User-Agent':'Mozilla/5.0 BSUK-The-Sower-Inventory/1.0'}
          for vol in range(1,40):
              year=1878+vol
              url=f'https://biblicalstudies.org.uk/pdf/the-sower/the-sower_{year}.pdf'
              fn=f'The Sower - Volume {vol:03d} ({year}) - Complete Volume.pdf'
              tmp=outdir / f'.tmp-{year}.pdf'
              status='ERROR'; size=0; sha=''; err=''
              try:
                  req=urllib.request.Request(url,headers=ua)
                  with urllib.request.urlopen(req,timeout=120) as r, open(tmp,'wb') as f:
                      h=hashlib.sha256()
                      head=b''
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          if len(head)<5: head += chunk[:5-len(head)]
                          h.update(chunk); f.write(chunk); size += len(chunk)
                  if head != b'%PDF-':
                      raise RuntimeError(f'not PDF signature: {head!r}')
                  if size < 10000:
                      raise RuntimeError(f'implausible size {size}')
                  sha=h.hexdigest(); status='OK'
              except Exception as e:
                  err=repr(e)
              finally:
                  try: tmp.unlink()
                  except FileNotFoundError: pass
              rows.append([vol,year,url,fn,status,size,sha,err])
              print(f'{vol:03d} {year} {status} {size} {sha} {err}')
          with open(outdir/'manifest.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f)
              w.writerow(['Volume','Year','SourceUrl','FileName','Status','Bytes','SHA256','Error'])
              w.writerows(rows)
          ok=sum(r[4]=='OK' for r in rows)
          with open(outdir/'summary.txt','w',encoding='utf-8') as f:
              f.write(f'TARGET=39\nOK={ok}\nFAILED={39-ok}\n')
          if ok != 39:
              raise SystemExit(f'Expected 39 valid PDFs, got {ok}')
          PY
      - name: Commit inventory manifest
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bridge/the-sower/inventory/
          git commit -m 'The Sower verified inventory manifest' || exit 0
          git push
