name: BSUK Anvil

on:
  push:
    paths:
      - 'bsuk_worker/download_anvil.py'
      - '.github/workflows/bsuk-anvil.yml'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Discover and download Anvil PDFs
        run: python bsuk_worker/download_anvil.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsuk-anvil
          path: out_anvil/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
