name: GTU inventory targeted 20260822 2242
on:
  pull_request:
    branches: [main]
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact GTU collection
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          BASE='https://archive.org'; COLL='graduatetheologicalunion'
          qs=[
            'collection:'+COLL+' AND mediatype:texts AND (title:Hebrew OR title:Greek OR title:Syriac OR title:Aramaic OR title:Septuagint OR title:Testament)',
            'collection:'+COLL+' AND mediatype:texts AND (title:Bible OR title:Biblical OR title:Gospel OR title:Commentary OR title:Exegesis OR title:Prophets)',
            'collection:'+COLL+' AND mediatype:texts AND (title:Patristic OR title:Church OR title:Reformation OR title:Luther OR title:Calvin OR title:Theology)',
            'collection:'+COLL+' AND mediatype:texts AND (title:Mission OR title:Judaism OR title:Archaeology OR title:Religion OR title:Creed OR title:Liturgy)'
          ]
          fields=['identifier','title','creator','date','volume','subject','contributor','language']
          docs=[]
          for qi,q in enumerate(qs):
              for sort in ['date asc','date desc']:
                  params=[('q',q)]+[('fl[]',f) for f in fields]+[('rows','80'),('page','1'),('output','json'),('sort[]',sort)]
                  with urllib.request.urlopen(BASE+'/advancedsearch.php?'+urllib.parse.urlencode(params),timeout=30) as r: data=json.load(r)
                  docs += data.get('response',{}).get('docs',[])
          unique={d.get('identifier'):d for d in docs if d.get('identifier')}
          A=['bible','biblical','testament','gospel','hebrew','aramaic','syriac','semitic','greek','septuagint','lxx','papyr','manuscript','codex','textual','masorah','talmud','mishna','midrash','rabbin','juda','apocryph','pseudepig','assyri','babylon','canaan','ugarit','palestine','archaeolog','lexicon','grammar','exeg','commentar','prophet','psalm']
          B=['patrist','church','reformation','luther','calvin','theolog','doctrine','creed','confession','apolog','mission','ecumen','liturgy','christian','jesuit','franciscan','anglican','baptist','methodist','presbyterian','orthodox','catholic']
          def flat(v): return ' '.join(map(str,v)) if isinstance(v,list) else str(v or '')
          def text(d): return (flat(d.get('title'))+' '+flat(d.get('creator'))+' '+flat(d.get('subject'))).lower()
          ranked=[]
          for d in unique.values():
              t=text(d); s=sum(5 for k in A if k in t)+sum(2 for k in B if k in t)
              ranked.append((s,d))
          ranked.sort(key=lambda x:(-x[0],str(x[1].get('date','')),x[1]['identifier']))
          pool=ranked[:120]
          def verify(pair):
              s,d=pair; ident=d['identifier']
              try:
                  with urllib.request.urlopen(BASE+'/metadata/'+urllib.parse.quote(ident),timeout=20) as r: m=json.load(r)
              except Exception: return None
              md=m.get('metadata',{}) or {}; coll=md.get('collection',[]); coll=[coll] if isinstance(coll,str) else coll
              if COLL not in coll: return None
              pdfs=[f for f in (m.get('files',[]) or []) if str(f.get('name','')).lower().endswith('.pdf')]
              if not pdfs: return None
              def rpdf(f):
                  n=str(f.get('name','')); return (0 if n==ident+'.pdf' else 1,1 if ('encrypted' in n.lower() or n.lower().endswith('.lcpdf')) else 0,len(n))
              pdf=sorted(pdfs,key=rpdf)[0]
              t=text({'title':md.get('title',d.get('title','')),'creator':md.get('creator',d.get('creator','')),'subject':md.get('subject',d.get('subject',''))})
              pri='A' if any(k in t for k in A) else ('B' if any(k in t for k in B) else 'C')
              return {'priority':pri,'identifier':ident,'title':md.get('title',d.get('title','')),'creator':md.get('creator',d.get('creator','')),'date':md.get('date',d.get('date','')),'volume':md.get('volume',d.get('volume','')),'edition':md.get('edition',''),'series':md.get('series',''),'subject':md.get('subject',d.get('subject','')),'contributor':md.get('contributor',d.get('contributor','')),'pages':md.get('imagecount',''),'pdf_name':pdf.get('name',''),'item_link':BASE+'/details/'+ident,'pdf_link':BASE+'/download/'+ident+'/'+urllib.parse.quote(pdf.get('name','')),'collection':coll,'score':s}
          out=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs=[ex.submit(verify,x) for x in pool]
              for f in as_completed(futs):
                  v=f.result()
                  if v: out.append(v)
          out.sort(key=lambda x:(x['priority'],-x['score'],x['identifier']))
          with open('gtu_targeted.json','w',encoding='utf-8') as f: json.dump({'examined_docs':len(docs),'unique_docs':len(unique),'verified_candidates':len(out),'candidates':out},f,ensure_ascii=False,indent=2)
          print(json.dumps({'examined_docs':len(docs),'unique_docs':len(unique),'verified_candidates':len(out)}))
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-targeted
          path: gtu_targeted.json
          retention-days: 2
