name: GTU Inventory Deep Discovery 20260825 1440
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Deep query GTU collection only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://archive.org/advancedsearch.php'
          queries=[
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Bible)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Old Testament)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(New Testament)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Hebrew OR Aramaic OR Syriac OR Semitic)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Greek OR Septuagint OR Papyri OR Manuscripts)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Judaism OR Talmud OR Midrash OR Qumran)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Archaeology OR Assyriology OR Babylonia OR Palestine)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Church history OR Patristics OR Reformation)',
            'collection:graduatetheologicalunion AND mediatype:texts AND subject:(Theology)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(commentary OR lexicon OR grammar OR concordance OR bibliography)',
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(journal OR review OR quarterly OR bulletin OR studies)'
          ]
          seen={}; examined=0
          fields=['identifier','title','creator','date','year','language','volume','subject','description']
          for q in queries:
            for page in (13,16,19,22,25,28,31):
              params=[('q',q)]+[('fl[]',f) for f in fields]+[('rows','100'),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              try:
                with urllib.request.urlopen(base+'?'+urllib.parse.urlencode(params),timeout=45) as r: data=json.load(r)
              except Exception: continue
              docs=data.get('response',{}).get('docs',[]); examined+=len(docs)
              for d in docs:
                if d.get('identifier'): seen[d['identifier']]=d
          # retain scholarly-looking texts, deliberately not only highest result rank
          keywords=['bible','biblical','testament','hebrew','aramaic','syriac','semit','greek','septuagint','papy','manuscript','textual','qumran','talmud','midrash','judaism','archaeolog','assyri','babyl','cuneiform','ugarit','philo','josephus','apocry','pseudep','genesis','exodus','isaiah','jeremiah','ezekiel','psalm','job','matthew','mark','luke','john','acts','romans','corinth','galat','hebrews','revelation','commentary','lexicon','grammar','concordance','bibliograph','patrist','calvin','luther','origen','augustine','theology','church history','mission']
          def txt(d):
            z=[]
            for k in ('title','creator','subject','description'):
              v=d.get(k,''); z += list(map(str,v)) if isinstance(v,list) else [str(v)]
            return ' '.join(z).lower()
          ranked=[]
          for d in seen.values():
            t=txt(d); score=sum(1 for k in keywords if k in t)
            if score>=1: ranked.append((score,d))
          # diversify by identifier order chunks rather than solely score
          ranked.sort(key=lambda x:(x[1].get('identifier','')))
          sample=[]
          if ranked:
            step=max(1,len(ranked)//260)
            sample=[ranked[i] for i in range(0,len(ranked),step)][:300]
          out=[]
          for score,d in sample:
            ident=d['identifier']
            try:
              with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=45) as r: m=json.load(r)
            except Exception: continue
            md=m.get('metadata',{}); coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if 'graduatetheologicalunion' not in coll: continue
            pdfs=[]
            for f in m.get('files',[]):
              n=str(f.get('name',''))
              if n.lower().endswith('.pdf') and not n.lower().endswith('_text.pdf') and str(f.get('private','false')).lower()!='true' and 'encrypted' not in n.lower() and not n.lower().endswith('.lcpdf'):
                pdfs.append((n,f.get('size'),f.get('source')))
            out.append({'identifier':ident,'title':md.get('title') or d.get('title'),'creator':md.get('creator') or d.get('creator'),'date':md.get('date') or d.get('date'),'year':md.get('year') or d.get('year'),'language':md.get('language') or d.get('language'),'volume':md.get('volume') or d.get('volume'),'subject':md.get('subject') or d.get('subject'),'description':md.get('description') or d.get('description'),'contributor':md.get('contributor'),'publisher':md.get('publisher'),'edition':md.get('edition'),'series':md.get('series'),'access_restricted':md.get('access-restricted-item') or md.get('printdisabled'),'public_pdfs':pdfs[:3],'score':score})
            if len(out)>=180: break
          with open('deep_candidates.jsonl','w',encoding='utf-8') as f:
            for x in out: f.write(json.dumps(x,ensure_ascii=False)+'\n')
          print('DEEP_EXAMINED_APPEARANCES',examined); print('DEEP_UNIQUE_CANDIDATES',len(seen)); print('DEEP_VERIFIED_GTU',len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-deep-candidates
          path: deep_candidates.jsonl
          compression-level: 6
