name: BSUK download probe

on:
  push:
    paths:
      - 'bsuk_worker/**'
      - '.github/workflows/bsuk-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bsuk_worker/probe_download.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-probe-pdf
          path: bsuk_probe/02-01.pdf
          retention-days: 1
