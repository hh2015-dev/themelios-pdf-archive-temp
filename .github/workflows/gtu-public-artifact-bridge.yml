name: GTU Public Artifact Bridge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PDFs
        run: |
          set -euo pipefail
          for f in gtu_temp_transfer/*.pdf; do
            test -s "$f"
            test "$(head -c 5 "$f")" = '%PDF-'
            file --mime-type "$f" | grep -q 'application/pdf'
          done
      - name: Upload GTU PDFs
        uses: actions/upload-artifact@v4
        with:
          name: gtu-five-pdfs-public-bridge
          path: gtu_temp_transfer/*.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
