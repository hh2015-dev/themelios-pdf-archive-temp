name: GTU inventory discovery 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          queries = [
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:Hebrew OR subject:Hebrew OR subject:Aramaic OR subject:Syriac OR subject:Semitic)', 8),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (subject:Bible OR title:Bible OR title:Testament OR subject:"Biblical criticism")', 13),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:Greek OR subject:Greek OR subject:Septuagint OR subject:papyri OR subject:manuscripts)', 6),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (subject:Assyrian OR subject:Akkadian OR subject:Babylonian OR subject:Ugaritic OR subject:archaeology)', 4),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:Isaiah OR title:Jeremiah OR title:Psalms OR title:Job OR title:Genesis OR title:Exodus)', 7),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:Matthew OR title:Mark OR title:Luke OR title:John OR title:Romans OR title:Paul)', 5),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (creator:Calvin OR creator:Luther OR creator:Origen OR creator:Augustine OR subject:patristic)', 3),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:"Journal of Biblical Literature" OR title:"Biblical Archaeologist" OR title:"Bible Translator" OR title:"Semitic Studies")', 9),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (subject:Judaism OR subject:Talmud OR subject:rabbinic OR subject:Philo OR subject:Josephus OR subject:Qumran)', 4),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:lexicon OR title:grammar OR title:concordance OR title:bibliography OR subject:lexicography)', 6),
          ]
          out=[]
          fields=['identifier','title','creator','year','date','volume','edition','series','subject','contributor','language']
          for q,page in queries:
              params=[('q',q),('rows','100'),('page',str(page)),('output','json')]+[('fl[]',f) for f in fields]
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as r:
                  data=json.load(r)
              docs=data.get('response',{}).get('docs',[])
              for d in docs:
                  d['_query']=q; d['_page']=page
                  out.append(d)
              time.sleep(.2)
          # unique by identifier
          uniq={d.get('identifier'):d for d in out if d.get('identifier')}
          with open('gtu_candidates.json','w',encoding='utf-8') as f:
              json.dump(list(uniq.values()),f,ensure_ascii=False,indent=2)
          print('UNIQUE_CANDIDATES',len(uniq))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates-20260825
          path: gtu_candidates.json
