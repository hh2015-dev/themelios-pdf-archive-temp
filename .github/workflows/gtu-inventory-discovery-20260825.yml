name: GTU inventory verify 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact GTU membership and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          ids = [
            'labibletraductio0015unse','labibletraductio0013unse','dasproblemdeszwe0000harn','peopleofoldtesta0000pete',
            'hexaglotbiblecom0000reve','ledivorcedanslen0000jose','historicalmapsof0000gern','svenskexegetiska0016unse_w4x5',
            'sim_near-eastern-archaeology_1951-09_14_3','sim_journal-of-biblical-literature_1929_48_3-4',
            'sim_journal-of-biblical-literature_1931_50_3','sim_journal-of-biblical-literature_1948-12_67_4',
            'sim_journal-of-biblical-literature_1960-09_79_3','sim_journal-of-near-eastern-studies_1943-10_2_4',
            'sim_journal-of-near-eastern-studies_1948-01_7_1','sim_journal-of-cuneiform-studies_1947_1_2',
            'sim_journal-of-cuneiform-studies_1948_2_1','sim_bulletin-of-the-american-schools-of-oriental-research_1958-10_151',
            'sim_bulletin-of-the-american-schools-of-oriental-research_1946-12_104','newtestamentinhi0000ghcm'
          ]
          out=[]
          for ident in ids:
              with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident), timeout=30) as r:
                  data=json.load(r)
              m=data.get('metadata',{})
              coll=m.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              files=data.get('files',[])
              pdfs=[]
              for f in files:
                  name=f.get('name','')
                  if name.lower().endswith('.pdf') and not name.lower().endswith('.lcpdf') and str(f.get('private','false')).lower()!='true' and 'encrypt' not in name.lower():
                      pdfs.append({'name':name,'size':f.get('size'),'source':f.get('source'),'format':f.get('format')})
              rec={'identifier':ident,'in_gtu':'graduatetheologicalunion' in coll,'collection':coll,'metadata':m,'public_pdfs':pdfs}
              out.append(rec)
              print(ident,'GTU=',rec['in_gtu'],'PDFS=',len(pdfs),'TITLE=',m.get('title',''))
              time.sleep(.1)
          with open('gtu_verified.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print('VERIFIED',sum(1 for x in out if x['in_gtu']),'OF',len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-20260825
          path: gtu_verified.json
