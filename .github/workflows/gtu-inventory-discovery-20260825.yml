name: GTU inventory verification 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GTU candidates
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify.py <<'PY'
          import json, urllib.request, urllib.parse, time
          ids='''grieksepapyri0000drjd
talmud0007vari
copticstudiesinh0000vari
keytosiddurgramm0000slot
studiesinbiblica0000gern
studiesinbiblica0000osca
studies-biblical-theology_1958_24
biblical-archaeology-review_1975-1989_index
supplementaulexi0000unse
gtu_32400003385139
recipientauthoro0000unse
expositionepistl0000unse
diebuchersamueli0003klos_y9g6
statusofwomeninm0000sapo
urexcavationskas0008sirl
josuevi1625vii6x0021unse
diejudischeliter0001unse
diejudischeliter0002unse
diejudischeliter0003unse
annuariodistudie0007unse
annuariodistudie0009unse
hosea0000john
bookofpsalmshebr0000vari
comparisonofegyp0000port
concordanceofpro0000thom_d6n9'''.split()
          out=[]
          for ident in ids:
            url='https://archive.org/metadata/'+urllib.parse.quote(ident)
            try:
              with urllib.request.urlopen(url,timeout=50) as r: m=json.load(r)
              md=m.get('metadata',{})
              coll=md.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              files=m.get('files',[])
              pdfs=[]
              for f in files:
                name=f.get('name','')
                if not name.lower().endswith('.pdf'): continue
                if f.get('private') is True or str(f.get('private','')).lower()=='true': continue
                if name.lower().endswith('.lcpdf') or 'encrypted' in name.lower(): continue
                pdfs.append({'name':name,'size':f.get('size'),'source':f.get('source'),'format':f.get('format')})
              rec={
                'identifier':ident,'gtu_member':'graduatetheologicalunion' in coll,'collection':coll,
                'title':md.get('title'),'creator':md.get('creator'),'date':md.get('date'),'year':md.get('year'),
                'volume':md.get('volume'),'edition':md.get('edition'),'series':md.get('series'),'subject':md.get('subject'),
                'language':md.get('language'),'contributor':md.get('contributor'),'description':md.get('description'),
                'imagecount':md.get('imagecount'),'access_restricted':md.get('access-restricted-item'),'printdisabled':md.get('printdisabled'),
                'mediatype':md.get('mediatype'),'pdfs':pdfs[:5]
              }
              out.append(rec)
            except Exception as e:
              out.append({'identifier':ident,'error':repr(e)})
            time.sleep(.08)
          with open('gtu_verified.jsonl','w',encoding='utf8') as f:
            for r in out: f.write(json.dumps(r,ensure_ascii=False)+'\n')
          print('VERIFIED',len(out),'GTU',sum(1 for r in out if r.get('gtu_member')))
          PY
          python /tmp/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-verification-20260825
          path: gtu_verified.jsonl
          compression-level: 6
