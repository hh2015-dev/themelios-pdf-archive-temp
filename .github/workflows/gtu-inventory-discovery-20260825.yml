name: GTU inventory replacement verify 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify replacement GTU items
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.parse
          ids=['sim_journal-of-biblical-literature_1955-03_74_1','sim_journal-of-biblical-literature_1955-06_74_2','sim_near-eastern-archaeology_1954-12_17_4','sim_journal-of-biblical-literature_1954-06_73_2']
          out=[]
          for iid in ids:
            m=json.loads(subprocess.check_output(['curl','-fsSL','--retry','3',f'https://archive.org/metadata/{iid}'],timeout=60))
            md=m.get('metadata',{}); coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            public=''
            for f in m.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith('.pdf') and not n.lower().endswith('.lcpdf') and 'encrypted' not in n.lower() and f.get('private') not in (True,'true','1'):
                public=n; break
            row={'identifier':iid,'in_gtu':'graduatetheologicalunion' in coll,'title':md.get('title',''),'creator':md.get('creator',''),'date':md.get('date',''),'volume':md.get('volume',''),'edition':md.get('edition',''),'language':md.get('language',''),'contributor':md.get('contributor',''),'subject':md.get('subject',''),'access_restricted':md.get('access-restricted-item',''),'public_pdf_url':f'https://archive.org/download/{iid}/{urllib.parse.quote(public)}' if public else '', 'imagecount':md.get('imagecount','')}
            out.append(row); print(json.dumps(row,ensure_ascii=False))
          with open('gtu_replacements.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-replacements-20260825
          path: gtu_replacements.json
