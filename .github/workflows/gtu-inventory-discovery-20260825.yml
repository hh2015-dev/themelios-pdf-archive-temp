name: GTU inventory discovery 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection broadly
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mine.py <<'PY'
          import json, urllib.parse, urllib.request, time
          terms = [
            'Hebrew','Aramaic','Syriac','Semitic','Septuagint','textual criticism','manuscript','papyri','Qumran','Dead Sea Scrolls',
            'Ugaritic','Akkadian','Assyrian','Babylonian','Coptic','rabbinic','Talmud','Midrash','Apocrypha','Pseudepigrapha',
            'Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Samuel','Kings','Chronicles',
            'Isaiah','Jeremiah','Ezekiel','Daniel','Hosea','Amos','Micah','Zechariah','Psalms','Job',
            'Matthew','Mark','Luke','John','Acts','Romans','Corinthians','Hebrews','Revelation','New Testament Greek',
            'biblical archaeology','biblical theology','history of interpretation','Origen','Jerome','Augustine','Calvin','Luther','patristic','Reformation',
            'concordance','lexicon','grammar','bibliography','Journal of Biblical Literature','Bible Translator','Biblical Archaeologist','Palestine Exploration'
          ]
          seen={}
          examined=0
          for term in terms:
            q=f'collection:graduatetheologicalunion AND mediatype:texts AND (title:"{term}" OR subject:"{term}")'
            params={
              'q':q,'fl[]':['identifier','title','creator','year','date','volume','subject','language','contributor','description'],
              'rows':'100','page':'1','output':'json'
            }
            url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True)
            try:
              with urllib.request.urlopen(url, timeout=40) as r:
                docs=json.load(r)['response']['docs']
            except Exception as e:
              print('ERR',term,repr(e)); continue
            examined += len(docs)
            for d in docs:
              ident=d.get('identifier')
              if ident and ident not in seen:
                d['_term']=term; seen[ident]=d
            time.sleep(0.05)
          with open('gtu_candidates.jsonl','w',encoding='utf-8') as f:
            for d in seen.values(): f.write(json.dumps(d,ensure_ascii=False)+'\n')
          with open('gtu_counts.txt','w') as f:
            f.write(f'appearances={examined}\nunique={len(seen)}\n')
          print('APPEARANCES',examined,'UNIQUE',len(seen))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-discovery-20260825
          path: |
            gtu_candidates.jsonl
            gtu_counts.txt
          compression-level: 6
