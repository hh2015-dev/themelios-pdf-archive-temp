name: GTU Inventory 20 discovery
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine and verify GTU candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests, json
          base='https://archive.org/advancedsearch.php'
          specs=[
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:hebrew OR title:aramaic OR title:syriac OR title:semitic)',11),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:septuagint OR title:greek OR title:papyr* OR title:manuscript*)',13),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:testament OR title:gospel OR title:epistle OR title:bible)',19),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:archaeolog* OR title:palestine OR title:assyri* OR title:babylon* OR title:ugarit*)',7),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:rabbin* OR title:talmud OR title:midrash OR title:apocrypha OR title:pseudepigrapha)',5),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:commentar* OR title:exegesis OR title:interpretation OR title:lexicon OR title:grammar)',23),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:isaiah OR title:jeremiah OR title:ezekiel OR title:daniel OR title:psalm*)',17),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:genesis OR title:exodus OR title:deuteronomy OR title:job OR title:proverb*)',21),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:romans OR title:corinth* OR title:galatian* OR title:ephesians OR title:acts)',9),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:revelation OR title:john OR title:luke OR title:mark OR title:matthew)',15),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:patrist* OR title:origen OR title:augustine OR title:chrysostom OR title:jerome)',8),
            ('collection:graduatetheologicalunion AND mediatype:texts AND (title:calvin OR title:luther OR title:reformation OR title:theology)',14)
          ]
          seen={}; examined=0
          for q,page in specs:
            params={'q':q,'fl[]':['identifier','title','creator','year','date','language','volume','edition','contributor'],'rows':25,'page':page,'output':'json'}
            r=requests.get(base,params=params,timeout=20); r.raise_for_status()
            docs=r.json()['response']['docs']; examined+=len(docs)
            for d in docs: seen.setdefault(d.get('identifier'),d)
          keywords=['hebrew','aramaic','syriac','semitic','septuagint','greek','papyr','manuscript','old testament','new testament','gospel','epistle','bible','archaeolog','palestine','assyri','babylon','ugarit','talmud','midrash','apocrypha','pseudepigrapha','commentar','exegesis','lexicon','grammar','isaiah','jeremiah','genesis','exodus','job','psalm','romans','corinth','acts','revelation','calvin','luther']
          def score(d):
            s=((d.get('title') or '')+' '+str(d.get('creator') or '')).lower()
            return sum(1 for k in keywords if k in s)
          cand=sorted(seen.values(), key=score, reverse=True)
          out=[]
          for d in cand[:60]:
            ident=d.get('identifier')
            try: m=requests.get(f'https://archive.org/metadata/{ident}',timeout=15).json()
            except Exception: continue
            md=m.get('metadata',{}); coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if 'graduatetheologicalunion' not in coll: continue
            restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
            pdf=''
            if not restricted:
              for f in m.get('files',[]):
                n=f.get('name',''); priv=str(f.get('private','')).lower()=='true'
                if n.lower().endswith('.pdf') and not n.lower().endswith('.lcpdf') and 'encrypted' not in n.lower() and not priv:
                  pdf=n; break
            x={'identifier':ident,'title':md.get('title') or d.get('title') or '', 'creator':md.get('creator') or d.get('creator') or '', 'year':md.get('year') or md.get('date') or d.get('year') or '', 'language':md.get('language') or d.get('language') or '', 'volume':md.get('volume') or '', 'edition':md.get('edition') or '', 'series':md.get('series') or '', 'contributor':md.get('contributor') or '', 'restricted':restricted, 'pdf':pdf}
            out.append(x)
            if len(out)>=45: break
          print('EXAMINED',examined,'UNIQUE',len(seen),'VERIFIED',len(out))
          for x in out: print(json.dumps(x,ensure_ascii=False))
          PY
