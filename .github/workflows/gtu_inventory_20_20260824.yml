name: GTU inventory 20 discovery 20260824 fast
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection and verify public PDFs concurrently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests, json, re
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor, as_completed
          BASE='https://archive.org'
          queries=[
            ('A','Syriac / Aramaic','(title:(Syriac) OR subject:(Syriac) OR title:(Aramaic) OR subject:(Aramaic))'),
            ('A','Hebrew / Masora','(title:(Masora) OR title:(Masoretic) OR subject:(Masoretic) OR title:(Hebrew grammar))'),
            ('A','LXX / Textual Criticism','(title:(Septuagint) OR subject:(Septuagint) OR title:(textual criticism) OR subject:(textual criticism))'),
            ('A','Qumran / Second Temple','(title:(Qumran) OR subject:(Qumran) OR title:(Dead Sea Scrolls) OR subject:(Dead Sea Scrolls))'),
            ('A','Apocrypha / Pseudepigrapha','(title:(Apocrypha) OR title:(Pseudepigrapha) OR subject:(Pseudepigrapha))'),
            ('A','Rabbinic Literature','(title:(Mishnah) OR title:(Talmud) OR subject:(rabbinic) OR title:(Midrash))'),
            ('A','ANE / Assyriology','(title:(Assyri*) OR subject:(Assyriology) OR title:(Babylon*) OR title:(Ugarit*) OR subject:(cuneiform))'),
            ('A','Biblical Archaeology','(subject:(Biblical archaeology) OR title:(Palestine archaeology) OR title:(biblical archaeology))'),
            ('A','Patristic Exegesis','(title:(Origen) OR title:(Jerome) OR title:(Chrysostom) OR title:(Ephrem) OR title:(Theodoret))'),
            ('A','Lexicons / Grammars','(title:(lexicon) OR title:(grammar) OR title:(concordance)) AND (title:(Hebrew) OR title:(Greek) OR title:(Syriac) OR title:(Aramaic))'),
            ('A','Biblical Studies Journals','(title:(Journal) OR title:(Review) OR title:(Bulletin)) AND (subject:(Bible) OR subject:(Biblical))'),
            ('B','Church History / Patristics','(title:(patristic) OR subject:(patristics) OR title:(church history) OR title:(early church))'),
            ('B','Reformation','(title:(Reformation) OR subject:(Reformation))'),
            ('B','Missions','(title:(missions) OR subject:(missions) OR title:(missionary))'),
            ('B','Judaism / Early Christianity','(title:(Judaism) OR subject:(Judaism) OR title:(early Christianity))')]
          docs=[]; seen=set(); examined=0
          for pri,subj,qfrag in queries:
            for page in (1,3,6):
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND {qfrag}'
              params=[('q',q),('rows',35),('page',page),('output','json')]
              for f in ['identifier','title','creator','year','volume','edition','series','subject','contributor']:
                params.append(('fl[]',f))
              try:
                rr=requests.get(BASE+'/advancedsearch.php',params=params,timeout=15); rr.raise_for_status()
                dd=rr.json().get('response',{}).get('docs',[])
              except Exception:
                dd=[]
              examined += len(dd)
              for d in dd:
                ident=d.get('identifier')
                if ident and ident not in seen:
                  seen.add(ident); d['_priority']=pri; d['_subject']=subj; docs.append(d)
          def txt(v):
            if isinstance(v,list): return '; '.join(map(str,v))
            return '' if v is None else str(v)
          def verify(d):
            ident=d['identifier']
            try:
              m=requests.get(BASE+'/metadata/'+quote(ident,safe=''),timeout=12).json()
            except Exception:
              return None
            md=m.get('metadata',{}) or {}
            col=md.get('collection',[])
            if isinstance(col,str): col=[col]
            if 'graduatetheologicalunion' not in col: return None
            pubs=[]
            for f in (m.get('files',[]) or []):
              n=f.get('name','')
              if not re.search(r'\.pdf$',n,re.I): continue
              if re.search(r'(encrypted|\.lcpdf$)',n,re.I): continue
              if str(f.get('private','false')).lower()=='true': continue
              pubs.append(f)
            if not pubs: return None
            pubs.sort(key=lambda f:(0 if f.get('source')=='original' else 1, -int(f.get('size') or 0)))
            pdf=pubs[0]
            return {
              'priority':d['_priority'],'subject':d['_subject'],'identifier':ident,
              'title':txt(md.get('title') or d.get('title')),
              'creator':txt(md.get('creator') or d.get('creator')),
              'year':txt(md.get('date') or md.get('year') or d.get('year')),
              'volume':txt(md.get('volume') or d.get('volume')),
              'edition':txt(md.get('edition') or d.get('edition')),
              'series':txt(md.get('series') or d.get('series')),
              'contributor':txt(md.get('contributor') or d.get('contributor') or 'Internet Archive'),
              'pdf':BASE+'/download/'+quote(ident,safe='')+'/'+quote(pdf.get('name',''),safe=''),
              'pdf_size':txt(pdf.get('size')),
              'item':BASE+'/details/'+quote(ident,safe='')}
          verified=[]
          with ThreadPoolExecutor(max_workers=20) as ex:
            futs=[ex.submit(verify,d) for d in docs[:500]]
            for f in as_completed(futs):
              x=f.result()
              if x: verified.append(x)
          verified.sort(key=lambda x:(0 if x['priority']=='A' else 1, x['subject'], x['year'], x['title']))
          print('EXAMINED',examined,'UNIQUE',len(seen),'METADATA_CHECKED',min(500,len(docs)),'VERIFIED',len(verified))
          for i,x in enumerate(verified[:160],1): print('CAND',i,json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY
