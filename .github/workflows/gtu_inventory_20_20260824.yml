name: GTU inventory selected 20 verify 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected 20 exact GTU items
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests, json, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import quote
          BASE='https://archive.org'
          ids='''gtu_32400002882953
gtu_32400005364272
lareligionassyro0000lepp
historyofbabylon0002roge
gtu_32400005673540
studienzurassyri0000unse
dasakkadischesyl0000sode
analyticalgreekl0000vari_f4v8
archaeologyinbib0000walt
newdirectionsinb0000davi
elcristianismoyl00unse
deadseascrollsof0002burr
qumranunddieanfa0000wern
lesaffinitesqumr0000copp
mythmiraclemidra0000emil
toldothamishpatb0001gula
treasuresoftalmu0000unse
catalogueofsyria0000wwri_r6z2
gtu_32400004571927
aramaicdocuments0000pier'''.splitlines()
          def txt(v):
            if isinstance(v,list): return '; '.join(map(str,v))
            return '' if v is None else str(v)
          def check(ident):
            try:
              r=requests.get(BASE+'/metadata/'+quote(ident,safe=''),timeout=15); r.raise_for_status(); m=r.json()
            except Exception as e: return {'identifier':ident,'ok':False,'error':str(e)}
            md=m.get('metadata',{}) or {}; col=md.get('collection',[])
            if isinstance(col,str): col=[col]
            ok='graduatetheologicalunion' in col
            pdfs=[]
            for f in m.get('files',[]) or []:
              n=f.get('name','')
              if re.search(r'\.pdf$',n,re.I) and not re.search(r'(encrypted|\.lcpdf$)',n,re.I) and str(f.get('private','false')).lower()!='true':
                pdfs.append(f)
            pdf=''
            if pdfs:
              pdfs.sort(key=lambda f:(0 if f.get('source')=='original' else 1,-int(f.get('size') or 0)))
              pdf=BASE+'/download/'+quote(ident,safe='')+'/'+quote(pdfs[0].get('name',''),safe='')
            return {'identifier':ident,'ok':ok,'title':txt(md.get('title')),'creator':txt(md.get('creator')),'year':txt(md.get('date') or md.get('year')),'volume':txt(md.get('volume')),'edition':txt(md.get('edition')),'series':txt(md.get('series')),'contributor':txt(md.get('contributor') or 'Internet Archive'),'pdf':pdf,'public_pdf':bool(pdfs),'item':BASE+'/details/'+quote(ident,safe='')}
          out=[]
          with ThreadPoolExecutor(max_workers=20) as ex:
            fs={ex.submit(check,i):i for i in ids}
            for f in as_completed(fs): out.append(f.result())
          order={v:i for i,v in enumerate(ids)}; out.sort(key=lambda x:order[x['identifier']])
          for x in out: print('VER',json.dumps(x,ensure_ascii=False,separators=(',',':')))
          print('COUNT',sum(1 for x in out if x.get('ok')), 'PUBLICPDF',sum(1 for x in out if x.get('public_pdf')))
          PY
