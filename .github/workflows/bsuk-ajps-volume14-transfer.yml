name: BSUK AJPS Volume 14 Transfer

on:
  push:
    branches:
      - ajps-volume-14-transfer
    paths:
      - 'bsuk_worker/ajps_volume14_transfer.py'
      - '.github/workflows/bsuk-ajps-volume14-transfer.yml'
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Discover and download AJPS Volume 14 PDFs from BSUK
        run: python bsuk_worker/ajps_volume14_transfer.py
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsuk-ajps-v14
          path: out_ajps14/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
