name: RCL Discovery Temp
on:
  push:
    branches:
      - 'temp/rcl-discovery-20260822'
  pull_request:
    branches:
      - main
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Discover RCL corpus
        shell: bash
        run: |
          python - <<'PY'
          import requests, re, json, hashlib, csv, os, time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          base='https://biblicalstudies.org.uk/'
          out='rcl_discovery'
          os.makedirs(out, exist_ok=True)
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; BSUK-Archive-Audit/1.0)'})
          pages=[]; pdf_rows=[]
          misses=0
          for i in range(1,31):
              url=f'{base}articles_rcl_{i:02d}.php'
              try:
                  r=s.get(url,timeout=30,allow_redirects=True)
                  status=r.status_code
              except Exception as e:
                  pages.append({'index':i,'url':url,'status':'ERROR','error':str(e)})
                  continue
              if status==404:
                  misses += 1
                  pages.append({'index':i,'url':url,'status':404})
                  if misses>=3 and i>4: break
                  continue
              misses=0
              ct=r.headers.get('content-type','')
              text=r.text if 'text' in ct or 'html' in ct or r.content else ''
              soup=BeautifulSoup(text,'html.parser')
              title=(soup.title.get_text(' ',strip=True) if soup.title else '')
              h1=' | '.join(x.get_text(' ',strip=True) for x in soup.find_all(['h1','h2'])[:4])
              pages.append({'index':i,'url':url,'final_url':r.url,'status':status,'bytes':len(r.content),'title':title,'headings':h1})
              open(f'{out}/page_{i:02d}.html','wb').write(r.content)
              for a in soup.find_all('a',href=True):
                  href=a['href'].strip()
                  if '.pdf' not in href.lower(): continue
                  full=urljoin(r.url,href)
                  # capture nearest useful context
                  node=a
                  context=''
                  for parent_name in ['li','tr','p','div']:
                      p=a.find_parent(parent_name)
                      if p:
                          t=' '.join(p.stripped_strings)
                          if len(t)>=len(a.get_text(' ',strip=True)):
                              context=t; break
                  if not context:
                      context=' '.join(a.stripped_strings)
                  pdf_rows.append({'page_index':i,'page_url':url,'pdf_url':full,'anchor':' '.join(a.stripped_strings),'context':context[:1500]})
          # unique URLs
          unique={}
          for row in pdf_rows:
              unique.setdefault(row['pdf_url'],row)
          checks=[]
          hashes={}
          for n,(u,row) in enumerate(unique.items(),1):
              rec=dict(row)
              try:
                  rr=s.get(u,timeout=60,allow_redirects=True)
                  data=rr.content
                  rec.update({'http_status':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type',''),'bytes':len(data),'pdf_magic':data.startswith(b'%PDF-')})
                  if rr.ok and data.startswith(b'%PDF-'):
                      sha=hashlib.sha256(data).hexdigest(); rec['sha256']=sha
                      hashes.setdefault(sha,[]).append(u)
                  else: rec['sha256']=''
              except Exception as e:
                  rec.update({'http_status':'ERROR','error':str(e),'bytes':0,'pdf_magic':False,'sha256':''})
              checks.append(rec)
              print(f'CHECK {n}/{len(unique)} {rec.get("http_status")} {u}')
          dup_content={k:v for k,v in hashes.items() if len(v)>1}
          result={'pages':pages,'pdf_link_occurrences':len(pdf_rows),'unique_pdf_urls':len(unique),'checks':checks,'duplicate_content':dup_content}
          open(f'{out}/inventory.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          with open(f'{out}/inventory.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['page_index','page_url','pdf_url','anchor','context','http_status','final_url','content_type','bytes','pdf_magic','sha256'],extrasaction='ignore')
              w.writeheader(); w.writerows(checks)
          print('SUMMARY_JSON '+json.dumps({'pages_ok':[p['index'] for p in pages if p.get('status')==200],'unique_pdf_urls':len(unique),'duplicate_hash_groups':len(dup_content)},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcl-discovery
          path: rcl_discovery/
          retention-days: 3
