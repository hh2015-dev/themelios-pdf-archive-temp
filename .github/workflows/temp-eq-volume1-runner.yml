name: TEMP EQ Volume 1
on:
  pull_request:
    branches: [main]
    paths:
      - 'bsuk_worker/temp_eq_volume1.py'
      - 'eq-volume1-trigger.txt'
permissions:
  contents: read
jobs:
  volume1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pymupdf
      - name: Download and validate Volume 1
        run: python bsuk_worker/temp_eq_volume1.py
      - uses: actions/upload-artifact@v4
        with:
          name: eq-volume-001
          path: eq_volume_001/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
