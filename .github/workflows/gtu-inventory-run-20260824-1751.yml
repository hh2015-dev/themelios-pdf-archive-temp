name: GTU inventory discovery 20260824-1751
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Sample diverse exact GTU collection pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          : > out/sample.tsv
          q='collection:graduatetheologicalunion AND mediatype:texts'
          enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
          for page in 7 17 29 41 53 67 83; do
            curl -fsSL --retry 3 "https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=year&fl[]=date&fl[]=volume&fl[]=edition&fl[]=series&fl[]=subject&rows=100&page=$page&sort[]=identifier+asc&output=json" -o s.json || continue
            jq -r '.response.docs[] | [(.identifier//""),(.title//""|if type=="array" then join("; ") else . end),(.creator//""|if type=="array" then join("; ") else . end),(.year//.date//""|tostring),(.volume//""|tostring),(.edition//""|if type=="array" then join("; ") else . end),(.series//""|if type=="array" then join("; ") else . end),(.subject//""|if type=="array" then join("; ") else . end)] | @tsv' s.json >> out/sample.tsv
          done
          sort -u out/sample.tsv -o out/sample.tsv
          echo "SAMPLED=$(wc -l < out/sample.tsv | tr -d ' ')" > out/summary.txt
          grep -Ei 'bible|biblical|testament|hebrew|aramaic|syriac|semitic|greek|septuagint|manuscript|textual|scroll|qumran|apocryph|pseudepigraph|rabbin|talmud|midrash|mishnah|targum|assyri|akkad|babylon|ugarit|coptic|papyr|archaeolog|palestine|israel|juda|gospel|genesis|exodus|leviticus|numbers|deuteronomy|joshua|judges|samuel|kings|chronicles|ezra|nehemiah|esther|job|psalm|proverb|ecclesiast|isaiah|jeremiah|ezekiel|daniel|hosea|joel|amos|obadiah|jonah|micah|nahum|habakkuk|zephaniah|haggai|zechariah|malachi|matthew|mark|luke|john|acts|romans|corinth|galatian|ephesian|philippian|colossian|thessalon|timothy|titus|philemon|hebrews|james|peter|jude|revelation|patrist|augustine|origen|jerome|chrysostom|calvin|luther|reformation|theology|creed|confession|mission|christianity|judaism' out/sample.tsv | head -n 220 | tee out/academic.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-diverse-sample-20260824
          path: out/
          compression-level: 6
