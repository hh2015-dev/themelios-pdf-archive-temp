name: GTU inventory discovery temp
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Broad GTU inventory scan
        shell: bash
        run: |
          set -euo pipefail
          : > discovery.tsv
          queries=(
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Bible OR biblical OR testament OR gospel OR psalm OR Isaiah OR Genesis OR Exodus OR Deuteronomy OR Jeremiah OR Daniel)'
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Greek OR Hebrew OR Aramaic OR Syriac OR Septuagint OR lexicon OR grammar OR concordance OR papyri OR manuscript)'
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Talmud OR Mishnah OR Jewish OR Judaism OR rabbinic OR Palestine OR Babylonian OR Assyrian OR archaeology)'
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Augustine OR Chrysostom OR Jerome OR Irenaeus OR Eusebius OR patristic OR fathers)'
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(Calvin OR Luther OR Reformation OR commentary OR commentaries OR theology OR doctrine)'
            'collection:graduatetheologicalunion AND mediatype:texts AND title:(mission OR missionary OR church OR apologetic OR creed OR confession OR liturgy)'
          )
          for q in "${queries[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            for page in 2 5 9 14; do
              curl -fsSL --max-time 20 "https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier,title,creator,date,year,language,subject&rows=50&page=$page&output=json&sort[]=identifier%20asc" -o /tmp/s.json || continue
              jq -r '.response.docs[] | [(.identifier//""),(.title//""),((.creator//"")|if type=="array" then join("; ") else . end),((.date//.year//"")|tostring),((.language//"")|if type=="array" then join("; ") else . end),((.subject//"")|if type=="array" then join(" | ") else . end)] | @tsv' /tmp/s.json >> discovery.tsv
            done
          done
          awk -F '\t' '!seen[$1]++' discovery.tsv > discovery_unique.tsv
          echo EXAMINED_UNIQUE=$(wc -l < discovery_unique.tsv)
          cat discovery_unique.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-broad-discovery
          path: discovery_unique.tsv
