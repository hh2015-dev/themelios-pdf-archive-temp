name: GTU inventory discovery temp
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected GTU candidates
        shell: bash
        run: |
          cat > /tmp/verify.py <<'PY'
          import requests,json,re
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          ids='''interlinearliter0000unse_p1f1
comparativelexic0000lesl
elementsofnewtes0000nunn_s3p9
gtu_A32400007918240B
catalogueogsyria0002will
catalogueofsyria0003wwri_u7g2
criticalexegetic0000jame_y5m2
babylonianhebrew00unse
pirkeabothtracta00abot
completeconcorda0000mcha
britishacademyco0000unse
biblicalarchaeol0000paul_p2k4
calvinscommentar0000calv_t7a9
calvinscommentar0001calv_d4p3
calvinscommentar0000calv_l1l6
calvinscommentar0000calv_f0b6
calvinscommentar0000calv_d6n5
commentaryonsain0000luth_w5x9
biblicalcommenta0001fdel
biblicalcommenta0001cfke_q6u5
biblicalcommenta0000cfke_e8q2
copticgnosticpap0001math
boreickejewishda0000unse
contributionofis00unse
gtu_A32400000614762B
conccordanceofhe0000bdav
hibehpapyri0000bern
origengreekpatri0000will
handbookofaramai0000ross
interlinearlinea0000geor'''.splitlines()
          def txt(v):
            if isinstance(v,list): return '; '.join(map(str,v))
            return '' if v is None else str(v)
          def one(ident):
            try:m=requests.get('https://archive.org/metadata/'+ident,timeout=20).json()
            except Exception as e:return {'identifier':ident,'error':str(e)}
            md=m.get('metadata',{}) or {}; coll=md.get('collection',[])
            if isinstance(coll,str):coll=[coll]
            files=m.get('files',[]) or []
            pdfs=[]
            for f in files:
              n=f.get('name','')
              if re.search(r'\.pdf$',n,re.I) and f.get('private') not in (True,'true') and not re.search(r'encrypted\.pdf$',n,re.I) and not re.search(r'\.lcpdf$',n,re.I):pdfs.append(f)
            pdf=sorted(pdfs,key=lambda f:(f.get('source')!='original',-int(f.get('size') or 0)))[0] if pdfs else None
            return {'identifier':ident,'gtu_member':'graduatetheologicalunion' in coll,'title':txt(md.get('title')),'creator':txt(md.get('creator')),'date':txt(md.get('date') or md.get('year')),'volume':txt(md.get('volume')),'edition':txt(md.get('edition')),'series':txt(md.get('series')),'subject':txt(md.get('subject')),'language':txt(md.get('language')),'contributor':txt(md.get('contributor')),'pages':txt(md.get('imagecount')),'mediatype':txt(md.get('mediatype')),'pdf_name':pdf.get('name','') if pdf else '','pdf_size':pdf.get('size','') if pdf else '','item_link':'https://archive.org/details/'+ident,'pdf_link':('https://archive.org/download/'+ident+'/'+quote(pdf.get('name',''))) if pdf else ''}
          out=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
            futs={ex.submit(one,i):i for i in ids}
            for f in as_completed(futs):out.append(f.result())
          out.sort(key=lambda x:ids.index(x['identifier']))
          with open('verified.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          for x in out:print(json.dumps(x,ensure_ascii=False))
          PY
          python /tmp/verify.py | tee verified.log
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-candidates
          path: verified.json
