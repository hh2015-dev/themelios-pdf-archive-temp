name: GTU inventory discovery temp
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection only
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import requests, json, re, time, csv
          from urllib.parse import quote
          base='https://archive.org/advancedsearch.php'
          q='collection:graduatetheologicalunion AND mediatype:texts'
          docs=[]
          # Broad, stable slices of the corpus rather than only first results.
          for page in [1,3,6,9,12,15,18,21,24,27,30,35,40]:
              params=[('q',q),('rows','100'),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              for f in ['identifier','title','creator','date','year','volume','language','subject']:
                  params.append(('fl[]',f))
              r=requests.get(base,params=params,timeout=45); r.raise_for_status()
              docs.extend(r.json().get('response',{}).get('docs',[]))
              time.sleep(.15)
          # Dedup identifiers and academic prioritization from IA metadata only.
          seen=set(); cand=[]
          A = re.compile(r'\b(bible|biblical|testament|gospel|genesis|exodus|leviticus|numbers|deuteronomy|joshua|judges|samuel|kings|chronicles|ezra|nehemiah|esther|job|psalm|proverbs|ecclesiastes|isaiah|jeremiah|ezekiel|daniel|prophet|hebrew|aramaic|syriac|semitic|greek|septuagint|lxx|manuscript|papyr|textual|criticism|talmud|mishnah|rabbin|jewish|judaism|assyri|babylon|sumer|ugarit|palestin|archaeolog|apocry|pseudepigraph|concordance|lexicon|grammar|commentar|exegesis|hermeneut|scripture)\b',re.I)
          B = re.compile(r'\b(patrist|father|augustine|jerome|origen|chrysostom|irenaeus|eusebius|tertullian|cyprian|calvin|luther|reformation|theolog|doctrine|dogma|creed|confession|church history|mission|missiology|apolog|philosophy of religion|christianity|ecclesiast|liturgy|council|monastic|jesuit|franciscan)\b',re.I)
          for d in docs:
              ident=d.get('identifier','')
              if not ident or ident in seen: continue
              seen.add(ident)
              title=d.get('title','') or ''
              subj=d.get('subject','') or ''
              if isinstance(subj,list): subj=' | '.join(map(str,subj))
              text=title+' '+subj
              pri='A' if A.search(text) else ('B' if B.search(text) else '')
              if not pri: continue
              score=(12 if pri=='A' else 5)+len(A.findall(text))*2+len(B.findall(text))
              cand.append((score,pri,d))
          cand.sort(key=lambda x:(-x[0], x[2].get('identifier','')))
          # Resolve exact IA item metadata and public non-encrypted PDF for top 140.
          out=[]; examined=0
          for score,pri,d in cand[:160]:
              ident=d['identifier']; examined+=1
              try:
                  m=requests.get('https://archive.org/metadata/'+quote(ident,safe=''),timeout=45).json()
              except Exception:
                  continue
              md=m.get('metadata',{}) or {}
              col=md.get('collection',[])
              if isinstance(col,str): col=[col]
              if 'graduatetheologicalunion' not in col: continue
              files=m.get('files',[]) or []
              pdfs=[]
              for f in files:
                  n=f.get('name','') or ''
                  if not n.lower().endswith('.pdf'): continue
                  if n.lower().endswith('.lcpdf') or 'encrypted' in n.lower(): continue
                  if str(f.get('private','false')).lower()=='true': continue
                  pdfs.append(f)
              if not pdfs: continue
              # prefer original/public pdf and shortest sane filename
              pdf=sorted(pdfs,key=lambda f:(0 if f.get('source')=='original' else 1,len(f.get('name',''))))[0]
              title=md.get('title') or d.get('title') or ''
              creator=md.get('creator') or d.get('creator') or ''
              if isinstance(creator,list): creator='; '.join(map(str,creator))
              date=md.get('date') or md.get('year') or d.get('date') or d.get('year') or ''
              volume=md.get('volume') or d.get('volume') or ''
              language=md.get('language') or d.get('language') or ''
              if isinstance(language,list): language='; '.join(map(str,language))
              subject=md.get('subject') or d.get('subject') or ''
              if isinstance(subject,list): subject=' | '.join(map(str,subject))
              pages=md.get('pages') or md.get('pagecount') or md.get('page_count') or ''
              edition=md.get('edition') or ''
              series=md.get('series') or ''
              contributor=md.get('contributor') or md.get('scanner') or 'Internet Archive'
              if isinstance(contributor,list): contributor='; '.join(map(str,contributor))
              out.append({
                'priority':pri,'score':score,'identifier':ident,'title':title,'creator':creator,
                'date':date,'volume':volume,'edition':edition,'series':series,'language':language,
                'subject':subject,'pages':pages,'pdf':pdf.get('name',''),'contributor':contributor
              })
              if len(out)>=100: break
          with open('gtu_candidates.json','w',encoding='utf-8') as f: json.dump({'broad_docs':len(docs),'academic_candidates':len(cand),'metadata_examined':examined,'items':out},f,ensure_ascii=False,indent=2)
          with open('gtu_candidates.tsv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['priority','score','identifier','title','creator','date','volume','edition','series','language','pages','pdf','subject','contributor'])
              for x in out: w.writerow([x[k] for k in ['priority','score','identifier','title','creator','date','volume','edition','series','language','pages','pdf','subject','contributor']])
          print('BROAD_DOCS',len(docs),'ACADEMIC_CANDIDATES',len(cand),'METADATA_EXAMINED',examined,'VERIFIED_PUBLIC_PDF',len(out))
          for x in out[:100]: print(json.dumps(x,ensure_ascii=False))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-candidates
          path: |
            gtu_candidates.json
            gtu_candidates.tsv
          retention-days: 1
