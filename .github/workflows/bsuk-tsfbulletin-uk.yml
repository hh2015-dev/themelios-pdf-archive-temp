name: BSUK TSF Bulletin UK

on:
  pull_request:
    branches: [main]
    paths:
      - 'bsuk_worker/download_tsfbulletin_uk.py'
      - '.github/workflows/bsuk-tsfbulletin-uk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python bsuk_worker/download_tsfbulletin_uk.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-tsfbulletin-uk
          path: tsfbulletin_uk_stage/**
          if-no-files-found: error
          retention-days: 1
