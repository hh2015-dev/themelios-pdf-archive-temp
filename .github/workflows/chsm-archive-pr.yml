name: Semanatorul discovery PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Discover Semanatorul archive PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, urllib.parse, urllib.request
          pages=[
            'https://semanatorul.emanuel.ro/archive/',
            'https://biblicalstudies.org.uk/articles_semanatorul-the-sower_01.php'
          ]
          UA={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1; +https://biblicalstudies.org.uk/)'}
          out=[]
          for page in pages:
              try:
                  req=urllib.request.Request(page,headers=UA)
                  with urllib.request.urlopen(req,timeout=60) as r: raw=r.read(); final=r.geturl(); status=getattr(r,'status',200)
                  text=raw.decode('utf-8','replace')
                  links=[]
                  for m in re.finditer(r'''(?is)<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>(.*?)</a>''',text):
                      href=html.unescape(m.group(1).strip())
                      label=re.sub(r'(?is)<[^>]+>',' ',m.group(2))
                      label=html.unescape(re.sub(r'\s+',' ',label)).strip()
                      url=urllib.parse.urljoin(final,href)
                      if '.pdf' in urllib.parse.urlparse(url).path.lower():
                          links.append({'url':url,'label':label})
                  out.append({'page':page,'status':status,'final':final,'bytes':len(raw),'links':links})
                  print('PAGE_OK',page,'PDF_LINKS',len(links))
                  for x in links: print('PDF',x['label'][:120],x['url'])
              except Exception as e:
                  out.append({'page':page,'error':repr(e),'links':[]})
                  print('PAGE_ERROR',page,repr(e))
          json.dump(out,open('semanatorul-discovery.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: semanatorul-discovery
          path: semanatorul-discovery.json
          if-no-files-found: error
          retention-days: 1
