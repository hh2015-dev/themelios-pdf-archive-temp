name: CHSM archive PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download The Sower complete volumes 002-039
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, json, os, urllib.request
          UA={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1)'}
          base='https://biblicalstudies.org.uk/pdf/the-sower/the-sower_{year}.pdf'
          root='out_sower'
          os.makedirs(root,exist_ok=True)
          rows=[]
          def fetch(vol):
              year=1878+vol
              url=base.format(year=year)
              batch = '002-010' if vol<=10 else '011-020' if vol<=20 else '021-030' if vol<=30 else '031-039'
              d=os.path.join(root,batch); os.makedirs(d,exist_ok=True)
              name=f'The Sower - Volume {vol:03d} ({year}) - Complete Volume.pdf'
              dest=os.path.join(d,name)
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=180) as r: data=r.read()
              if data[:5] != b'%PDF-': raise RuntimeError(f'Not PDF: {url} head={data[:20]!r}')
              if len(data) < 100000: raise RuntimeError(f'Too small: {url} bytes={len(data)}')
              open(dest,'wb').write(data)
              return {'volume':vol,'year':year,'url':url,'filename':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'batch':batch}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              futs={ex.submit(fetch,v):v for v in range(2,40)}
              for fut in concurrent.futures.as_completed(futs):
                  row=fut.result(); rows.append(row); print('OK',row['volume'],row['year'],row['bytes'])
          rows.sort(key=lambda r:r['volume'])
          if len(rows)!=38 or [r['volume'] for r in rows] != list(range(2,40)):
              raise SystemExit('Incomplete The Sower corpus')
          json.dump(rows,open(os.path.join(root,'manifest.json'),'w'),indent=2)
          print('COMPLETE',len(rows))
          PY
      - name: Upload Sower 002-010
        uses: actions/upload-artifact@v4
        with:
          name: sower-002-010
          path: out_sower/002-010/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload Sower 011-020
        uses: actions/upload-artifact@v4
        with:
          name: sower-011-020
          path: out_sower/011-020/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload Sower 021-030
        uses: actions/upload-artifact@v4
        with:
          name: sower-021-030
          path: out_sower/021-030/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload Sower 031-039
        uses: actions/upload-artifact@v4
        with:
          name: sower-031-039
          path: out_sower/031-039/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload Sower manifest
        uses: actions/upload-artifact@v4
        with:
          name: sower-manifest
          path: out_sower/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
