name: CHSM archive PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose The Sower annual PDFs 1880-1917
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          hosts=['https://biblicalstudies.org.uk','https://www.biblicalstudies.org.uk','https://biblicalstudies.gospelstudies.org.uk']
          UA={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1)'}
          rows=[]
          for year in range(1880,1918):
              vol=year-1878; found=None; attempts=[]
              for host in hosts:
                  url=f'{host}/pdf/the-sower/the-sower_{year}.pdf'
                  try:
                      req=urllib.request.Request(url,headers=UA)
                      with urllib.request.urlopen(req,timeout=45) as r:
                          head=r.read(5); final=r.geturl(); status=getattr(r,'status',200); length=r.headers.get('Content-Length')
                      attempts.append({'url':url,'status':status,'head':head.decode('latin1'),'length':length,'final':final})
                      if head==b'%PDF-': found={'url':final,'status':status,'length':length}; break
                  except urllib.error.HTTPError as e:
                      attempts.append({'url':url,'status':e.code})
                  except Exception as e:
                      attempts.append({'url':url,'error':repr(e)})
              row={'volume':vol,'year':year,'found':found,'attempts':attempts}; rows.append(row)
              print('FOUND' if found else 'MISSING',f'Volume {vol:03d}',year, found['url'] if found else attempts)
          json.dump(rows,open('sower-url-diagnostic.json','w'),indent=2)
          print('TOTAL_FOUND',sum(bool(r['found']) for r in rows),'TOTAL_MISSING',sum(not r['found'] for r in rows))
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: sower-url-diagnostic
          path: sower-url-diagnostic.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
