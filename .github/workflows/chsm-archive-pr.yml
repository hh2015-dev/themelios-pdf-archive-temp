name: SRSHJ discovery PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Discover SRSHJ corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, urllib.parse, urllib.request, urllib.error
          UA={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1)'}
          pages=[]; links=[]; seen=set()
          for i in range(1,7):
              page=f'https://biblicalstudies.org.uk/articles_srshj_{i:02d}.php'
              try:
                  req=urllib.request.Request(page,headers=UA)
                  with urllib.request.urlopen(req,timeout=60) as r: raw=r.read(); status=getattr(r,'status',200); final=r.geturl()
                  text=raw.decode('utf-8','replace')
                  pdfs=[]
                  for m in re.finditer(r'''(?is)<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>(.*?)</a>''',text):
                      href=html.unescape(m.group(1).strip())
                      label=re.sub(r'(?is)<[^>]+>',' ',m.group(2))
                      label=html.unescape(re.sub(r'\s+',' ',label)).strip()
                      url=urllib.parse.urljoin(final,href)
                      p=urllib.parse.urlparse(url).path.lower()
                      if '/pdf/srshj/' not in p or not p.endswith('.pdf'): continue
                      if url.lower() in seen: continue
                      seen.add(url.lower())
                      base=urllib.parse.unquote(urllib.parse.urlparse(url).path.rsplit('/',1)[-1])
                      mm=re.match(r'^(\d{2})[_-](.+)\.pdf$',base,re.I)
                      vol=int(mm.group(1)) if mm else None
                      rec={'page':page,'url':url,'label':label,'basename':base,'volume':vol}
                      links.append(rec); pdfs.append(rec)
                  pages.append({'page':page,'status':status,'bytes':len(raw),'pdf_count':len(pdfs)})
                  print('PAGE_OK',page,'PDFS',len(pdfs),'BYTES',len(raw))
              except urllib.error.HTTPError as e:
                  pages.append({'page':page,'status':e.code,'pdf_count':0})
                  print('PAGE_HTTP',page,e.code)
              except Exception as e:
                  pages.append({'page':page,'error':repr(e),'pdf_count':0})
                  print('PAGE_ERROR',page,repr(e))
          vols={}
          for x in links: vols.setdefault(str(x['volume']),0); vols[str(x['volume'])]+=1
          summary={'pages':pages,'unique_pdf_links':len(links),'volume_counts':dict(sorted(vols.items(),key=lambda kv:int(kv[0]) if kv[0]!='None' else 999)),'min_volume':min([x['volume'] for x in links if x['volume'] is not None],default=None),'max_volume':max([x['volume'] for x in links if x['volume'] is not None],default=None)}
          json.dump({'summary':summary,'links':links},open('srshj-discovery.json','w'),ensure_ascii=False,indent=2)
          print('UNIQUE_PDFS',len(links),'VOLUMES',summary['volume_counts'])
          PY
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: srshj-discovery
          path: srshj-discovery.json
          if-no-files-found: error
          retention-days: 1
