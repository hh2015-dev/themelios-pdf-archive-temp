name: GTU inventory broad discovery
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection and verify public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, random
          from concurrent.futures import ThreadPoolExecutor, as_completed
          COLL='graduatetheologicalunion'; UA={'User-Agent':'Mozilla/5.0 GTUInventory/1.0'}
          q='collection:'+COLL+' AND mediatype:texts'
          seen={}
          for page in [1,2,5,10,20,30,40,55,70]:
            parts=[('q',q),('rows','100'),('page',str(page)),('output','json'),('fl[]','identifier'),('fl[]','title'),('fl[]','creator'),('fl[]','date'),('fl[]','year'),('fl[]','language'),('fl[]','volume'),('fl[]','subject'),('fl[]','contributor'),('sort[]','identifier asc')]
            url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(parts)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=15) as r: data=json.load(r)
            except Exception as e:
              print('SEARCHERR',page,repr(e)); continue
            print('PAGE',page,'N',len(data.get('response',{}).get('docs',[])))
            for d in data.get('response',{}).get('docs',[]):
              i=d.get('identifier')
              if i and i not in seen: seen[i]=d
          ids=list(seen); random.Random(202608231840).shuffle(ids)
          def verify(ident):
            try:
              u='https://archive.org/metadata/'+urllib.parse.quote(ident)
              with urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=12) as r: meta=json.load(r)
            except Exception: return None
            md=meta.get('metadata',{}) or {}; coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if COLL not in coll: return None
            if str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true': return None
            pdfs=[]
            for f in meta.get('files',[]) or []:
              name=str(f.get('name','')); low=name.lower()
              if not low.endswith('.pdf') or str(f.get('private','false')).lower()=='true': continue
              if 'encrypted' in low or low.endswith('.lcpdf') or 'lcp' in low: continue
              pdfs.append(name)
            if not pdfs: return None
            pdfname=sorted(pdfs,key=lambda n:(('text.pdf' in n.lower()),len(n)))[0]
            def val(k):
              v=md.get(k,'')
              if isinstance(v,list): return '; '.join(str(x) for x in v)
              return str(v) if v is not None else ''
            pages=''
            for k in ('pages','page-count','page_count'):
              x=val(k).strip()
              if x: pages=x; break
            return {'identifier':ident,'title':val('title').strip(),'creator':val('creator').strip(),'year':(val('date').strip() or val('year').strip()),'volume':val('volume').strip(),'edition':val('edition').strip(),'series':val('series').strip(),'language':val('language').strip(),'contributor':val('contributor').strip(),'subject':val('subject').strip(),'pdf':pdfname,'pages':pages}
          out=[]
          with ThreadPoolExecutor(max_workers=30) as ex:
            futs={ex.submit(verify,i):i for i in ids}
            for fut in as_completed(futs):
              x=fut.result()
              if x: out.append(x)
          out.sort(key=lambda x:x['identifier'])
          with open('candidates.json','w',encoding='utf-8') as f: json.dump({'pool':len(seen),'examined':len(ids),'eligible':len(out),'items':out},f,ensure_ascii=False,indent=2)
          print('POOL',len(seen),'EXAMINED',len(ids),'ELIGIBLE',len(out))
          for x in out[:160]: print(x['identifier'],'\t',x['title'][:115])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates
          path: candidates.json
