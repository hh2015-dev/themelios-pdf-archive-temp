name: Princeton PDF Transfer Temp

on:
  push:
    paths:
      - '.github/workflows/princeton-download-temp.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Princeton PDF
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            'https://archive.org/download/grammarofhebrewl01gree/grammarofhebrewl01gree.pdf' \
            -o 'A Grammar of the Hebrew Language - William Henry Green.pdf'
          test -s 'A Grammar of the Hebrew Language - William Henry Green.pdf'
          file 'A Grammar of the Hebrew Language - William Henry Green.pdf'
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: princeton-green-hebrew-grammar
          path: 'A Grammar of the Hebrew Language - William Henry Green.pdf'
          retention-days: 1
          compression-level: 0
