name: GTU inventory fast shortlist
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection broadly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          qs=[
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(hebrew OR aramaic OR syriac OR semitic OR akkadian OR assyrian OR ugaritic))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(septuagint OR greek OR papyri OR manuscript OR textual OR criticism))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(old testament OR hebrew bible OR pentateuch OR genesis OR exodus OR isaiah OR jeremiah OR psalms OR job))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(new testament OR gospel OR romans OR acts OR corinthians OR revelation))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(qumran OR dead sea OR pseudepigrapha OR apocrypha OR rabbinic OR talmud OR mishnah OR josephus OR philo))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(archaeology OR palestine OR babylon OR assyria OR sumer OR ancient near east))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(calvin OR luther OR patristic OR augustine OR origen OR jerome OR chrysostom OR irenaeus))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(lexicon OR concordance OR grammar OR bibliography OR commentary OR theology))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (subject:(Bible OR biblical OR Hebrew OR Syriac OR Aramaic OR Assyriology OR archaeology))'
          ]
          docs={}; examined=0
          for q in qs:
            for start in (0,200,600,1200,2000):
              params={'q':q,'fl[]':['identifier','title','creator','year','date','language','volume','contributor','subject'],'rows':'200','start':str(start),'output':'json'}
              u='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True)
              try:
                with urllib.request.urlopen(u,timeout=25) as r: data=json.load(r)
              except Exception:
                continue
              arr=data.get('response',{}).get('docs',[]); examined+=len(arr)
              for d in arr: docs[d['identifier']]=d
          with open('gtu_shortlist.json','w') as f: json.dump({'examined':examined,'unique':len(docs),'items':list(docs.values())},f,ensure_ascii=False)
          print('EXAMINED',examined,'UNIQUE',len(docs))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-shortlist
          path: gtu_shortlist.json
