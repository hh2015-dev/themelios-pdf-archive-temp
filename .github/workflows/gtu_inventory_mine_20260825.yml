name: TEMP GTU inventory verify 20260825
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/gtu_inventory_mine_20260825.yml' ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected items against Archive metadata
        shell: bash
        run: |
          cat > /tmp/verify.py <<'PY'
          import urllib.request, urllib.parse, json, time
          ids = [
            'calvinscommentar0001calv_t5f8','eitherjeworgenti0000park','wisdomcanonmeani0000guth','foreshadowingsof0000harp',
            'epistletogalatia0000hami','epistletoephesia0000john','luke0000john','mark0000john','homeliessursluct0000orig',
            'degenesicontrama0000augu','commentairesursa0000orig_v1v4','wasdenleidenchri0000krem_b7c3','yesterdaytodayfo0000barr',
            'forgivenessofsin0000owen','ecclesiaapostoli00budd','histoireecclesia0031euse',
            'sim_journal-of-semitic-studies_1957-10_2_4','sim_journal-of-semitic-studies_1958-07_3_3',
            'sim_bulletin-of-the-american-schools-of-oriental-research_1919-12_1',
            'sim_journal-of-biblical-literature_1926_45_3-4'
          ]
          out=[]
          for ident in ids:
            url='https://archive.org/metadata/'+urllib.parse.quote(ident)
            try:
              with urllib.request.urlopen(url,timeout=45) as r: j=json.load(r)
              m=j.get('metadata',{}); files=j.get('files',[])
              coll=m.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              publicpdf=''
              for f in files:
                n=f.get('name',''); priv=str(f.get('private','false')).lower()=='true'
                if n.lower().endswith('.pdf') and not priv and not n.lower().endswith('_text.pdf') and 'encrypted' not in n.lower() and not n.lower().endswith('.lcpdf'):
                  publicpdf='https://archive.org/download/'+ident+'/'+urllib.parse.quote(n); break
              pages=m.get('page-progression','')
              out.append({
                'identifier':ident,'title':m.get('title',''),'creator':m.get('creator',''),'date':m.get('date',''),'year':m.get('year',''),
                'volume':m.get('volume',''),'edition':m.get('edition',''),'series':m.get('series',''),'subject':m.get('subject',''),'language':m.get('language',''),
                'contributor':m.get('contributor',''),'description':m.get('description',''),'collection':coll,
                'access_restricted':m.get('access-restricted-item',m.get('printdisabled','')),'public_pdf':publicpdf
              })
            except Exception as e:
              out.append({'identifier':ident,'error':repr(e)})
            time.sleep(.15)
          with open('gtu_verified.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print('VERIFIED',len(out),'GTU',sum('graduatetheologicalunion' in x.get('collection',[]) for x in out),'PDF',sum(bool(x.get('public_pdf')) for x in out))
          PY
          python /tmp/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-verified-20260825
          path: gtu_verified.json
          compression-level: 6
