name: GTU inventory verify diversified 20260825
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify diversified GTU items
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          ids = [
          'newtestamentapoc0000unse_u3n2','shortofliteratur0000woeo','catalogofhebrewb0003jiq','enarrationesinps0951augu','enarrationesinps0954augu','lavisiondematthi0000chri','thesamaritanlitu00unse','greekenglishlexi0000henr_n3b4','historicallingui0000unse_c5c5','doctrineofchurch0000geor_e8s7','archeologyssolut0000revj','introductiontool0000arob','introductiontool0002unse','introductiontone0000unse_k2v8','gtu_32400007167970','bibliographyofbi0000jerr','journal-for-the-study-of-the-old-testament_1980-1982_index-18-23','companiontonewte0000harv_m4v9','bentarbutyisrael0000stei','exodusintroducti00unse','expositionofoldt0003gill','newenglishcompan0000aeha','sim_journal-of-biblical-literature_1937-03_56_1','gtu_32400008182671'
          ]
          out=[]
          for ident in ids:
              try:
                  with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident), timeout=60) as r:
                      data=json.load(r)
              except Exception as e:
                  out.append({'identifier':ident,'error':str(e)}); continue
              m=data.get('metadata',{})
              coll=m.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              files=data.get('files',[])
              public_pdfs=[]
              for f in files:
                  name=f.get('name','')
                  if not name.lower().endswith('.pdf'): continue
                  if name.lower().endswith('.lcpdf') or 'encrypted' in name.lower(): continue
                  if f.get('private') is True or str(f.get('private','')).lower()=='true': continue
                  public_pdfs.append({'name':name,'size':f.get('size'),'source':f.get('source'),'format':f.get('format')})
              pdf=public_pdfs[0]['name'] if public_pdfs else ''
              for p in public_pdfs:
                  if p.get('format')=='Text PDF' or p['name'].lower()==ident.lower()+'.pdf':
                      pdf=p['name']; break
              rec={
                'identifier':ident,
                'in_gtu':'graduatetheologicalunion' in coll,
                'collection':coll,
                'title':m.get('title'),
                'creator':m.get('creator'),
                'date':m.get('date'),
                'year':m.get('year'),
                'volume':m.get('volume'),
                'edition':m.get('edition'),
                'series':m.get('series'),
                'language':m.get('language'),
                'subject':m.get('subject'),
                'contributor':m.get('contributor'),
                'mediatype':m.get('mediatype'),
                'access_restricted':m.get('access-restricted-item'),
                'printdisabled':m.get('printdisabled'),
                'public_pdf':pdf,
                'public_pdf_count':len(public_pdfs),
                'item_link':'https://archive.org/details/'+ident,
                'direct_pdf_link':('https://archive.org/download/'+ident+'/'+urllib.parse.quote(pdf)) if pdf else ''
              }
              out.append(rec)
              print(ident, rec['in_gtu'], bool(pdf), rec['title'], flush=True)
              time.sleep(0.1)
          with open('out/verified2.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-diverse-20260825
          path: out/verified2.json
          compression-level: 6
