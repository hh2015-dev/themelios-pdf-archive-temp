name: GTU inventory verify 20260825
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected GTU items
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          ids = [
          'apocryphapseudep0001rhch_e9d0','aprocryphapseude0002unse','newtestamentapoc0000unse_u3n2','sixthbookofselec0001seve','shortofliteratur0000woeo','bibliothecajudai0102furs','catalogofhebrewb0003jiq','calvinscommentar0019calv','enarrationesinps0951augu','enarrationesinps0954augu','lavisiondematthi0000chri','newtestamentinhi0000ghcm','bentarbutyisrael0000stei','labibletraductio0006unse','labibletraductio0008unse','labibletraductio0009unse','labibletraductio0011unse','labibletraductio0014unse','labibletraductio0016unse','labibletraductio0017unse','labibletraductio0018unse','greekenglishlexi0000henr_n3b4','newtestamentfrom0000ivan','thesamaritanlitu00unse','sim_journal-of-biblical-literature_1937-03_56_1','sim_journal-of-biblical-literature_1937-06_56_2','sim_journal-of-biblical-literature_1937-09_56_3','sim_journal-of-biblical-literature_1937-12_56_4','sim_journal-of-biblical-literature_1936-03_55_1','sim_journal-of-biblical-literature_1936-09_55_3','sim_journal-of-biblical-literature_1936-12_55_4','gtu_32400008182671'
          ]
          out=[]
          for ident in ids:
              try:
                  with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident), timeout=60) as r:
                      data=json.load(r)
              except Exception as e:
                  out.append({'identifier':ident,'error':str(e)}); continue
              m=data.get('metadata',{})
              coll=m.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              files=data.get('files',[])
              public_pdfs=[]
              for f in files:
                  name=f.get('name','')
                  if not name.lower().endswith('.pdf'): continue
                  if name.lower().endswith('.lcpdf'): continue
                  if f.get('private') is True or str(f.get('private','')).lower()=='true': continue
                  if 'encrypted' in name.lower(): continue
                  public_pdfs.append({'name':name,'size':f.get('size'),'source':f.get('source'),'format':f.get('format')})
              # prefer original/text pdf over derivatives where possible
              pdf=public_pdfs[0]['name'] if public_pdfs else ''
              for p in public_pdfs:
                  if p.get('format')=='Text PDF' or p['name'].lower()==ident.lower()+'.pdf':
                      pdf=p['name']; break
              pages=m.get('page-progression')
              if not pages:
                  # derive from scandata only if explicit leaf count file metadata exists
                  pages=m.get('pages') or m.get('page_count')
              rec={
                'identifier':ident,
                'in_gtu':'graduatetheologicalunion' in coll,
                'collection':coll,
                'title':m.get('title'),
                'creator':m.get('creator'),
                'date':m.get('date'),
                'year':m.get('year'),
                'volume':m.get('volume'),
                'edition':m.get('edition'),
                'series':m.get('series'),
                'language':m.get('language'),
                'subject':m.get('subject'),
                'contributor':m.get('contributor'),
                'mediatype':m.get('mediatype'),
                'access_restricted':m.get('access-restricted-item'),
                'printdisabled':m.get('printdisabled'),
                'public_pdf':pdf,
                'public_pdf_count':len(public_pdfs),
                'item_link':'https://archive.org/details/'+ident,
                'direct_pdf_link':('https://archive.org/download/'+ident+'/'+urllib.parse.quote(pdf)) if pdf else ''
              }
              out.append(rec)
              print(ident, rec['in_gtu'], bool(pdf), rec['title'], flush=True)
              time.sleep(0.1)
          with open('out/verified.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-20260825
          path: out/verified.json
          compression-level: 6
