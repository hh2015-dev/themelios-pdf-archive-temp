name: TEMP GTU inventory discovery 20260825
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/gtu_inventory_mine_20260825.yml' ]
permissions:
  contents: read
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import urllib.request, urllib.parse, json, time
          terms = [
            '(title:(Hebrew OR Aramaic OR Syriac OR Semitic) OR subject:(Hebrew OR Aramaic OR Syriac OR Semitic))',
            '(title:(Greek OR Septuagint OR papyri OR papyrus) OR subject:(Greek OR Septuagint OR papyri OR papyrus))',
            '(title:(manuscript OR manuscripts OR textual criticism) OR subject:(manuscript OR manuscripts OR textual criticism))',
            '(title:(Qumran OR "Dead Sea" OR pseudepigrapha OR apocrypha OR rabbinic OR Talmud OR midrash) OR subject:(Qumran OR "Dead Sea" OR pseudepigrapha OR apocrypha OR rabbinic OR Talmud OR midrash))',
            '(title:(Assyrian OR Babylonian OR Akkadian OR Ugaritic OR Canaanite OR archaeology) OR subject:(Assyrian OR Babylonian OR Akkadian OR Ugaritic OR Canaanite OR archaeology))',
            '(title:(Genesis OR Exodus OR Leviticus OR Numbers OR Deuteronomy OR Joshua OR Judges OR Samuel OR Kings OR Isaiah OR Jeremiah OR Ezekiel OR Daniel OR Psalms OR Job OR Proverbs OR Ecclesiastes) OR subject:("Old Testament" OR "Hebrew Bible"))',
            '(title:(Matthew OR Mark OR Luke OR John OR Acts OR Romans OR Corinthians OR Galatians OR Ephesians OR Hebrews OR Revelation) OR subject:("New Testament"))',
            '(title:(Bible OR Biblical) AND title:(commentary OR theology OR exegesis OR interpretation OR hermeneutics))',
            '(title:(Calvin OR Luther OR Augustine OR Origen OR Jerome OR Chrysostom OR Irenaeus OR Tertullian) OR creator:(Calvin OR Luther OR Augustine OR Origen OR Jerome OR Chrysostom OR Irenaeus OR Tertullian))',
            '(title:(lexicon OR concordance OR grammar OR bibliography OR dictionary) AND (subject:(Bible OR Biblical OR Hebrew OR Greek OR Semitic) OR title:(Hebrew OR Greek OR Bible OR Biblical)))',
            '(title:(Journal OR Bulletin OR Review) AND (title:(Biblical OR Semitic OR Oriental OR Near Eastern) OR subject:(Bible OR Biblical OR Semitic OR "Near East")))',
            '(subject:("Church history" OR theology OR missions OR Reformation OR patristics OR Christianity) AND mediatype:texts)'
          ]
          pages=[2,5,9]
          fields=['identifier','title','creator','year','date','subject','language','description','volume','edition','contributor','mediatype','collection']
          seen=set(); out=[]; examined=0
          for qi,t in enumerate(terms):
            for page in pages:
              q='collection:graduatetheologicalunion AND mediatype:texts AND '+t
              params=[('q',q),('rows','100'),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              for f in fields: params.append(('fl[]',f))
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params)
              try:
                with urllib.request.urlopen(url, timeout=45) as r: data=json.load(r)
                docs=data.get('response',{}).get('docs',[]); examined += len(docs)
                for d in docs:
                  ident=d.get('identifier')
                  if ident and ident not in seen:
                    seen.add(ident); d['_query']=qi; d['_page']=page; out.append(d)
              except Exception as e:
                print('ERROR',qi,page,repr(e))
              time.sleep(.2)
          with open('gtu_candidates.json','w',encoding='utf-8') as f: json.dump({'examined':examined,'unique':len(out),'docs':out},f,ensure_ascii=False)
          print('EXAMINED',examined,'UNIQUE',len(out))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-candidates-20260825
          path: gtu_candidates.json
          compression-level: 6
