name: GTU inventory mine 20260825
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          : > out/candidates.jsonl
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          base='https://archive.org/advancedsearch.php'
          queries=[
            'collection:graduatetheologicalunion AND mediatype:texts',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:hebrew OR subject:hebrew)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:aramaic OR subject:aramaic OR title:syriac OR subject:syriac)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:greek OR subject:greek OR title:septuagint OR subject:septuagint)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:bible OR subject:bible OR title:biblical OR subject:biblical)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:testament OR subject:testament)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:manuscript OR subject:manuscript OR title:papyri OR subject:papyri)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:archaeology OR subject:archaeology OR title:assyri OR subject:assyri OR title:babylon OR subject:babylon)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:judaism OR subject:judaism OR title:talmud OR subject:talmud OR title:rabbinic OR subject:rabbinic)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:calvin OR creator:calvin OR title:luther OR creator:luther OR title:origen OR creator:origen OR title:augustine OR creator:augustine)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:commentary OR subject:commentary OR title:exegesis OR subject:exegesis)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:lexicon OR title:grammar OR title:concordance OR title:bibliography)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:journal OR title:quarterly OR title:review OR title:bulletin)'
          ]
          # broad pages deliberately spread through corpus
          broad_pages=[1,3,7,12,20,30,40,55,70,90,120]
          seen=set()
          def fetch(q,page,rows=200):
              params=[('q',q),('rows',str(rows)),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              for f in ['identifier','title','creator','year','date','language','volume','contributor','subject','mediatype']:
                  params.append(('fl[]',f))
              url=base+'?'+urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as r:
                  return json.load(r)
          for qi,q in enumerate(queries):
              pages=broad_pages if qi==0 else [1,2,4,8]
              for page in pages:
                  try:
                      data=fetch(q,page)
                  except Exception as e:
                      print('ERR', qi,page,e, flush=True); continue
                  docs=data.get('response',{}).get('docs',[])
                  print('QUERY',qi,'PAGE',page,'DOCS',len(docs), flush=True)
                  with open('out/candidates.jsonl','a',encoding='utf-8') as fh:
                      for d in docs:
                          ident=d.get('identifier')
                          if not ident or ident in seen: continue
                          seen.add(ident)
                          fh.write(json.dumps(d,ensure_ascii=False)+'\n')
                  time.sleep(0.15)
          print('UNIQUE',len(seen),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates-20260825
          path: out/candidates.jsonl
          compression-level: 6
