name: TEMP GTU alternate verify 20260825
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/gtu_inventory_mine_20260825.yml' ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify alternate GTU items
        shell: bash
        run: |
          cat > /tmp/verify.py <<'PY'
          import urllib.request, urllib.parse, json, time
          ids=['eschatologiebibe0000unse','contrelesheresie0210iren','discoveringbible0000diet','godbiblereviewof0000arno','sim_bulletin-of-the-american-schools-of-oriental-research_1920-02_2']
          out=[]
          for ident in ids:
            with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=45) as r: j=json.load(r)
            m=j.get('metadata',{}); files=j.get('files',[]); coll=m.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            pdf=''
            for f in files:
              n=f.get('name',''); priv=str(f.get('private','false')).lower()=='true'
              if n.lower().endswith('.pdf') and not priv and 'encrypted' not in n.lower() and not n.lower().endswith('.lcpdf') and not n.lower().endswith('_text.pdf'):
                pdf='https://archive.org/download/'+ident+'/'+urllib.parse.quote(n); break
            out.append({'identifier':ident,'title':m.get('title',''),'creator':m.get('creator',''),'date':m.get('date',''),'year':m.get('year',''),'volume':m.get('volume',''),'edition':m.get('edition',''),'series':m.get('series',''),'subject':m.get('subject',''),'language':m.get('language',''),'contributor':m.get('contributor',''),'collection':coll,'access_restricted':m.get('access-restricted-item',m.get('printdisabled','')),'public_pdf':pdf})
            time.sleep(.1)
          json.dump(out,open('gtu_alt_verified.json','w'),ensure_ascii=False,indent=2)
          print('VERIFIED',len(out),'GTU',sum('graduatetheologicalunion' in x.get('collection',[]) for x in out))
          PY
          python /tmp/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-alt-verified-20260825
          path: gtu_alt_verified.json
