name: GTU Inventory Mine 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import requests, urllib.parse, json, re, concurrent.futures, time
          BASE='https://archive.org'
          themes=[
            'Hebrew','Aramaic','Syriac','Semitic','Greek New Testament','Septuagint','textual criticism','manuscript','papyri','Qumran','Dead Sea Scrolls','Apocrypha','Pseudepigrapha','Talmud','Midrash','rabbinic','Assyrian','Babylonian','Akkadian','Ugaritic','archaeology Palestine','biblical archaeology','Genesis','Exodus','Psalms','Isaiah','Jeremiah','Ezekiel','Daniel','minor prophets','Matthew','Mark','Luke','John','Acts','Romans','Corinthians','Revelation','patristic exegesis','Origen','Jerome','Augustine','Calvin commentary','Luther Bible','concordance','lexicon','grammar','bibliography Bible','Journal Biblical','Bible Translator']
          docs={}; appearances=0
          for idx,t in enumerate(themes):
            field='title' if idx%3==0 else ('subject' if idx%3==1 else None)
            tq=f'{field}:("{t}")' if field else f'("{t}")'
            q=f'collection:graduatetheologicalunion AND mediatype:texts AND {tq}'
            for page in (1,3,7):
              params={'q':q,'fl[]':['identifier','title','creator','year','date','volume','edition','series','subject','language','contributor'],'rows':40,'page':page,'output':'json'}
              try:
                r=requests.get(BASE+'/advancedsearch.php',params=params,timeout=30); r.raise_for_status()
                arr=r.json().get('response',{}).get('docs',[]); appearances+=len(arr)
                for d in arr:
                  if d.get('identifier'): docs[d['identifier']]=d
              except Exception: pass
          kwA=['bible','biblical','hebrew','aramaic','syriac','semit','greek','septuagint','textual','manuscript','papyr','qumran','dead sea','apocry','pseudep','talmud','midrash','rabbin','assyri','babylon','akkad','ugarit','archaeol','genesis','exodus','levit','numbers','deuter','joshua','judges','samuel','kings','chronicles','ezra','nehem','job','psalm','proverb','ecclesiast','song of','isaiah','jeremiah','ezekiel','daniel','prophet','matthew','mark','luke','john','acts','romans','corinth','galatian','ephesian','philipp','coloss','thess','timothy','titus','philemon','hebrews','james','peter','jude','revelation','gospel','paul','concordance','lexicon','grammar','commentar','exeges','interpret','jbl','journal of biblical','bible translator']
          kwB=['theology','patrist','church history','reformation','doctrine','creed','confession','apolog','mission','judaism','early christian','christian history','augustine','calvin','luther','origen','jerome','tertullian','irenaeus']
          def txt(d):
            vals=[]
            for k in ('title','creator','subject','series'):
              v=d.get(k,''); vals += v if isinstance(v,list) else [v]
            return ' '.join(str(x) for x in vals).lower()
          def score(d):
            s=txt(d); a=sum(4 for k in kwA if k in s); b=sum(2 for k in kwB if k in s)
            y=d.get('year') or 0
            return a+b+(1 if y else 0)
          ranked=sorted(docs.values(),key=score,reverse=True)[:420]
          def verify(d):
            ident=d['identifier']
            try:
              m=requests.get(BASE+'/metadata/'+urllib.parse.quote(ident),timeout=30).json()
              md=m.get('metadata',{}); coll=md.get('collection',[]); coll=[coll] if isinstance(coll,str) else coll
              if 'graduatetheologicalunion' not in coll: return None
              files=m.get('files',[]); pub=[]
              for f in files:
                n=f.get('name',''); private=str(f.get('private','false')).lower()=='true'
                if n.lower().endswith('.pdf') and not private and not n.lower().endswith('_encrypted.pdf') and not n.lower().endswith('.lcpdf'):
                  pub.append(n)
              restricted=str(md.get('access-restricted-item','false')).lower()=='true' or str(md.get('printdisabled','false')).lower()=='true'
              pdf=pub[0] if pub and not restricted else ''
              pages=md.get('pages') or md.get('page-count') or md.get('page_count') or ''
              subj=md.get('subject',''); subj='; '.join(subj) if isinstance(subj,list) else subj
              creator=md.get('creator',''); creator='; '.join(creator) if isinstance(creator,list) else creator
              contrib=md.get('contributor',''); contrib='; '.join(contrib) if isinstance(contrib,list) else contrib
              volume=md.get('volume',''); edition=md.get('edition',''); series=md.get('series','')
              title=md.get('title') or d.get('title',''); year=md.get('year') or d.get('year') or ''
              return {'score':score(d),'identifier':ident,'title':title,'creator':creator,'year':year,'volume':volume,'edition':edition,'series':series,'subject':subj,'language':md.get('language',''),'contributor':contrib,'restricted':restricted,'pdf':pdf,'pages':pages}
            except Exception: return None
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
            for x in ex.map(verify,ranked):
              if x: out.append(x)
          out.sort(key=lambda x:(x['score'],bool(x['pdf'])),reverse=True)
          print('APPEARANCES',appearances,'UNIQUE',len(docs),'VERIFIED',len(out))
          with open('gtu_candidates.json','w') as f: json.dump({'appearances':appearances,'unique':len(docs),'verified':len(out),'items':out[:180]},f,ensure_ascii=False,indent=2)
          for x in out[:120]: print(json.dumps(x,ensure_ascii=False))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates-20260825
          path: gtu_candidates.json
          compression-level: 6
