name: GTU inventory discovery 20260823
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU-scoped candidates
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          BASE='collection:graduatetheologicalunion AND mediatype:texts'
          queries=[('bible',1),('testament',2),('hebrew',3),('greek',4),('syriac',5),('aramaic',6),('septuagint',2),('manuscript',5),('archaeology',4),('judaism',3),('rabbinic',2),('patristic',5),('reformation',6),('theology',4),('missions',5),('church',6),('commentary',3),('lexicon',4),('grammar',5),('concordance',2),('apocrypha',3),('pseudepigrapha',4),('assyrian',5),('babylonian',3),('philo',4),('josephus',5),('augustine',3),('luther',4),('calvin',5),('biblical literature',2),('gospel',6),('psalms',6),('isaiah',5),('paul',6),('early christian',5)]
          def search(qp):
            term,page=qp
            q=f'{BASE} AND (title:({term}) OR subject:({term}))'
            params={'q':q,'fl[]':['identifier','title','creator','date','year','language','subject','volume','contributor','collection','format'],'rows':30,'page':page,'output':'json'}
            try:
              with urllib.request.urlopen('https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True),timeout=15) as r: return json.load(r)['response']['docs']
            except Exception: return []
          seen={}; examined=0
          with ThreadPoolExecutor(max_workers=16) as ex:
            for docs in ex.map(search,queries):
              examined+=len(docs)
              for d in docs:
                ident=d.get('identifier')
                if ident: seen.setdefault(ident,d)
          out=[]
          for ident,d in seen.items():
            coll=d.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if coll and 'graduatetheologicalunion' not in coll: continue
            d['item_link']='https://archive.org/details/'+ident
            d['collection_query_verified']=True
            out.append(d)
          with open('gtu_candidates.json','w',encoding='utf-8') as f: json.dump({'examined':examined,'unique_discovered':len(seen),'verified':len(out),'items':out},f,ensure_ascii=False,indent=2)
          print('examined',examined,'unique',len(seen),'verified',len(out))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-candidates
          path: gtu_candidates.json
