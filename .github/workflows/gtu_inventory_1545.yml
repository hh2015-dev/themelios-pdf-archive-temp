name: GTU inventory discovery 1545
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Diverse exact-GTU discovery
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import requests,json,re,urllib.parse
          from collections import OrderedDict
          base='https://archive.org/advancedsearch.php'
          terms=[
           'Hebrew grammar','Hebrew lexicon','Aramaic grammar','Syriac grammar','Syriac Bible','Semitic philology',
           'Septuagint','Greek New Testament','New Testament textual criticism','papyri New Testament','biblical manuscripts',
           'Qumran','Dead Sea Scrolls','Second Temple Judaism','Apocrypha','Pseudepigrapha','Josephus','Philo',
           'Talmud','Mishnah','rabbinic','Ugaritic','Akkadian','Assyrian','Babylonian','Canaanite','Phoenician',
           'biblical archaeology','Palestine archaeology','ancient Israel','Isaiah commentary','Jeremiah commentary','Job commentary',
           'Psalms commentary','Genesis commentary','Daniel commentary','Matthew commentary','John commentary','Romans commentary',
           'Origen exegesis','Jerome exegesis','Augustine scripture','Chrysostom scripture','Calvin commentary','Luther Bible',
           'biblical theology','history interpretation Bible','biblical bibliography','biblical concordance'
          ]
          cand=OrderedDict(); examined=0
          for idx,term in enumerate(terms):
            # alternate title and subject searches and deep pages
            fld='title' if idx%2==0 else 'subject'
            q=f'collection:graduatetheologicalunion AND mediatype:texts AND {fld}:("{term}")'
            page=1+(idx%7)
            params={'q':q,'fl[]':['identifier','title','creator','year','subject','language'],'rows':25,'page':page,'output':'json','sort[]':'identifier asc'}
            try:
              docs=requests.get(base,params=params,timeout=25).json()['response']['docs']; examined+=len(docs)
            except Exception: continue
            for d in docs:
              i=d.get('identifier'); t=str(d.get('title',''))
              if not i or not t: continue
              if re.search(r'(table of contents|index$|bible society record|journal of semitic studies)',t,re.I): continue
              cand.setdefault(i,d)
          out=[]
          for i,d in list(cand.items())[:220]:
            try: m=requests.get('https://archive.org/metadata/'+urllib.parse.quote(i,safe=''),timeout=25).json(); md=m.get('metadata',{})
            except Exception: continue
            coll=md.get('collection',[]); coll=[coll] if isinstance(coll,str) else coll
            if 'graduatetheologicalunion' not in coll: continue
            title=md.get('title') or d.get('title') or ''
            if isinstance(title,list): title='; '.join(map(str,title))
            if re.search(r'(video|audio|minutes|catalog of courses|yearbook|directory|newsletter)',str(title),re.I): continue
            files=m.get('files',[]); pdf=''
            for f in files:
              n=f.get('name',''); priv=str(f.get('private','false')).lower()=='true'
              if n.lower().endswith('.pdf') and not priv and not re.search(r'(encrypted|\.lcpdf$|acs)',n,re.I): pdf=n; break
            def one(v):
              if isinstance(v,list): return '; '.join(map(str,v))
              return '' if v is None else str(v)
            r={'identifier':i,'title':one(title),'creator':one(md.get('creator') or d.get('creator')),'year':one(md.get('year') or md.get('date') or d.get('year')),
               'volume':one(md.get('volume')),'edition':one(md.get('edition')),'series':one(md.get('series')),'subject':one(md.get('subject') or d.get('subject')),
               'language':one(md.get('language') or d.get('language')),'contributor':one(md.get('contributor')),'numpages':one(md.get('numpages') or md.get('pages')),
               'restricted':one(md.get('access-restricted-item') or md.get('printdisabled')),'pdf':pdf,'item_link':'https://archive.org/details/'+i,
               'pdf_link':('https://archive.org/download/'+i+'/'+urllib.parse.quote(pdf)) if pdf else ''}
            out.append(r)
            if len(out)>=120: break
          with open('gtu_diverse.json','w',encoding='utf8') as f: json.dump({'examined':examined,'unique':len(cand),'records':out},f,ensure_ascii=False,indent=2)
          print('EXAMINED',examined,'UNIQUE',len(cand),'VERIFIED',len(out))
          for r in out[:60]: print(json.dumps(r,ensure_ascii=False))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-diverse-1545
          path: gtu_diverse.json
