name: Midwestern Journal archive
on:
  pull_request:
    paths:
      - 'midwestern-journal-trigger.txt'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official Midwestern Journal PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          import urllib.request, urllib.parse, re, html as htmlmod, pathlib, csv, json, ssl, subprocess
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u,timeout=40):
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.read(), r.geturl(), dict(r.headers)
          start='https://www.mbts.edu/resources/journal/'
          data,final,h=get(start); pathlib.Path('out/journal.html').write_bytes(data)
          txt=data.decode('utf-8','replace')
          def links_from(text,base):
              out=[]
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  href=htmlmod.unescape(m.group(1)); label=' '.join(htmlmod.unescape(re.sub('<[^>]+>',' ',m.group(2))).split())
                  out.append((label,urllib.parse.urljoin(base,href)))
              return out
          links=links_from(txt,final)
          with open('out/page-links.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['anchor','url']); w.writerows(links)
          candidates=[]
          for label,u in links:
              if '.pdf' in u.lower(): candidates.append(('page',label,u))
          # Probe WordPress search API and sitemap for older journal pages/assets.
          probes=[
            'https://www.mbts.edu/wp-json/wp/v2/search?search=Midwestern%20Journal%20of%20Theology&per_page=100',
            'https://www.mbts.edu/wp-sitemap.xml',
            'https://www.mbts.edu/sitemap_index.xml'
          ]
          for j,u in enumerate(probes):
              try:
                  b,fu,hh=get(u); pathlib.Path(f'out/probe{j}.txt').write_bytes(b)
              except Exception as e:
                  pathlib.Path(f'out/probe{j}.txt').write_text('ERROR '+repr(e))
          # Follow same-site links from the journal page likely to be issue/article pages, one level.
          followed=[]
          for i,(label,u) in enumerate(links):
              pu=urllib.parse.urlparse(u)
              if pu.hostname not in {'www.mbts.edu','mbts.edu'}: continue
              if '.pdf' in u.lower(): continue
              key=(label+' '+u).lower()
              if not any(x in key for x in ['journal','theology','spring','fall','volume']): continue
              try:
                  b,fu,hh=get(u,25)
                  if 'text/html' not in hh.get('Content-Type',''): continue
                  t=b.decode('utf-8','replace')
                  for a,v in links_from(t,fu):
                      if '.pdf' in v.lower(): candidates.append((u,a,v))
                  followed.append((u,'OK',len(b)))
              except Exception as e:
                  followed.append((u,'ERR',repr(e)[:150]))
          with open('out/followed.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['url','status','detail']); w.writerows(followed)
          # Deduplicate PDF URLs and download public PDFs.
          uniq=[]; seen=set()
          for src,label,u in candidates:
              u=u.split('#')[0]
              if u not in seen: seen.add(u); uniq.append((src,label,u))
          results=[]
          for i,(src,label,u) in enumerate(uniq,1):
              try:
                  b,fu,hh=get(u,90)
                  status='PDF' if b.startswith(b'%PDF-') else 'NOTPDF'
                  if status=='PDF': pathlib.Path(f'out/pdfs/{i:03d}.pdf').write_bytes(b)
                  results.append((i,status,len(b),label,u,fu,hh.get('Content-Type','')))
              except Exception as e:
                  results.append((i,'ERROR',0,label,u,'',repr(e)[:180]))
          with open('out/pdf-manifest.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['n','status','bytes','anchor','url','final_url','content_type']); w.writerows(results)
          print('PAGE_LINKS',len(links),'PDF_CANDIDATES',len(uniq),'PDF_OK',sum(r[1]=='PDF' for r in results))
          for r in results: print(*r[:5],sep='\t')
          PY
      - name: Upload Midwestern discovery
        uses: actions/upload-artifact@v4
        with:
          name: midwestern-journal-discovery
          path: out/
          retention-days: 1
