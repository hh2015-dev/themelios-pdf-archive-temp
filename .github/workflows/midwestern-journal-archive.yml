name: Midwestern Journal archive
on:
  pull_request:
    paths:
      - 'midwestern-journal-trigger.txt'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Search historical Midwestern Journal sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/search
          # Wayback CDX queries for historical official MBTS PDF URLs and journal pages.
          python - <<'PY'
          import urllib.request, urllib.parse, pathlib, json, re, csv, time
          UA={'User-Agent':'Mozilla/5.0'}
          def fetch(u,timeout=60):
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.read()
          cdx_patterns=[
            'www.mbts.edu/wp-content/uploads/*mjt*.pdf',
            'mbts.edu/wp-content/uploads/*mjt*.pdf',
            'www.mbts.edu/*mjt*.pdf',
            'www.mbts.edu/*journal*.pdf',
            'www.mbts.edu/resources/journal/',
            'mbts.edu/resources/journal/'
          ]
          all_cdx=[]
          for i,p in enumerate(cdx_patterns):
              q='https://web.archive.org/cdx/search/cdx?url='+urllib.parse.quote(p,safe='*/:.')+'&output=json&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200&collapse=urlkey&from=2000&to=2026'
              try:
                  b=fetch(q); pathlib.Path(f'out/search/cdx-{i}.json').write_bytes(b)
                  j=json.loads(b)
                  if j:
                      for row in j[1:]: all_cdx.append(row)
              except Exception as e:
                  pathlib.Path(f'out/search/cdx-{i}.err').write_text(repr(e))
          # Jina public search queries for indexed copies / old official PDF URLs.
          queries=[]
          for y in range(2002,2020):
              queries += [
                f'"Midwestern Journal of Theology" "{y}" PDF',
                f'site:mbts.edu "Midwestern Journal of Theology" "{y}" pdf',
              ]
          queries += [
            '"Midwestern Journal of Theology" "Spring 2021" PDF',
            'site:mbts.edu/wp-content/uploads "SP21" "MJT" pdf',
            'site:mbts.edu/wp-content/uploads "Midwestern Journal" pdf'
          ]
          found=[]
          for i,q in enumerate(queries):
              u='https://s.jina.ai/'+urllib.parse.quote(q,safe='')
              try:
                  b=fetch(u,60); t=b.decode('utf-8','replace'); pathlib.Path(f'out/search/q-{i:02d}.txt').write_text(t)
                  for url in re.findall(r'https?://[^\s<>\])]+',t):
                      url=url.rstrip('.,')
                      if any(k in url.lower() for k in ['mbts.edu','biblicalstudies','archive.org','galaxie.com']): found.append((q,url))
              except Exception as e:
                  pathlib.Path(f'out/search/q-{i:02d}.err').write_text(repr(e))
          with open('out/cdx-all.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['timestamp','original','statuscode','mimetype']); w.writerows(all_cdx)
          with open('out/search-found.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['query','url']); w.writerows(found)
          print('CDX_ROWS',len(all_cdx),'SEARCH_URLS',len(found))
          for r in all_cdx[:100]: print('CDX',*r,sep='\t')
          for r in found[:150]: print('SEARCH',*r,sep='\t')
          PY
      - name: Upload historical discovery
        uses: actions/upload-artifact@v4
        with:
          name: midwestern-historical-discovery
          path: out/
          retention-days: 1
