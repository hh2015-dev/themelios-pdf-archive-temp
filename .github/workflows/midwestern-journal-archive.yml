name: Midwestern Journal archive
on:
  pull_request:
    paths:
      - 'midwestern-journal-trigger.txt'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official Midwestern Journal PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          # MBTS blocks generic datacenter page requests. Read its public page through a text reader,
          # preserving the official URLs shown on that public page.
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://r.jina.ai/https://www.mbts.edu/resources/journal/' -o out/journal.txt
          python - <<'PY'
          import re,csv,pathlib,urllib.request,urllib.parse,subprocess
          text=pathlib.Path('out/journal.txt').read_text(errors='replace')
          # Markdown links plus any bare URLs.
          rows=[]
          for m in re.finditer(r'\[([^\]]*)\]\((https?://[^)]+)\)',text):
              rows.append((m.group(1).strip(),m.group(2).strip()))
          for u in re.findall(r'https?://[^\s<>\])]+',text):
              rows.append(('',u.strip()))
          # Dedup and retain context window around each URL.
          uniq=[]; seen=set()
          for label,u in rows:
              u=u.rstrip('.,')
              if u in seen: continue
              seen.add(u)
              pos=text.find(u); context=' '.join(text[max(0,pos-500):pos+250].split()) if pos>=0 else ''
              uniq.append((label,u,context))
          with open('out/all-links.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['anchor','url','context']); w.writerows(uniq)
          pdf=[r for r in uniq if '.pdf' in r[1].lower()]
          with open('out/pdf-links.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['anchor','url','context']); w.writerows(pdf)
          print('ALL_LINKS',len(uniq),'PDF_LINKS',len(pdf))
          # Try direct public PDF downloads with browser-like headers. Do not bypass auth/paywalls.
          results=[]
          for i,(label,u,context) in enumerate(pdf,1):
              fn=f'out/pdfs/{i:03d}.bin'
              cmd=['curl','-L','--retry','2','--connect-timeout','20','--max-time','120','-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64)','-H','Accept: application/pdf,text/html;q=0.9,*/*;q=0.8','-o',fn,'-w','%{http_code}\t%{url_effective}\t%{content_type}',u]
              try:
                  meta=subprocess.check_output(cmd,text=True,stderr=subprocess.DEVNULL).strip()
              except Exception as e:
                  results.append((i,'ERROR',0,label,u,'',repr(e)[:160],context)); continue
              b=pathlib.Path(fn).read_bytes() if pathlib.Path(fn).exists() else b''
              status='PDF' if b.startswith(b'%PDF-') else 'NOTPDF'
              if status=='PDF': pathlib.Path(fn).rename(f'out/pdfs/{i:03d}.pdf')
              results.append((i,status,len(b),label,u,meta,'',context))
              print(i,status,len(b),label,u)
          with open('out/pdf-manifest.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['n','status','bytes','anchor','url','curl_meta','error','context']); w.writerows(results)
          print('PDF_OK',sum(r[1]=='PDF' for r in results))
          PY
      - name: Upload Midwestern discovery
        uses: actions/upload-artifact@v4
        with:
          name: midwestern-journal-discovery
          path: out/
          retention-days: 1
