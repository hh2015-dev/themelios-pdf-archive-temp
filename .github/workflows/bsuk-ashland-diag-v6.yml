name: BSUK Ashland archive files diagnostic v6
on:
  push:
    paths:
      - 'bsuk_worker/ashland_diag_v6.py'
      - '.github/workflows/bsuk-ashland-diag-v6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bsuk_worker/ashland_diag_v6.py
