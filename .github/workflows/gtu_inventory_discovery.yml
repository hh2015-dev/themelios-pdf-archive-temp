name: GTU Inventory Discovery Temp
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU broadly and verify metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          : > out/search.tsv
          queries=(
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:hebrew OR title:aramaic OR title:syriac OR title:semitic)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:septuagint OR title:lxx OR title:greek OR title:papyr*)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:bible OR title:biblical OR title:testament OR title:gospel)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:isaiah OR title:jeremiah OR title:psalm* OR title:job OR title:genesis OR title:exodus)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:manuscript* OR title:textual OR title:criticism OR title:codex)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:qumran OR title:scroll* OR title:josephus OR title:philo OR title:mishna* OR title:talmud*)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:assyri* OR title:babylon* OR title:akkad* OR title:ugarit* OR title:archaeolog*)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (creator:calvin OR creator:luther OR title:patristic OR title:origen OR title:augustine OR title:jerome)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:theology OR title:church OR title:reformation OR title:mission*)'
          )
          for q in "${queries[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            for p in 1 3 7 12 20; do
              curl -fsSL "https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier,title,creator,date,year,volume,language,description,subject&rows=100&page=$p&output=json" -o tmp.json || continue
              jq -r '.response.docs[] | [(.identifier//""),(.title//""),((.creator//"")|if type=="array" then join("; ") else . end),((.year//.date//"")|tostring),((.volume//"")|tostring),((.language//"")|if type=="array" then join("; ") else . end)] | @tsv' tmp.json >> out/search.tsv
            done
          done
          sort -u out/search.tsv > out/search_unique.tsv
          head -n 700 out/search_unique.tsv > out/search_sample.tsv
          : > out/verified.tsv
          while IFS=$'\t' read -r id stitle screator syear svolume slang; do
            [ -n "$id" ] || continue
            curl -fsSL "https://archive.org/metadata/$id" -o meta.json || continue
            in_gtu=$(jq -r '[.metadata.collection[]? // .metadata.collection] | flatten | map(tostring) | index("graduatetheologicalunion") != null' meta.json 2>/dev/null || echo false)
            [ "$in_gtu" = "true" ] || continue
            restricted=$(jq -r '.metadata["access-restricted-item"] // false' meta.json)
            title=$(jq -r '.metadata.title // ""' meta.json)
            creator=$(jq -r '.metadata.creator // "" | if type=="array" then join("; ") else . end' meta.json)
            year=$(jq -r '.metadata.year // .metadata.date // "" | tostring' meta.json)
            volume=$(jq -r '.metadata.volume // "" | tostring' meta.json)
            edition=$(jq -r '.metadata.edition // "" | tostring' meta.json)
            series=$(jq -r '.metadata.series // "" | if type=="array" then join("; ") else tostring end' meta.json)
            language=$(jq -r '.metadata.language // "" | if type=="array" then join("; ") else tostring end' meta.json)
            contributor=$(jq -r '.metadata.contributor // .metadata.scanner // "" | if type=="array" then join("; ") else tostring end' meta.json)
            pages=$(jq -r '.metadata.pages // .metadata.page_number_confidence // "" | tostring' meta.json)
            pdf=$(jq -r '[.files[] | select(.name|test("\\.pdf$";"i")) | select((.private // "false") != "true") | select((.name|test("encrypted\\.pdf$|\\.lcpdf$";"i"))|not) | .name][0] // ""' meta.json)
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$title" "$creator" "$year" "$volume" "$edition" "$series" "$language" "$contributor" "$restricted" "$pdf" "$pages" >> out/verified.tsv
          done < out/search_sample.tsv
          echo "UNIQUE_SEARCH=$(wc -l < out/search_unique.tsv)"
          echo "VERIFIED=$(wc -l < out/verified.tsv)"
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-discovery
          path: out/
          compression-level: 6
