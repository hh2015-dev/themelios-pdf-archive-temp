name: Temporary JETS Repair
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: temporary-jets-repair
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q pypdf
      - run: python jets_discover.py
      - run: python jets_repair.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jets-repairs
          path: jets-repairs/
          if-no-files-found: error
