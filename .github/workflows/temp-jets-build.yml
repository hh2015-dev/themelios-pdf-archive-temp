name: Temporary JETS Build
on:
  push:
    branches: [ temp-jets-archive ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { start: 1, end: 8, name: jets-batch-01-08 }
          - { start: 9, end: 16, name: jets-batch-09-16 }
          - { start: 17, end: 24, name: jets-batch-17-24 }
          - { start: 25, end: 32, name: jets-batch-25-32 }
          - { start: 33, end: 40, name: jets-batch-33-40 }
          - { start: 41, end: 48, name: jets-batch-41-48 }
          - { start: 49, end: 56, name: jets-batch-49-56 }
          - { start: 57, end: 64, name: jets-batch-57-64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF merger
        run: python -m pip install --disable-pip-version-check -q pypdf
      - name: Refresh BiblicalStudies manifest
        run: python jets_discover.py
      - name: Build issue PDFs
        env:
          START_VOL: ${{ matrix.start }}
          END_VOL: ${{ matrix.end }}
          OUT_DIR: ${{ matrix.name }}
        run: python jets_build.py
      - name: Upload batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}/
          if-no-files-found: error
