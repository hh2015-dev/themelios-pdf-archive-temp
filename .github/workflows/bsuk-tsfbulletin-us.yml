name: BSUK TSF Bulletin US

on:
  push:
    branches: [main]
    paths:
      - 'bsuk_worker/download_tsfbulletin_us.py'
      - '.github/workflows/bsuk-tsfbulletin-us.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python bsuk_worker/download_tsfbulletin_us.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-tsfbulletin-us
          path: tsf_stage/**
          if-no-files-found: error
          retention-days: 1
