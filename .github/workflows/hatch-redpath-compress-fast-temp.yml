name: Hatch Redpath Compress Fast Temp
on:
  pull_request:
    branches: [ main ]
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils
      - name: Download original PDF
        run: |
          curl -L --fail --retry 3 -o original.pdf https://archive.org/download/concordancetosep00hatc_0/concordancetosep00hatc_0.pdf
          pdfinfo original.pdf | grep '^Pages:'
          pdftotext original.pdf original.txt
      - name: Compress high quality single pass
        run: |
          gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dNOPAUSE -dQUIET -dBATCH \
            -dDetectDuplicateImages=true -dCompressFonts=true -dSubsetFonts=true \
            -dDownsampleColorImages=true -dColorImageDownsampleType=/Bicubic -dColorImageResolution=190 \
            -dDownsampleGrayImages=true -dGrayImageDownsampleType=/Bicubic -dGrayImageResolution=190 \
            -dDownsampleMonoImages=true -dMonoImageDownsampleType=/Subsample -dMonoImageResolution=300 \
            -dAutoFilterColorImages=false -dColorImageFilter=/DCTEncode -dJPEGQ=90 \
            -dAutoFilterGrayImages=false -dGrayImageFilter=/DCTEncode \
            -sOutputFile=final.pdf original.pdf
          stat -c%s original.pdf > original_size.txt
          stat -c%s final.pdf > final_size.txt
          pdfinfo original.pdf | grep '^Pages:' | awk '{print $2}' > original_pages.txt
          pdfinfo final.pdf | grep '^Pages:' | awk '{print $2}' > final_pages.txt
          pdftotext final.pdf final.txt
          wc -c < original.txt > original_text_chars.txt
          wc -c < final.txt > final_text_chars.txt
          echo "Original $(cat original_size.txt); Final $(cat final_size.txt)"
          echo "Pages $(cat original_pages.txt)/$(cat final_pages.txt)"
          echo "Text $(cat original_text_chars.txt)/$(cat final_text_chars.txt)"
          test "$(cat original_pages.txt)" = "$(cat final_pages.txt)"
          test "$(stat -c%s final.pdf)" -lt 100000000
          python - <<'PY'
          o=int(open('original_text_chars.txt').read()); f=int(open('final_text_chars.txt').read())
          if o>0 and f < o*0.95: raise SystemExit(f'Text layer loss: {o}->{f}')
          PY
      - name: Upload compressed PDF
        uses: actions/upload-artifact@v4
        with:
          name: hatch-redpath-compressed-fast
          path: final.pdf
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: hatch-redpath-compress-fast-report
          path: |
            original_size.txt
            final_size.txt
            original_pages.txt
            final_pages.txt
            original_text_chars.txt
            final_text_chars.txt
