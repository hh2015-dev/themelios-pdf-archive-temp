            restricted=m.get('access-restricted-item',m.get('printdisabled',''))
            pages=m.get('imagecount','')
            fields=[ident,str(ingtu),clean(m.get('title')),clean(m.get('creator')),clean(m.get('date') or m.get('year')),clean(m.get('volume')),clean(m.get('edition')),clean(m.get('series')),clean(m.get('contributor')),clean(m.get('language')),clean(m.get('mediatype')),clean(restricted),clean(pdf),clean(pages)]
