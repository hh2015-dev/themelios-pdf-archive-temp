          def clean(v):
            if isinstance(v,list): v='; '.join(map(str,v))
            return re.sub(r'\s+',' ',str(v or '')).strip().replace('\t',' ')
          for ident in ids:
            j=requests.get('https://archive.org/metadata/'+ident,timeout=30).json(); m=j.get('metadata',{})
