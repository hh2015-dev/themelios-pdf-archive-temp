name: TEMP RCL V15 recover collision
on:
  pull_request:
    paths:
      - '.github/workflows/rcl-v15-recover-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover and validate missing PDF
        shell: bash
        run: |
          set -euo pipefail
          f='Religion in Communist Lands - Volume 015 - The Hungarian Minority in Romania - pp204-206.pdf'
          curl -fL --retry 4 --retry-delay 2 'https://biblicalstudies.org.uk/pdf/rcl/15-2_204.pdf' -o "$f"
          test "$(head -c 5 "$f")" = '%PDF-'
          test "$(stat -c%s "$f")" -eq 89184
          echo "6951b382ac3505f263bcff59918cf977521189c7e0b4c6d90a74515eea7d9375  $f" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: rcl-v15-recovered-204
          path: Religion in Communist Lands - Volume 015 - The Hungarian Minority in Romania - pp204-206.pdf
          if-no-files-found: error
