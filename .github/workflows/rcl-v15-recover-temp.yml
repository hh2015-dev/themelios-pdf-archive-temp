name: TEMP RCL V15 recover collision
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rcl-v15-recover-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover, validate and persist missing PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-rcl-v15
          f='tmp-rcl-v15/Religion in Communist Lands - Volume 015 - The Hungarian Minority in Romania - pp204-206.pdf'
          curl -fL --retry 4 --retry-delay 2 'https://biblicalstudies.org.uk/pdf/rcl/15-2_204.pdf' -o "$f"
          test "$(head -c 5 "$f")" = '%PDF-'
          test "$(stat -c%s "$f")" -eq 89184
          echo "6951b382ac3505f263bcff59918cf977521189c7e0b4c6d90a74515eea7d9375  $f" | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$f"
          git commit -m 'temp: persist recovered RCL v15 PDF'
          git push
