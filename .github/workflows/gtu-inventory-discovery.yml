name: GTU inventory discovery temporary
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover verified GTU candidates
        run: python3 gtu_discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-candidates
          path: gtu_verified.json
          compression-level: 6
