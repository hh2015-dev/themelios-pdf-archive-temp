name: GTU inventory discovery
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact GTU collection broadly
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time, csv, sys
          base='https://archive.org/advancedsearch.php'
          groups=[
            '(title:hebrew OR title:aramaic OR title:syriac OR title:semitic OR title:ugaritic OR title:akkadian)',
            '(title:septuagint OR title:lxx OR title:greek OR title:papyri OR title:manuscript OR title:textual)',
            '(title:bible OR title:biblical OR title:testament OR title:genesis OR title:exodus OR title:psalms OR title:isaiah OR title:job OR title:matthew OR title:mark OR title:luke OR title:john OR title:romans)',
            '(title:qumran OR title:scrolls OR title:talmud OR title:midrash OR title:rabbinic OR title:josephus OR title:philo)',
            '(title:archaeology OR title:palestine OR title:assyrian OR title:babylonian OR title:canaanite OR title:phoenician OR title:oriental)',
            '(title:calvin OR title:luther OR title:jerome OR title:origen OR title:augustine OR title:patristic OR title:reformation)',
            '(title:journal OR title:bulletin OR title:quarterly OR title:review OR title:semeia OR title:interpretation)',
            '(title:grammar OR title:lexicon OR title:concordance OR title:bibliography OR title:dictionary OR title:catalogue)',
            '(title:theology OR title:church OR title:christian OR title:creed OR title:mission OR title:judaism OR title:religion)'
          ]
          fields=['identifier','title','creator','year','date','volume','edition','series','language','collection','contributor','description','subject','mediatype']
          seen={}
          examined=0
          for gi,g in enumerate(groups):
            for page in [1,3,6,10,15,20]:
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND {g}'
              params=[('q',q)]+[( 'fl[]',f) for f in fields]+[('rows','100'),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              url=base+'?'+urllib.parse.urlencode(params)
              try:
                with urllib.request.urlopen(url, timeout=45) as r:
                  data=json.load(r)
              except Exception as e:
                print('ERR',gi,page,e,file=sys.stderr); continue
              docs=data.get('response',{}).get('docs',[])
              examined += len(docs)
              for d in docs:
                ident=d.get('identifier')
                if ident: seen[ident]=d
              time.sleep(0.15)
          print('EXAMINED',examined)
          print('UNIQUE',len(seen))
          with open('gtu_candidates.jsonl','w',encoding='utf-8') as f:
            for ident in sorted(seen):
              f.write(json.dumps(seen[ident],ensure_ascii=False)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates
          path: gtu_candidates.jsonl
          compression-level: 6
