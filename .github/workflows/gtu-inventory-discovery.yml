name: GTU inventory discovery
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected GTU candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, os
          ids='''grammatikdergrie0001mays_w3m2
greekenglishdict0000revj
assyriandictiona0007unse
assyriandictiona0016unse
assyriandictiona0021unse
beginninggreekbo0000john_p5e7
biblical-archaeology-review_1975-1994_index
concordiabibledi0000erwi
dictionaryofchri0011fern
gospelaccordingt0000drer
gospelaccordingt0000unse_q7n5
centurybible0000josh
greekenglishlexi0001lidd
gtu_32400003955881
hebrewunioncolle0030vari
moffattbibleconc0000unse
rsvinterlineargr0000alfr
publishedworksof0000davi_c4h9
britishmuseumcat0000vari_s4f4
britishmuseumcat0000vari_y0x4'''.split()
          out=[]
          for ident in ids:
            url='https://archive.org/metadata/'+urllib.parse.quote(ident)
            with urllib.request.urlopen(url,timeout=60) as r:
              m=json.load(r)
            md=m.get('metadata',{})
            coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            files=m.get('files',[])
            public_pdfs=[]
            for f in files:
              name=f.get('name','')
              private=str(f.get('private','false')).lower()=='true'
              if name.lower().endswith('.pdf') and not name.lower().endswith('.lcpdf') and not private and 'encrypted' not in name.lower():
                public_pdfs.append(name)
            rec={
              'identifier':ident,'belongs_gtu':'graduatetheologicalunion' in coll,
              'title':md.get('title'),'creator':md.get('creator'),'year':md.get('year') or md.get('date'),
              'date':md.get('date'),'volume':md.get('volume'),'edition':md.get('edition'),'series':md.get('series'),
              'language':md.get('language'),'contributor':md.get('contributor'),'subject':md.get('subject'),
              'description':md.get('description'),'mediatype':md.get('mediatype'),'collection':coll,
              'access_restricted':md.get('access-restricted-item'),'printdisabled':md.get('printdisabled'),
              'public_pdfs':public_pdfs[:10]
            }
            out.append(rec)
          with open('gtu_verified.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print('VERIFIED',len(out),'GTU',sum(1 for x in out if x['belongs_gtu']))
          for x in out: print(x['identifier'],x['belongs_gtu'],x['title'],x['year'],x['volume'],len(x['public_pdfs']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified
          path: gtu_verified.json
          compression-level: 6
