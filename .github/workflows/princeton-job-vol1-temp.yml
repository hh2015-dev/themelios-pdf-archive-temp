name: Princeton Job Volume 1 Transfer Temp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Job Volume 1 PDF
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            'https://archive.org/download/criticalexegetic1401driv/criticalexegetic1401driv.pdf' \
            -o 'A Critical and Exegetical Commentary on the Book of Job - Volume 1 - S. R. Driver and G. B. Gray.pdf'
          test -s 'A Critical and Exegetical Commentary on the Book of Job - Volume 1 - S. R. Driver and G. B. Gray.pdf'
          file 'A Critical and Exegetical Commentary on the Book of Job - Volume 1 - S. R. Driver and G. B. Gray.pdf'
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: princeton-job-driver-gray-volume-1
          path: 'A Critical and Exegetical Commentary on the Book of Job - Volume 1 - S. R. Driver and G. B. Gray.pdf'
          retention-days: 1
          compression-level: 0
