name: GTU inventory run2 discovery
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection broadly
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,re,time
          queries=[
            'collection:graduatetheologicalunion AND mediatype:texts AND (qumran OR "dead sea" OR pseudepigrapha OR apocrypha)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (ugarit OR akkadian OR assyrian OR babylonian OR cuneiform)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (patristic OR origen OR jerome OR augustine OR chrysostom OR irenaeus)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (reformation OR luther OR calvin OR zwingli OR melanchthon)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (mission OR missions OR missiology)',
            'collection:graduatetheologicalunion AND mediatype:texts AND ("church history" OR creed OR confession OR apologetics)',
            'collection:graduatetheologicalunion AND mediatype:texts AND (lexicon OR concordance OR grammar OR bibliography)',
            'collection:graduatetheologicalunion AND mediatype:texts AND ("early christian" OR "second temple" OR josephus OR philo)',
            'collection:graduatetheologicalunion AND mediatype:texts AND ("journal of biblical literature" OR "biblical archaeologist" OR "bible translator")',
            'collection:graduatetheologicalunion AND mediatype:texts AND ("old testament" OR "new testament")',
          ]
          seen={}; examined=0
          for qi,q in enumerate(queries):
            for page in (2,5,9,14):
              params=[('q',q),('fl[]','identifier'),('fl[]','title'),('fl[]','creator'),('fl[]','year'),('fl[]','date'),('fl[]','language'),('fl[]','subject'),('rows','100'),('page',str(page)),('output','json')]
              try:
                r=requests.get('https://archive.org/advancedsearch.php',params=params,timeout=30); r.raise_for_status(); docs=r.json()['response']['docs']
              except Exception as e:
                print('ERR',qi,page,e); continue
              examined+=len(docs)
              for d in docs:
                if d.get('identifier'): seen.setdefault(d['identifier'],d)
              time.sleep(.08)
          print(f'EXAMINED={examined} UNIQUE={len(seen)}')
          def clean(v):
            if isinstance(v,list): v='; '.join(map(str,v[:4]))
            return re.sub(r'\s+',' ',str(v or '')).strip()
          for ident,d in list(seen.items())[:500]:
            print('\t'.join([ident,clean(d.get('title')),clean(d.get('creator')),clean(d.get('year') or d.get('date')),clean(d.get('language'))]))
          PY
