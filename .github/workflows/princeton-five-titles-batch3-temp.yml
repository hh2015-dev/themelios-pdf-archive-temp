name: Princeton Five Titles Batch 3 Temp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Driver Deuteronomy
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/criticalexegetic05driv/criticalexegetic05driv.pdf' -o 'Driver Deuteronomy.pdf'
          test -s 'Driver Deuteronomy.pdf'
      - name: Upload Driver Deuteronomy
        uses: actions/upload-artifact@v4
        with:
          name: princeton-driver-deuteronomy
          path: 'Driver Deuteronomy.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Moore Judges
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/criticalexegetic07moor/criticalexegetic07moor.pdf' -o 'Moore Judges.pdf'
          test -s 'Moore Judges.pdf'
      - name: Upload Moore Judges
        uses: actions/upload-artifact@v4
        with:
          name: princeton-moore-judges
          path: 'Moore Judges.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Toy Proverbs
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/criticalexegetic00toyc/criticalexegetic00toyc.pdf' -o 'Toy Proverbs.pdf'
          test -s 'Toy Proverbs.pdf'
      - name: Upload Toy Proverbs
        uses: actions/upload-artifact@v4
        with:
          name: princeton-toy-proverbs
          path: 'Toy Proverbs.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Stuart Daniel
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/commentaryonbook1850stua/commentaryonbook1850stua.pdf' -o 'Stuart Daniel.pdf'
          test -s 'Stuart Daniel.pdf'
      - name: Upload Stuart Daniel
        uses: actions/upload-artifact@v4
        with:
          name: princeton-stuart-daniel
          path: 'Stuart Daniel.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Delitzsch Hebrews Vol 2
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/commentaryonepis02deli/commentaryonepis02deli.pdf' -o 'Delitzsch Hebrews Vol 2.pdf'
          test -s 'Delitzsch Hebrews Vol 2.pdf'
      - name: Upload Delitzsch Hebrews Vol 2
        uses: actions/upload-artifact@v4
        with:
          name: princeton-delitzsch-hebrews-vol2
          path: 'Delitzsch Hebrews Vol 2.pdf'
          retention-days: 1
          compression-level: 0
