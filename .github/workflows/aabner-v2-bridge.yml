name: AABNER Volume 2 bridge

on:
  push:
    paths:
      - 'aabner-v2-trigger.txt'

jobs:
  fetch-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and download 2022 full issues
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, html as htmllib, os
          UA={'User-Agent':'Mozilla/5.0'}
          archive='https://aabner.org/ojs/index.php/beabs/issue/archive'
          def get(url):
              r=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(r,timeout=120) as x:
                  return x.read(), x.headers.get_content_type(), x.geturl()
          body,_,_=get(archive)
          text=body.decode('utf-8','replace')
          links=[]
          for href,label in re.findall(r'<a[^>]+href="([^"]*issue/view/[^"]+)"[^>]*>(.*?)</a>',text,re.I|re.S):
              label=re.sub('<[^>]+>',' ',label)
              label=re.sub(r'\s+',' ',htmllib.unescape(label)).strip()
              if '2022' in label:
                  u=urllib.parse.urljoin(archive,htmllib.unescape(href))
                  if u not in [x[0] for x in links]: links.append((u,label))
          if not links:
              # fallback: inspect every issue page linked from archive and keep pages containing 2022
              allurls=[]
              for href in re.findall(r'href="([^"]*issue/view/[^"]+)"',text,re.I):
                  u=urllib.parse.urljoin(archive,htmllib.unescape(href))
                  if u not in allurls: allurls.append(u)
              for u in allurls:
                  try:
                      b,_,_=get(u); t=b.decode('utf-8','replace')
                      if '2022' in t: links.append((u,'2022'))
                  except: pass
          print('ISSUES',links)
          if not links: raise SystemExit('No 2022 issues found')
          os.makedirs('out',exist_ok=True)
          n=0
          for issue_url,label in links:
              b,_,_=get(issue_url); t=b.decode('utf-8','replace')
              m=re.search(r'Full Issue.*?<a[^>]+href="([^"]+)"',t,re.I|re.S)
              if not m:
                  print('NO FULL ISSUE',issue_url); continue
              landing=urllib.parse.urljoin(issue_url,htmllib.unescape(m.group(1)))
              b2,c2,_=get(landing)
              pdf=None; final_url=landing
              if b2.startswith(b'%PDF') or c2=='application/pdf': pdf=b2
              else:
                  t2=b2.decode('utf-8','replace')
                  vals=re.findall(r'(?:href|src)=["\']([^"\']+)',t2,re.I)
                  cands=[]
                  for v in vals:
                      u=urllib.parse.urljoin(landing,htmllib.unescape(v))
                      if 'issue/download/' in u or '.pdf' in u.lower(): cands.append(u)
                  for u in cands:
                      try:
                          bb,cc,_=get(u)
                          if bb.startswith(b'%PDF') or cc=='application/pdf': pdf=bb; final_url=u; break
                      except: pass
              if pdf is None:
                  print('NO PDF',issue_url); continue
              n+=1
              out=f'out/AABNER - Volume 002 Issue {n:02d} - 2022.pdf'
              open(out,'wb').write(pdf)
              print('SAVED',out,len(pdf),final_url)
          if n==0: raise SystemExit('No PDFs downloaded')
          print('TOTAL',n)
          PY
      - name: Upload Volume 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aabner-volume-002-2022
          path: out/*.pdf
          if-no-files-found: error
          compression-level: 0
