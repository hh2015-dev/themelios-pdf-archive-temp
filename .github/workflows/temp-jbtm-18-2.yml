name: temp-jbtm-18-2
on:
  push:
    branches:
      - temp-jbtm-18-2
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official JBTM 18.2 PDF
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          page = 'https://www.nobts.edu/baptist-center-theology/journals/fall-2021.html'
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.href=None; self.text=''; self.hit=None
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.href = dict(attrs).get('href'); self.text=''
              def handle_data(self, data):
                  if self.href is not None: self.text += data
              def handle_endtag(self, tag):
                  if tag == 'a' and self.href is not None:
                      if self.text.strip().lower() == 'view pdf': self.hit = self.href
                      self.href=None; self.text=''
          req=Request(page, headers={'User-Agent':'Mozilla/5.0'})
          html=urlopen(req, timeout=30).read().decode('utf-8','replace')
          p=P(); p.feed(html)
          if not p.hit: raise SystemExit('View PDF link not found')
          pdf_url=urljoin(page,p.hit)
          req=Request(pdf_url, headers={'User-Agent':'Mozilla/5.0','Referer':page})
          data=urlopen(req, timeout=60).read()
          if not data.startswith(b'%PDF') or len(data) < 10000: raise SystemExit('Downloaded payload is not a valid-looking PDF')
          open('jbtm-18-2-fall-2021.pdf','wb').write(data)
          open('source-url.txt','w',encoding='utf-8').write(pdf_url+'\n')
          print(pdf_url)
          print(len(data))
      - uses: actions/upload-artifact@v4
        with:
          name: jbtm-18-2-fall-2021
          path: |
            jbtm-18-2-fall-2021.pdf
            source-url.txt
          if-no-files-found: error
