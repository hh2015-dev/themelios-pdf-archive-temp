name: temp-jbtm-18-2
on:
  push:
    branches:
      - temp-jbtm-18-2
    paths:
      - '.github/workflows/temp-jbtm-18-2.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-jbtm-18-2
      - name: Fetch official JBTM 18.2 PDF
        shell: python
        run: |
          from urllib.request import Request, urlopen
          url = 'https://www.nobts.edu/baptist-center-theology/journals/journals/jbtm-18b-fall-2021.pdf'
          req=Request(url, headers={'User-Agent':'Mozilla/5.0'})
          data=urlopen(req, timeout=60).read()
          if not data.startswith(b'%PDF') or len(data) < 10000:
              raise SystemExit('Downloaded payload is not a valid-looking PDF')
          open('jbtm-18-2-fall-2021.pdf','wb').write(data)
          print('BYTES', len(data))
      - name: Commit temporary PDF to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jbtm-18-2-fall-2021.pdf
          git commit -m 'Temporary JBTM 18.2 PDF' || exit 0
          git push origin HEAD:temp-jbtm-18-2
