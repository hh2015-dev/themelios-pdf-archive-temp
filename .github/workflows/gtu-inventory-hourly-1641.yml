name: GTU Inventory Metadata Miner 1641

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gtu-inventory-hourly-1641
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mine exact GTU collection metadata only
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          BASE='https://archive.org'
          terms=['bible','biblical','hebrew','aramaic','syriac','greek','septuagint','testament','manuscript','talmud','mishnah','jewish','archaeology','patristic','reformation','theology','church history','missions','creed','apologetic']
          found={}
          def getj(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GTU-inventory-research/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          for term in terms:
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND (title:"{term}" OR subject:"{term}")'
              for page in (1,2,3):
                  params={'q':q,'fl[]':['identifier','title','creator','date','year','language','subject','volume','description','contributor'],'rows':35,'page':page,'output':'json'}
                  url=BASE+'/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True)
                  try: docs=getj(url)['response']['docs']
                  except Exception: continue
                  for d in docs:
                      i=d.get('identifier')
                      if i: found[i]=d
                  time.sleep(.15)
          keysA=['bible','biblical','hebrew','aramaic','syriac','greek','septuagint','old testament','new testament','manuscript','textual','talmud','mishnah','rabbin','jewish','archaeolog','apocry','pseudepig','dead sea','concordance','lexicon','grammar','exegesis','commentary','scripture']
          keysB=['patrist','father','reformation','luther','calvin','theology','church history','creed','confession','apolog','mission','judaism','early christian','doctrine','philosophy of religion']
          out=[]
          for i,d in found.items():
              blob=' '.join(str(d.get(k,'')) for k in ['title','subject','description']).lower()
              score=20*sum(k in blob for k in keysA)+8*sum(k in blob for k in keysB)
              if score<8: continue
              try: m=getj(BASE+'/metadata/'+urllib.parse.quote(i))
              except Exception: continue
              md=m.get('metadata',{})
              coll=md.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              if 'graduatetheologicalunion' not in coll: continue
              pdfs=[f for f in m.get('files',[]) if f.get('name','').lower().endswith('.pdf') and f.get('size')]
              if not pdfs: continue
              pdfs.sort(key=lambda f:(0 if f.get('source')=='original' else 1, len(f.get('name',''))))
              p=pdfs[0]
              out.append({
                'identifier':i,'title':md.get('title') or d.get('title'),'creator':md.get('creator') or d.get('creator'),
                'date':md.get('date') or d.get('date') or d.get('year'),'year':d.get('year'),
                'language':md.get('language') or d.get('language'),'subject':md.get('subject') or d.get('subject'),
                'volume':md.get('volume') or d.get('volume'),'description':md.get('description') or d.get('description'),
                'contributor':md.get('contributor') or d.get('contributor'),'edition':md.get('edition'),'series':md.get('series'),
                'collection':coll,'pdf_name':p.get('name'),'pdf_size':p.get('size'),'score':score,
                'item_url':BASE+'/details/'+i,'pdf_url':BASE+'/download/'+i+'/'+urllib.parse.quote(p.get('name'))
              })
              time.sleep(.08)
          out.sort(key=lambda x:(-x['score'], str(x.get('title',''))))
          with open('gtu_candidates_1641.json','w',encoding='utf-8') as f: json.dump(out[:160],f,ensure_ascii=False,indent=2)
          print('verified candidates',len(out))
          PY
      - name: Commit candidate metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gtu_candidates_1641.json
          git commit -m 'TEMP verified GTU inventory candidates' || exit 0
          git push origin HEAD:gtu-inventory-hourly-1641
