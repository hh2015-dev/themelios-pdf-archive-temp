name: GTU inventory hourly validation 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected GTU items
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          ids = [
            'prophets0000krae',
            'origeneswerke04orig_1',
            'labibletraductio0005unse',
            'joaugernestiopus00erne',
            'sefersegalmugash0000grin',
            'bibleinworksofth0013marc',
            'zwischenathenund0000kais',
            'introductiontool0000cere_h1u6',
            'scripturediscern0000john_k3z0',
            'ladoctrinemorale0000tres',
            'psaltermartyrolo0000lawl',
            'flaviiiosephiope0005jose',
            'dieverwendungvon0002spin',
            'sibyllineoracles0000unse_n9d9',
            'newenglishbible0000vari',
            'sim_journal-of-biblical-literature_1930_49_3',
            'sim_journal-of-biblical-literature_1938-03_57_1',
            'sim_journal-of-biblical-literature_1940-09_59_3',
            'greatpersonaliti0000laso_m3q2',
            'holybiblerevised0000thom'
          ]
          def scalar(v):
              if isinstance(v,list): return '; '.join(str(x) for x in v)
              return '' if v is None else str(v)
          out=[]
          for ident in ids:
              with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident), timeout=45) as r:
                  data=json.load(r)
              m=data.get('metadata',{})
              col=m.get('collection',[])
              cols=col if isinstance(col,list) else [col]
              public_pdf=''
              for f in data.get('files',[]):
                  name=f.get('name','')
                  low=name.lower()
                  if not low.endswith('.pdf'): continue
                  if f.get('private') in (True,'true','1',1): continue
                  if low.endswith('encrypted.pdf') or low.endswith('.lcpdf'): continue
                  public_pdf=name; break
              imagecount=m.get('imagecount','') or m.get('pagecount','') or ''
              rec={
                'identifier':ident,
                'gtu_member':'graduatetheologicalunion' in cols,
                'collections':cols,
                'title':scalar(m.get('title')),
                'creator':scalar(m.get('creator')),
                'date':scalar(m.get('date') or m.get('year')),
                'volume':scalar(m.get('volume')),
                'edition':scalar(m.get('edition')),
                'series':scalar(m.get('series')),
                'language':scalar(m.get('language')),
                'contributor':scalar(m.get('contributor')),
                'mediatype':scalar(m.get('mediatype')),
                'subject':scalar(m.get('subject')),
                'description':scalar(m.get('description')),
                'restricted':scalar(m.get('access-restricted-item') or m.get('printdisabled')),
                'public_pdf':public_pdf,
                'direct_pdf':('https://archive.org/download/'+urllib.parse.quote(ident)+'/'+urllib.parse.quote(public_pdf)) if public_pdf else '',
                'pages':scalar(imagecount)
              }
              out.append(rec)
              print(ident, rec['gtu_member'], rec['title'][:100], 'PDF' if public_pdf else 'NO_PUBLIC_PDF')
              time.sleep(.1)
          with open('out/validated.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-hourly-validated
          path: out/validated.json
