name: Princeton Five Titles Batch 5 Temp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Hodge Ephesians
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/commentaryonepisephes00hodg/commentaryonepisephes00hodg.pdf' -o 'Hodge Ephesians.pdf'
          test -s 'Hodge Ephesians.pdf'
      - name: Upload Hodge Ephesians
        uses: actions/upload-artifact@v4
        with:
          name: princeton-hodge-ephesians
          path: 'Hodge Ephesians.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Moffatt Hebrews
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/criticalexegetic00moff_0/criticalexegetic00moff_0.pdf' -o 'Moffatt Hebrews.pdf'
          test -s 'Moffatt Hebrews.pdf'
      - name: Upload Moffatt Hebrews
        uses: actions/upload-artifact@v4
        with:
          name: princeton-moffatt-hebrews
          path: 'Moffatt Hebrews.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Charles Revelation Vol 1
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/criticalexegetic01char/criticalexegetic01char.pdf' -o 'Charles Revelation Vol 1.pdf'
          test -s 'Charles Revelation Vol 1.pdf'
      - name: Upload Charles Revelation Vol 1
        uses: actions/upload-artifact@v4
        with:
          name: princeton-charles-revelation-vol1
          path: 'Charles Revelation Vol 1.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Schultz OT Theology Vol 1
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/oldtestamenttheo01schu/oldtestamenttheo01schu.pdf' -o 'Schultz OT Theology Vol 1.pdf'
          test -s 'Schultz OT Theology Vol 1.pdf'
      - name: Upload Schultz OT Theology Vol 1
        uses: actions/upload-artifact@v4
        with:
          name: princeton-schultz-ot-theology-vol1
          path: 'Schultz OT Theology Vol 1.pdf'
          retention-days: 1
          compression-level: 0

      - name: Download Godet Luke
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 'https://archive.org/download/commentaryongosp00gode/commentaryongosp00gode.pdf' -o 'Godet Luke.pdf'
          test -s 'Godet Luke.pdf'
      - name: Upload Godet Luke
        uses: actions/upload-artifact@v4
        with:
          name: princeton-godet-luke
          path: 'Godet Luke.pdf'
          retention-days: 1
          compression-level: 0
