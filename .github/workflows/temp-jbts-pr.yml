name: temp-jbts-pr
on:
  pull_request:
    branches: [main]
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-jbts-archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pypdf
      - run: python jbts_worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: jbts-official-remaining
          path: jbts_out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record run id
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > jbts-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jbts-run-id.txt
          git commit -m 'Temporary JBTS run metadata' || exit 0
          git push origin HEAD:temp-jbts-archive
