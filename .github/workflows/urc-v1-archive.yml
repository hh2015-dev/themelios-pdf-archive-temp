name: URC Volume 1 archive

on:
  push:
    branches: [urc-v1-archive-run]
    paths:
      - '.github/workflows/urc-v1-archive.yml'
      - 'bridge/urc-v1-trigger.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Volume 1 complete issues and index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          import hashlib, json, os, urllib.request
          base='https://biblicalstudies.org.uk/pdf/jurchs/'
          names=['index-01.pdf']+[f'01-{i:02d}.pdf' for i in range(1,11)]
          rows=[]
          for name in names:
              url=base+name
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1)'})
              with urllib.request.urlopen(req,timeout=120) as r: data=r.read()
              if data[:5] != b'%PDF-': raise RuntimeError(f'Not a PDF: {url}')
              open(os.path.join('out','pdfs',name),'wb').write(data)
              rows.append({'basename':name,'url':url,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              print('OK',name,len(data))
          json.dump(rows,open('out/manifest.json','w'),indent=2)
          if len(rows)!=11: raise SystemExit('Expected 11 PDFs')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: urc-volume-1-complete-pdfs
          path: out/
          compression-level: 0
          retention-days: 1
      - name: Record run id
        shell: bash
        run: |
          mkdir -p bridge
          printf '%s\n' "$GITHUB_RUN_ID" > bridge/urc-v1-last-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/urc-v1-last-run.txt
          git commit -m "Record URC Volume 1 run $GITHUB_RUN_ID" || exit 0
          git push
