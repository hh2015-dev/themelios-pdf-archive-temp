name: GTU Inventory Discovery Auto
on:
  push:
    branches: [ gtu-inventory-auto-20260825-1843 ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection broadly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time, random
          terms = [
            'hebrew','aramaic','syriac','semitic','septuagint','old testament','new testament',
            'biblical','bible','textual criticism','manuscript','papyri','dead sea scrolls','qumran',
            'talmud','rabbinic','judaism','apocrypha','pseudepigrapha','cuneiform','assyrian','babylonian',
            'ugaritic','archaeology','palestine','greek','lexicon','grammar','concordance','calvin','luther',
            'augustine','origen','patristic','theology','church history','reformation','missions'
          ]
          pages = [1,2,4,7]
          found = {}
          for term in terms:
            for page in pages:
              q = f'collection:graduatetheologicalunion AND mediatype:texts AND ({term})'
              params = [
                ('q', q),('fl[]','identifier'),('fl[]','title'),('fl[]','creator'),('fl[]','date'),('fl[]','year'),
                ('fl[]','volume'),('fl[]','language'),('fl[]','subject'),('fl[]','contributor'),('rows','50'),('page',str(page)),('output','json')
              ]
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params)
              try:
                with urllib.request.urlopen(url, timeout=30) as r:
                  docs=json.load(r)['response']['docs']
                for d in docs:
                  ident=d.get('identifier')
                  if ident:
                    found[ident]=d
              except Exception as e:
                print('SEARCH_ERR',term,page,e)
              time.sleep(0.08)
          print('UNIQUE_SEARCH_RESULTS',len(found))
          # metadata verify up to 700, deterministic spread by identifier hash-like ordering
          ids=sorted(found)
          if len(ids)>700:
            step=max(1,len(ids)//700)
            ids=ids[::step][:700]
          out=[]
          for i,ident in enumerate(ids,1):
            try:
              with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=30) as r:
                m=json.load(r)
              md=m.get('metadata',{})
              coll=md.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              if 'graduatetheologicalunion' not in coll:
                continue
              files=m.get('files',[])
              pdfs=[]
              for f in files:
                n=f.get('name','')
                if n.lower().endswith('.pdf') and not n.lower().endswith('_text.pdf'):
                  if str(f.get('private','false')).lower()!='true' and 'encrypted' not in n.lower() and not n.lower().endswith('.lcpdf'):
                    pdfs.append(f)
              if not pdfs:
                # allow text pdf too if public
                for f in files:
                  n=f.get('name','')
                  if n.lower().endswith('.pdf') and str(f.get('private','false')).lower()!='true' and 'encrypted' not in n.lower() and not n.lower().endswith('.lcpdf'):
                    pdfs.append(f)
              pdf=pdfs[0]['name'] if pdfs else ''
              pages=md.get('pages') or md.get('page-progression') or ''
              out.append({
                'identifier':ident,'title':md.get('title',''),'creator':md.get('creator',''),'date':md.get('date',''),'year':md.get('year',''),
                'volume':md.get('volume',''),'edition':md.get('edition',''),'series':md.get('series',''),'language':md.get('language',''),
                'subject':md.get('subject',''),'contributor':md.get('contributor',''),'collection':coll,
                'public_pdf':pdf,'pages':pages,'mediatype':md.get('mediatype',''),'description':md.get('description',''),
                'access_restricted':md.get('access-restricted-item',''), 'printdisabled':md.get('printdisabled','')
              })
            except Exception as e:
              print('META_ERR',ident,e)
            if i%100==0: print('VERIFIED',i,'OF',len(ids))
            time.sleep(0.05)
          with open('gtu_candidates.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print('VERIFIED_GTU',len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates
          path: gtu_candidates.json
          compression-level: 6
