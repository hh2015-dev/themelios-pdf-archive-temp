name: GTU Inventory Discovery Auto
on:
  push:
    branches: [ gtu-inventory-auto-20260825-1843 ]
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine distributed GTU corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries=[
            ('hebrew',1),('aramaic',3),('syriac',7),('septuagint',12),('textual criticism',4),
            ('manuscript',9),('papyri',6),('qumran',2),('rabbinic',5),('apocrypha',8),
            ('cuneiform',11),('ugaritic',3),('archaeology',10),('new testament',13),('old testament',14),
            ('greek',15),('calvin',6),('patristic',9),('reformation',12),('missions',15)
          ]
          found={}
          for term,page in queries:
            q=f'collection:graduatetheologicalunion AND mediatype:texts AND ({term})'
            params=[('q',q),('fl[]','identifier'),('fl[]','title'),('fl[]','creator'),('fl[]','date'),('fl[]','year'),('fl[]','volume'),('fl[]','language'),('fl[]','subject'),('fl[]','contributor'),('rows','100'),('page',str(page)),('output','json')]
            url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params)
            try:
              with urllib.request.urlopen(url,timeout=20) as r: docs=json.load(r)['response']['docs']
              for d in docs:
                if d.get('identifier'): found[d['identifier']]=d
              print(term,page,len(docs))
            except Exception as e: print('ERR',term,page,e)
          with open('gtu_search_candidates.json','w',encoding='utf-8') as f: json.dump(list(found.values()),f,ensure_ascii=False,indent=2)
          print('UNIQUE_SEARCH_RESULTS',len(found))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-search-candidates
          path: gtu_search_candidates.json
