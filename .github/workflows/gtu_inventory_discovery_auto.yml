name: GTU Inventory Discovery Auto
on:
  push:
    branches: [ gtu-inventory-auto-20260825-1843 ]
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify final GTU items
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          ids = [
            'bookofjoshua0000drsi','dermasoretischet0000paul','theasaurusoflang0003mena','hebraischesvokab0000stra',
            'dasalthebraische0000rund','anthologiahebrai0000hbro','historyofisraelt0003ewal','estudios-biblicos_1958_17',
            'estudios-biblicos_1960_19','journal-of-jewish-studies_1959_10_3-4','eleventhseasonof0000unse',
            'shulanarukh0002vari','shulanarukh0005vari_a9a6','shulanarukh0008vari',
            'sim_journal-of-cuneiform-studies_1947_1_1','sim_journal-of-cuneiform-studies_1959_13_2',
            'sim_journal-of-biblical-literature_1939-03_58_1',
            'sim_bulletin-of-the-american-schools-of-oriental-research_1922-05_6',
            'sim_bulletin-of-the-american-schools-of-oriental-research_1923-10_11','yesodehadaatveak04frie'
          ]
          out=[]
          for ident in ids:
            with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=30) as r:
              m=json.load(r)
            md=m.get('metadata',{})
            coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            files=m.get('files',[])
            pdfs=[]
            for f in files:
              n=f.get('name','')
              if n.lower().endswith('.pdf') and str(f.get('private','false')).lower()!='true' and 'encrypted' not in n.lower() and not n.lower().endswith('.lcpdf'):
                pdfs.append(f)
            pdf=pdfs[0]['name'] if pdfs else ''
            out.append({
              'identifier':ident,'in_gtu':'graduatetheologicalunion' in coll,'collection':coll,
              'title':md.get('title',''),'creator':md.get('creator',''),'date':md.get('date',''),'year':md.get('year',''),
              'volume':md.get('volume',''),'edition':md.get('edition',''),'series':md.get('series',''),
              'language':md.get('language',''),'subject':md.get('subject',''),'contributor':md.get('contributor',''),
              'mediatype':md.get('mediatype',''),'public_pdf':pdf,'pages':md.get('pages',''),
              'access_restricted':md.get('access-restricted-item',''),'printdisabled':md.get('printdisabled','')
            })
          with open('gtu_verified_final.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print('VERIFIED',sum(1 for x in out if x['in_gtu']),'OF',len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-final
          path: gtu_verified_final.json
