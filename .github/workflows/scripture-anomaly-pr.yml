name: Scripture anomaly PR
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import html,re,urllib.parse,urllib.request
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1)'}
          global_seen={}; rows=[]
          for i in range(1,5):
            page=f'https://biblicalstudies.org.uk/articles_scripture-{i:02d}.php'
            req=urllib.request.Request(page,headers=UA)
            with urllib.request.urlopen(req,timeout=60) as r: raw=r.read(); final=r.geturl()
            soup=BeautifulSoup(raw,'html.parser')
            for a in soup.find_all('a',href=True):
              url=urllib.parse.urljoin(final,html.unescape(a['href'].strip()))
              p=urllib.parse.urlparse(url).path.lower()
              if '/pdf/scripture/' not in p or not p.endswith('.pdf'): continue
              node=a; context=''
              for _ in range(7):
                if node is None: break
                text=re.sub(r'\s+',' ',html.unescape(node.get_text(' ',strip=True))).strip()
                if re.search(r'\bScripture\s+\d+',text,re.I) and len(text)>20: context=text; break
                node=node.parent
              if url.lower() in global_seen:
                print('DUPLICATE',url,'FIRST_PAGE',global_seen[url.lower()],'AGAIN_PAGE',i,'CTX',context[:500])
                continue
              global_seen[url.lower()]=i
              vols=[int(x) for x in re.findall(r'\bScripture\s+(\d+)',context,re.I)]
              v=vols[0] if vols else None
              if v is None or v>20:
                print('ANOMALY',url,'VOL_MATCHES',vols,'CTX',context[:1000])
              rows.append((i,url,v,context))
          counts={}
          for _,_,v,_ in rows: counts[v]=counts.get(v,0)+1
          print('UNIQUE_TOTAL',len(rows))
          print('RAW_COUNTS',dict(sorted(counts.items(),key=lambda kv:(kv[0] is None,kv[0] or 999))))
          PY
