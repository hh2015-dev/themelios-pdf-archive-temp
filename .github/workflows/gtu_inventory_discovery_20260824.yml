name: GTU inventory verify 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact GTU items from Archive metadata
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            synopticharmonyo0000jame
            biblical-archaeology-review_1990-1992_index
            coordinatingpart0056revj
            archaeologybible0000john
            catalogueofsamar0000edwa
            mythologyamonghe0000igna
            wordpicturesinne0005arch
            gospelofmark0000john_d5w5
            studiesonluthers0036eric
            structureoflukea0000aqmo
            journalofbiblica0103dani
            bookofrevelation0000revj
            notesongenesisfo0000albe
            israelsconceptof0000renc_o2u1
            jamesbrotherofje0000eise_u9s8
            priscillaauthoro0000ruth
            expositionepistl0000unse
            biblestudentteac0008unse
            biblestudentteac0011unse
            hebrewgermanprep0000drth
            origen0000jean_e5i1
            livesofjohnwicli0000gilp
            styleoflettersof0000john
            pagandivinitiest0000sist
            johncalvinselect0000calv
            historyoflifewor0000audi
            theologyofgreekp0000wern
            akkadiansyllabar0000vari
            jeremiah0000rich
            servantsongsinde00unse
          )
          : > verified.tsv
          for id in "${ids[@]}"; do
            curl -fsSL --retry 3 "https://archive.org/metadata/$id" -o m.json
            jq -r --arg id "$id" '
              . as $root |
              ($root.metadata.collection // []) as $coll |
              ($root.files // []) as $files |
              ($files | map(select((.name|test("\\.pdf$";"i")) and ((.private//"false") != "true") and ((.name|test("encrypted|lcpdf";"i"))|not))) | .[0].name // "") as $pdf |
              [
                $id,
                ($root.metadata.title // ""),
                (($root.metadata.creator // "")|if type=="array" then join("; ") else . end),
                (($root.metadata.date // $root.metadata.year // "")|tostring),
                (($root.metadata.language // "")|if type=="array" then join("; ") else . end),
                (($root.metadata.volume // "")|tostring),
                (($root.metadata.edition // "")|tostring),
                (($root.metadata.series // "")|if type=="array" then join("; ") else tostring end),
                (($root.metadata.contributor // "")|if type=="array" then join("; ") else tostring end),
                (($root.metadata.mediatype // "")|tostring),
                (($root.metadata["access-restricted-item"] // $root.metadata.printdisabled // "")|tostring),
                (($root.metadata.imagecount // $root.metadata.pages // "")|tostring),
                (($coll|if type=="array" then join(";") else tostring end)),
                $pdf
              ] | @tsv' m.json >> verified.tsv
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-20260824
          path: verified.tsv
          compression-level: 6
