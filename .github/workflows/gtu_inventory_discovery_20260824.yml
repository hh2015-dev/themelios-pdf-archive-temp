name: GTU inventory discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection broadly
        shell: bash
        run: |
          set -euo pipefail
          : > candidates.tsv
          queries=(
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(hebrew OR aramaic OR syriac OR semitic OR ugaritic OR akkadian))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(septuagint OR lxx OR greek OR papyri OR manuscript OR codex))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(targum OR talmud OR mishnah OR midrash OR qumran OR "dead sea" OR judaica))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(genesis OR exodus OR leviticus OR numbers OR deuteronomy OR job OR psalms OR isaiah OR jeremiah OR ezekiel OR daniel))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(matthew OR mark OR luke OR john OR acts OR romans OR corinthians OR hebrews OR revelation))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(commentary OR concordance OR lexicon OR grammar OR bibliography OR archaeology))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(patristic OR origen OR jerome OR augustine OR chrysostom OR irenaeus OR tertullian OR eusebius))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(calvin OR luther OR reformation OR theology OR creed OR confession OR missions OR missionary))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:("Journal of Biblical Literature" OR "Biblical Archaeologist" OR "Bible Translator" OR "Semitic Studies" OR "Palestine"))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (subject:(Bible OR Biblical OR Hebrew OR Greek OR Syriac OR Semitic OR Judaism OR archaeology OR theology))'
          )
          for q in "${queries[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            for page in 1 2 4 7; do
              url="https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier,title,creator,year,date,language,volume,edition,collection&rows=75&page=$page&output=json"
              curl -fsSL --retry 3 "$url" -o result.json
              jq -r '.response.docs[] | [(.identifier//""),(.title//""),((.creator//"")|if type=="array" then join("; ") else . end),((.year//.date//"")|tostring),((.language//"")|if type=="array" then join("; ") else . end),((.volume//"")|tostring),((.edition//"")|tostring)] | @tsv' result.json >> candidates.tsv
            done
          done
          awk '!seen[$1]++' candidates.tsv > candidates_unique.tsv
          echo "UNIQUE=$(wc -l < candidates_unique.tsv)"
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates-20260824
          path: candidates_unique.tsv
          compression-level: 6
