name: GTU Inventory Discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fast GTU-only candidate mining
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          queries=(
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Septuagint OR LXX OR Hexapla OR Aquila OR Symmachus OR Theodotion))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Peshitta OR Syriac OR Aramaic OR Targum OR Chaldee))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Hebrew OR Masoretic OR Samaritan OR Ugaritic OR Phoenician))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Qumran OR Essene OR Pseudepigrapha OR Apocrypha))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(papyrus OR papyri OR palaeography OR manuscript OR codex))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Akkadian OR Assyrian OR Babylonian OR Sumerian OR cuneiform))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Genesis OR Exodus OR Leviticus OR Numbers OR Deuteronomy OR Isaiah OR Jeremiah OR Ezekiel OR Psalms OR Job))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Matthew OR Mark OR Luke OR John OR Romans OR Corinthians OR Galatians OR Hebrews OR Revelation))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(grammar OR lexicon OR concordance OR syntax) AND (Hebrew OR Greek OR Syriac OR Aramaic))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Irenaeus OR Origen OR Chrysostom OR Augustine OR Jerome OR Ephraem OR Theodore))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(Calvin OR Luther OR Reformation) AND (commentary OR commentaries OR exposition OR exegesis))'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(archaeology OR archaeological OR Palestine OR Israel OR Jordan OR Jerusalem))'
          )
          : > work/candidates.tsv
          for q in "${queries[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            curl -fsSL "https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=year&fl[]=date&fl[]=language&fl[]=volume&fl[]=description&rows=80&page=1&output=json" -o work/search.json
            jq -r '.response.docs[] | [(.identifier//""),(.title//""),((.creator//"")|if type=="array" then join("; ") else . end),((.year//.date//"")|tostring),((.volume//"")|tostring),((.language//"")|if type=="array" then join("; ") else . end)] | @tsv' work/search.json >> work/candidates.tsv
          done
          sort -u -k1,1 work/candidates.tsv -o work/candidates.tsv
          echo "UNIQUE_CANDIDATES=$(wc -l < work/candidates.tsv)"
          head -n 180 work/candidates.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-fast-candidates-20260824
          path: work/candidates.tsv
