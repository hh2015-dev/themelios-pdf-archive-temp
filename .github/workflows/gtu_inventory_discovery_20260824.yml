name: GTU Inventory Discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected GTU candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          ids=(
            gtu_32400006616068
            bookofezekieltwe0000dcvi
            gtu_A32400006259224B
            karaitehalakahit0000bern
            studiesinhebrewh0000judi
            bookofjeremiah0000unse_c1v9
            deuteronomy0004unse
            diesundedersohne0000clos
            firstepistleofpa0000char_y6b8
            genesisoctapla0000luth
            parallelisminisa0001will
            gtu_A32400005362383B
            gtu_A32400003995093B_3
            gtu_32400005861996
            studyonimmanuels0000johl
            gtu_A32400001856784B
            ideasofmediation0000lhbr
            elementaryhebrew0000eles
            apocrypha0004eric
            geographicoflexi0000draf
            gospelaccordingt0000john_p8j7
            gospelaccordingt0000step
            sim_journal-of-cuneiform-studies_1951_3
            sim_journal-of-cuneiform-studies_1948_2_3
            palestine-exploration-quarterly_1915
            bulletin-british-school-of-archaeology-in-jerusalem_1923_3
          )
          : > work/verified.tsv
          for id in "${ids[@]}"; do
            curl -fsSL "https://archive.org/metadata/$id" -o work/meta.json || continue
            ingtu=$(jq -r '(.metadata.collection // []) | if type=="array" then any(. == "graduatetheologicalunion") else . == "graduatetheologicalunion" end' work/meta.json)
            [ "$ingtu" = "true" ] || continue
            title=$(jq -r '.metadata.title // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            creator=$(jq -r '.metadata.creator // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            year=$(jq -r '.metadata.year // .metadata.date // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            volume=$(jq -r '.metadata.volume // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            edition=$(jq -r '.metadata.edition // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            series=$(jq -r '.metadata.series // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            lang=$(jq -r '.metadata.language // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            contributor=$(jq -r '.metadata.contributor // .metadata.scanningcenter // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            pages=$(jq -r '.metadata.pages // "" | if type=="array" then join("; ") else . end' work/meta.json | tr '\t\n' '  ')
            restricted=$(jq -r '.metadata["access-restricted-item"] // .metadata.printdisabled // ""' work/meta.json)
            pdf=$(jq -r '.files[]? | select(.name|test("\\.pdf$";"i")) | select((.private // "false") != "true") | select((.name|test("(encrypted|lcpdf)";"i"))|not) | .name' work/meta.json | head -n1)
            direct=""
            if [[ "$restricted" != "true" && -n "$pdf" ]]; then
              encpdf=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$pdf")
              direct="https://archive.org/download/$id/$encpdf"
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$title" "$creator" "$year" "$volume" "$edition" "$series" "$lang" "$contributor" "$pages" "$restricted" "$direct" >> work/verified.tsv
          done
          echo "VERIFIED=$(wc -l < work/verified.tsv)"
          cat work/verified.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-20260824
          path: work/verified.tsv
