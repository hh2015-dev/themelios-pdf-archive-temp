name: BSUK Sunday at Home missing issue

on:
  pull_request:
    paths:
      - bsuk_worker/fetch_sunday_at_home_missing.py
      - .github/workflows/bsuk-sunday-at-home-missing.yml
  push:
    paths:
      - bsuk_worker/fetch_sunday_at_home_missing.py
      - .github/workflows/bsuk-sunday-at-home-missing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bsuk_worker/fetch_sunday_at_home_missing.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-sunday-at-home-missing
          path: sunday_at_home_missing/
          if-no-files-found: error
          retention-days: 1
