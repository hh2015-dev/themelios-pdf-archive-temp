name: GTU inventory auto 20260823 deep
on:
  pull_request:
    branches: [ main ]
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Deep GTU-only mining and PDF verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          specs=[
            ('biblical', 'collection:graduatetheologicalunion AND (title:bible OR title:testament OR title:gospel OR title:psalm OR title:prophet OR title:pentateuch)', [2,3]),
            ('languages', 'collection:graduatetheologicalunion AND (title:hebrew OR title:aramaic OR title:syriac OR title:semitic OR title:chaldee OR title:greek)', [2,3]),
            ('texts', 'collection:graduatetheologicalunion AND (title:septuagint OR title:papyri OR title:manuscript OR title:codex OR title:targum OR title:mishna)', [2,3]),
            ('ane', 'collection:graduatetheologicalunion AND (title:assyrian OR title:babylonian OR title:ugarit OR title:cuneiform OR title:palestine OR title:egypt)', [2,3]),
            ('exegesis', 'collection:graduatetheologicalunion AND (title:commentary OR title:commentaries OR title:exegesis OR title:criticism)', [2,3]),
            ('history', 'collection:graduatetheologicalunion AND (title:reformation OR title:patristic OR title:fathers OR title:theology OR title:mission)', [2,3]),
          ]
          seen={}; total=0
          for label,q,pages in specs:
            for page in pages:
              params={'q':q,'fl[]':['identifier','title','creator','date','year','language','volume'],'rows':100,'page':page,'output':'json','sort[]':'title asc'}
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True)
              try:
                with urllib.request.urlopen(url,timeout=30) as r: data=json.load(r)
              except Exception:
                continue
              docs=data['response']['docs']; total+=len(docs)
              for d in docs:
                ident=d.get('identifier','')
                if ident: seen.setdefault(ident,(label,d))
          out=[]; checked=0
          for ident,(label,d) in seen.items():
            try:
              with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=25) as r: m=json.load(r)
            except Exception: continue
            checked+=1; md=m.get('metadata',{})
            coll=md.get('collection',[]); coll=[coll] if isinstance(coll,str) else coll
            if 'graduatetheologicalunion' not in coll: continue
            if str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true': continue
            pdf=None
            for f in m.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith('.pdf') and not n.lower().endswith('_text.pdf') and 'encrypted' not in n.lower() and str(f.get('private','false')).lower()!='true':
                pdf=(n,f.get('size','')); break
            if not pdf: continue
            def flat(v): return '; '.join(map(str,v)) if isinstance(v,list) else ('' if v is None else str(v))
            out.append({'bucket':label,'identifier':ident,'title':flat(md.get('title',d.get('title',''))),'creator':flat(md.get('creator',d.get('creator',''))),'date':flat(md.get('date',md.get('year',d.get('date',d.get('year',''))))),'language':flat(md.get('language',d.get('language',''))),'volume':flat(md.get('volume',d.get('volume',''))),'pdf':pdf[0],'size':pdf[1],'subjects':flat(md.get('subject','')),'contributor':flat(md.get('contributor',''))})
            if len(out)>=220: break
          print('DEEP_SEARCH_ROWS',total,'UNIQUE',len(seen),'METADATA_CHECKED',checked,'ELIGIBLE',len(out))
          for x in out: print(json.dumps(x,ensure_ascii=False))
          PY
