name: BSUK WHS corpus fetch

on:
  pull_request:
    paths:
      - 'bsuk_worker/whs_fetch_all.py'
      - '.github/workflows/bsuk-whs-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Fetch and validate all 453 WHS PDFs
        run: python bsuk_worker/whs_fetch_all.py
      - name: Upload corpus part A
        uses: actions/upload-artifact@v4
        with:
          name: whs-corpus-a
          path: whs_part_a/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Upload corpus part B
        uses: actions/upload-artifact@v4
        with:
          name: whs-corpus-b
          path: whs_part_b/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
