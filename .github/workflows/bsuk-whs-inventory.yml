name: BSUK WHS discovery

on:
  push:
    paths:
      - 'bsuk_worker/whs_inventory.py'
      - '.github/workflows/bsuk-whs-inventory.yml'
  pull_request:
    paths:
      - 'bsuk_worker/whs_inventory.py'
      - '.github/workflows/bsuk-whs-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Discover and validate WHS corpus
        run: python bsuk_worker/whs_inventory.py
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: whs-inventory
          path: whs_inventory/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
