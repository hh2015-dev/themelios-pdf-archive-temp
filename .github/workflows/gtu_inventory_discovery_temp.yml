# temporary GTU-only search-only broad sample
name: GTU Inventory Discovery Temp
on:
  pull_request:
    branches: [main]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search GTU PDF items broadly
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import requests, json
          from concurrent.futures import ThreadPoolExecutor
          base='https://archive.org/advancedsearch.php'
          q='collection:graduatetheologicalunion AND mediatype:texts AND format:PDF'
          pages=(1,10,20,30,40,50,75,100,125,150)
          fields=['identifier','title','creator','date','year','language','subject','volume','edition','series','contributor']
          def one(page):
            p={'q':q,'fl[]':fields,'rows':20,'page':page,'output':'json'}
            return requests.get(base,params=p,timeout=25).json()['response']['docs']
          docs={}; examined=0
          with ThreadPoolExecutor(max_workers=10) as ex:
            for arr in ex.map(one,pages):
              examined += len(arr)
              for d in arr: docs.setdefault(d['identifier'],d)
          recs=[]
          for d in docs.values():
            d=dict(d)
            d['item_link']='https://archive.org/details/'+d['identifier']
            d['collection_query_verified']=True
            d['pdf_format_query_verified']=True
            recs.append(d)
          with open('gtu_candidates.json','w',encoding='utf-8') as f:
            json.dump({'search_results_examined':examined,'unique_candidates':len(recs),'records':recs},f,ensure_ascii=False,indent=2)
          print('examined',examined,'unique',len(recs))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-candidates
          path: gtu_candidates.json
          retention-days: 1
