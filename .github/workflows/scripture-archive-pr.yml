name: Scripture archive PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Discover download verify and rename Scripture corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, html, json, os, re, urllib.parse, urllib.request
          from bs4 import BeautifulSoup

          UA={'User-Agent':'Mozilla/5.0 (compatible; BSUK-Drive-Archiver/0.1)'}
          PAGES=[f'https://biblicalstudies.org.uk/articles_scripture-{i:02d}.php' for i in range(1,5)]
          EXPECTED={1:21,2:31,3:33,4:73,5:40,6:35,7:19,8:13,9:12,10:14,11:13,12:14,13:16,14:11,15:13,16:12,17:13,18:11,19:11,20:14}
          EXPECTED_TOTAL=sum(EXPECTED.values())
          os.makedirs('out',exist_ok=True)

          def norm(s):
              return re.sub(r'\s+',' ',html.unescape(s or '')).strip()

          links=[]; seen=set(); page_status=[]
          for page in PAGES:
              req=urllib.request.Request(page,headers=UA)
              with urllib.request.urlopen(req,timeout=90) as r:
                  raw=r.read(); final=r.geturl(); status=getattr(r,'status',200)
              soup=BeautifulSoup(raw,'html.parser')
              found=0
              for a in soup.find_all('a',href=True):
                  href=html.unescape(a.get('href','').strip())
                  url=urllib.parse.urljoin(final,href)
                  p=urllib.parse.urlparse(url).path.lower()
                  if '/pdf/scripture/' not in p or not p.endswith('.pdf'):
                      continue
                  key=url.lower()
                  if key in seen: continue
                  seen.add(key); found+=1
                  node=a
                  context=''
                  for _ in range(7):
                      if node is None: break
                      text=norm(node.get_text(' ',strip=True))
                      if re.search(r'\bScripture\s+\d+',text,re.I) and len(text)>20:
                          context=text; break
                      node=node.parent
                  if not context:
                      prev=a.find_previous(string=re.compile(r'Scripture\s+\d+',re.I))
                      context=norm(str(prev)) if prev else norm(a.get_text(' ',strip=True))
                  vm=re.search(r'\bScripture\s+(\d+)',context,re.I)
                  if not vm:
                      raise RuntimeError(f'Cannot determine volume for {url}: {context[:250]}')
                  vol=int(vm.group(1))
                  im=re.search(r'\bNo\.?\s*(\d+)',context,re.I)
                  if im:
                      issue=int(im.group(1))
                  else:
                      im=re.search(r'\bScripture\s+\d+\.(\d+)',context,re.I)
                      issue=int(im.group(1)) if im else None
                  links.append({'source_page':page,'url':url,'context':context,'volume':vol,'issue':issue,'basename':urllib.parse.unquote(os.path.basename(urllib.parse.urlparse(url).path))})
              page_status.append({'page':page,'status':status,'final_url':final,'pdf_links':found})

          if len(links)!=EXPECTED_TOTAL:
              raise SystemExit(f'Expected {EXPECTED_TOTAL} unique PDF links, discovered {len(links)}; pages={page_status}')
          counts={}
          for r in links: counts[r['volume']]=counts.get(r['volume'],0)+1
          if counts!=EXPECTED:
              raise SystemExit(f'Volume counts mismatch: {counts}')

          badchars='<>:"/\\|?*'
          def clean(s,maxlen=145):
              s=norm(s)
              s=''.join('-' if c in badchars else c for c in s)
              s=re.sub(r'\s+',' ',s).strip(' .-')
              if len(s)>maxlen: s=s[:maxlen-3].rstrip()+'...'
              return s or 'Untitled'

          def parse_identity(rec):
              c=rec['context']
              # Trim icon/pipe prefixes and the bibliographic tail beginning with Scripture volume.
              before=re.split(r'\bScripture\s+\d+',c,maxsplit=1,flags=re.I)[0].strip(' |,')
              before=re.sub(r'^(?:On-line Resource|Article in Journal or Book)\s*\|?\s*','',before,flags=re.I).strip()
              # Most entries: Author, "Title," ; special unsigned entries begin directly with a quoted title.
              m=re.match(r'^(.*?),\s*["“](.+?)["”],?\s*$',before)
              if m:
                  return clean(m.group(1),80), clean(m.group(2))
              m=re.match(r'^["“](.+?)["”],?\s*$',before)
              if m:
                  return '', clean(m.group(1))
              # Fallback: detect quoted title anywhere.
              qm=re.search(r'["“](.+?)["”]',before)
              if qm:
                  title=clean(qm.group(1)); author=clean(before[:qm.start()].strip(' ,'),80) if before[:qm.start()].strip(' ,') else ''
                  return author,title
              return '',clean(before)

          def final_name(rec):
              author,title=parse_identity(rec)
              v=rec['volume']; issue=rec['issue']
              parts=['Scripture',f'Volume {v:03d}']
              if issue is not None: parts.append(f'Issue {issue:03d}')
              low=title.lower()
              if low.startswith('book review') or low.startswith('book reviews'):
                  parts.append('Book Review')
                  if title.lower() not in ('book review','book reviews'): parts.append(title)
              elif low.startswith('editorial'):
                  parts.append('Editorial')
              elif 'bibliograph' in low and not author:
                  parts.append(title)
              else:
                  if author: parts.append(author)
                  parts.append(title)
              return ' - '.join(parts)+'.pdf'

          # Make names unique deterministically; add source basename only if citation naming collides.
          name_seen={}
          for r in links:
              n=final_name(r)
              k=(r['volume'],n.lower())
              if k in name_seen:
                  stem=n[:-4]
                  n=f'{stem} - {os.path.splitext(r["basename"])[0]}.pdf'
              name_seen[(r['volume'],n.lower())]=r['url']
              r['filename']=n

          def fetch(rec):
              d=os.path.join('out',f'Volume {rec["volume"]:03d}'); os.makedirs(d,exist_ok=True)
              dest=os.path.join(d,rec['filename'])
              req=urllib.request.Request(rec['url'],headers=UA)
              with urllib.request.urlopen(req,timeout=240) as r:
                  data=r.read(); ctype=r.headers.get('Content-Type',''); final=r.geturl(); status=getattr(r,'status',200)
              if data[:5]!=b'%PDF-': raise RuntimeError(f'Not PDF: {rec["url"]} status={status} ctype={ctype} head={data[:20]!r}')
              if len(data)<5000: raise RuntimeError(f'Implausibly small PDF: {rec["url"]} bytes={len(data)}')
              with open(dest,'wb') as f: f.write(data)
              return {**rec,'final_url':final,'http_status':status,'content_type':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}

          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              futs=[ex.submit(fetch,r) for r in links]
              for fut in concurrent.futures.as_completed(futs):
                  row=fut.result(); rows.append(row); print('OK',row['volume'],row['filename'],row['bytes'])
          rows.sort(key=lambda r:(r['volume'],r['issue'] if r['issue'] is not None else -1,r['filename']))
          verified={}
          for r in rows: verified[r['volume']]=verified.get(r['volume'],0)+1
          if len(rows)!=EXPECTED_TOTAL or verified!=EXPECTED:
              raise SystemExit(f'Verified corpus mismatch total={len(rows)} counts={verified}')
          # Raw-name guard.
          rawish=re.compile(r'^(?:\d{1,3}[_-]|[0-9_-]+\.pdf$)',re.I)
          offenders=[r['filename'] for r in rows if rawish.search(r['filename']) or not r['filename'].startswith('Scripture - Volume ')]
          if offenders: raise SystemExit(f'Naming audit failed: {offenders[:10]}')
          manifest={'journal':'Scripture','source_pages':page_status,'expected_total':EXPECTED_TOTAL,'volume_counts':EXPECTED,'verified_total':len(rows),'files':rows}
          with open('out/manifest.json','w',encoding='utf-8') as f: json.dump(manifest,f,ensure_ascii=False,indent=2)
          print('DISCOVERED',len(links)); print('VERIFIED',len(rows)); print('COUNTS',verified)
          PY
      - name: Upload per-volume artifacts
        shell: bash
        run: |
          set -euo pipefail
          for v in $(seq -w 1 20); do
            vv=$(printf '%03d' "$((10#$v))")
            echo "volume=$vv" >> "$GITHUB_OUTPUT"
          done
      - name: Upload Volume 001
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-001, path: 'out/Volume 001/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 002
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-002, path: 'out/Volume 002/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 003
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-003, path: 'out/Volume 003/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 004
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-004, path: 'out/Volume 004/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 005
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-005, path: 'out/Volume 005/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 006
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-006, path: 'out/Volume 006/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 007
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-007, path: 'out/Volume 007/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 008
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-008, path: 'out/Volume 008/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 009
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-009, path: 'out/Volume 009/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 010
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-010, path: 'out/Volume 010/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 011
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-011, path: 'out/Volume 011/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 012
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-012, path: 'out/Volume 012/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 013
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-013, path: 'out/Volume 013/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 014
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-014, path: 'out/Volume 014/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 015
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-015, path: 'out/Volume 015/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 016
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-016, path: 'out/Volume 016/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 017
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-017, path: 'out/Volume 017/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 018
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-018, path: 'out/Volume 018/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 019
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-019, path: 'out/Volume 019/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload Volume 020
        uses: actions/upload-artifact@v4
        with: {name: scripture-volume-020, path: 'out/Volume 020/', if-no-files-found: error, compression-level: 0, retention-days: 1}
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with: {name: scripture-manifest, path: out/manifest.json, if-no-files-found: error, retention-days: 1}
