name: GTU inventory 20260824 final verify
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify final GTU items
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,concurrent.futures
          ids='''elorigendelmundo0000luis
erasmusluther0000rdev
eschatologischep0000jhko
etudesurlecaract0000unse
externalgraceins0000harr
fastiecclesiaesc0003scot
fromjustiniantol0000pull
hatorahehahafaro0000unse
hillmonasticmanu0000juli
historiredelavie0002maud
holyscripturesac0000vari
howtostudyoldtes0000unse
humourironyinnew0000jako
illustratedbible0000cond
indexofsubjetind0000davi
influenceofgreek0000edwi
internationalsta0001unse_g5f9
interpretingnewt0000mumm
introducingoldte0000jnsc_y2f0
introductionalab0001unse'''.split()
          def one(id):
            try:
              m=json.load(urllib.request.urlopen('https://archive.org/metadata/'+id,timeout=25)); md=m.get('metadata',{})
              col=md.get('collection',[]); col=[col] if isinstance(col,str) else col
              if 'graduatetheologicalunion' not in col:return [id,'INVALID_COLLECTION']
              def s(k):
                v=md.get(k,''); return '; '.join(map(str,v)) if isinstance(v,list) else str(v or '')
              restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
              pdf=''
              if not restricted:
                fs=[f for f in m.get('files',[]) if f.get('name','').lower().endswith('.pdf') and f.get('private') not in (True,'true') and 'encrypted' not in f.get('name','').lower() and not f.get('name','').lower().endswith('.lcpdf')]
                if fs: pdf=fs[0].get('name','')
              pc=''
              for k in ('imagecount','pagecount','pages'):
                if md.get(k):pc=str(md[k]);break
              return [id,s('title'),s('creator'),s('date') or s('year'),s('volume'),s('edition'),s('series'),s('subject')[:500],s('contributor'),pdf,pc,'restricted' if restricted else 'public']
            except Exception as e:return [id,'ERROR:'+type(e).__name__]
          print('ID\tTITLE\tCREATOR\tYEAR\tVOLUME\tEDITION\tSERIES\tSUBJECT\tCONTRIBUTOR\tPDF\tPAGES\tACCESS')
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
            for r in ex.map(one,ids): print('\t'.join(x.replace('\t',' ').replace('\n',' ') for x in r))
          PY
