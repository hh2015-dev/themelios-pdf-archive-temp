name: GTU inventory 20260824 discovery
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: GTU-only advancedsearch
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, re
          base='https://archive.org/advancedsearch.php'
          qs=[
          'title:(bible OR biblical OR testament OR hebrew OR aramaic OR syriac OR greek OR septuagint OR commentary OR exegesis)',
          'title:(manuscript OR textual OR papyri OR codex OR masoretic OR targum OR talmud OR midrash)',
          'title:(assyrian OR babylonian OR akkadian OR ugaritic OR archaeology OR palestine OR semitic OR phoenician)',
          'title:(calvin OR luther OR augustine OR origen OR chrysostom OR jerome OR patristic OR reformation)',
          'title:(theology OR creed OR church OR mission OR christianity OR judaism OR early christian)',
          'title:(journal OR bulletin OR translator OR biblical)'
          ]
          ids={}; examined=0
          for qi,q0 in enumerate(qs):
            for page in (2,5,9,14,20):
              q='collection:graduatetheologicalunion AND mediatype:texts AND ('+q0+')'
              p={'q':q,'fl[]':['identifier','title','creator','year','volume','edition','series','subject','contributor'],'rows':70,'page':page,'output':'json','sort[]':'identifier asc' if (qi+page)%2 else 'identifier desc'}
              try:
                d=json.load(urllib.request.urlopen(base+'?'+urllib.parse.urlencode(p,doseq=True),timeout=20))['response']['docs']; examined+=len(d)
                for x in d: ids.setdefault(x['identifier'],x)
              except Exception as e: print('QUERY_ERROR',qi,page,type(e).__name__)
          A=re.compile(r'bibl|testament|hebrew|arama|syri|greek|septuag|textual|manuscript|codex|papy|talmud|midrash|assyri|babylon|akkad|ugarit|archaeol|palestine|comment|exeg|calvin|luther|augustin|origen|chrysostom|jerome|josephus|philo|targum|masoret|scroll|qumran|apocry|pseudep',re.I)
          out=sorted(ids.values(), key=lambda x:(-bool(A.search(' '.join(str(x.get(k,'')) for k in ('title','creator','subject')))), str(x.get('identifier',''))))
          def s(x,k):
            v=x.get(k,''); return '; '.join(map(str,v)) if isinstance(v,list) else str(v or '')
          print('EXAMINED',examined,'UNIQUE',len(ids))
          print('ID\tTITLE\tCREATOR\tYEAR\tVOLUME\tEDITION\tSERIES\tSUBJECT\tCONTRIBUTOR')
          for x in out[:250]:
            row=[s(x,k) for k in ('identifier','title','creator','year','volume','edition','series','subject','contributor')]
            print('\t'.join(v.replace('\t',' ').replace('\n',' ')[:500] for v in row))
          PY
