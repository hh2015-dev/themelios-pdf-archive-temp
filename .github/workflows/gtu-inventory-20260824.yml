name: GTU inventory discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection only
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import requests, json, re, time, unicodedata
          from urllib.parse import quote
          BASE='https://archive.org/advancedsearch.php'
          queries=[
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(hebrew OR aramaic OR syriac OR semitic OR targum OR talmud OR mishnah OR ugaritic))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(septuagint OR greek OR papyri OR papyrus OR manuscript OR codex OR textual OR criticism))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(old testament OR hebrew bible OR pentateuch OR genesis OR exodus OR leviticus OR numbers OR deuteronomy OR joshua OR judges OR samuel OR kings OR isaiah OR jeremiah OR ezekiel OR job OR psalms OR proverbs))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(new testament OR gospel OR matthew OR mark OR luke OR john OR acts OR romans OR corinthians OR galatians OR ephesians OR hebrews OR revelation))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(apocrypha OR pseudepigrapha OR qumran OR dead sea OR josephus OR philo OR jewish OR judaism))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(assyrian OR babylonian OR akkadian OR cuneiform OR archaeology OR palestine OR canaan OR egyptian OR ancient near east))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(calvin OR luther OR chrysostom OR augustine OR origen OR jerome OR patristic OR commentary OR exegesis))',
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:(concordance OR lexicon OR grammar OR dictionary OR bibliography OR journal OR bulletin OR review))'
          ]
          docs={}
          examined=0
          sess=requests.Session()
          for qi,q in enumerate(queries):
            for page in (1,3,6,10):
              params=[('q',q),('rows','100'),('page',str(page)),('output','json'),('sort[]','identifier asc')]
              for f in ['identifier','title','creator','year','date','volume','language','subject','format']:
                params.append(('fl[]',f))
              r=sess.get(BASE,params=params,timeout=45); r.raise_for_status()
              js=r.json(); arr=js.get('response',{}).get('docs',[]); examined+=len(arr)
              for d in arr:
                if d.get('identifier'): docs[d['identifier']]=d
              time.sleep(.08)
          def txt(x):
            if isinstance(x,list): return '; '.join(map(str,x))
            return '' if x is None else str(x)
          A_terms=['bible','biblical','old testament','new testament','hebrew','aramaic','syriac','semitic','septuagint','lxx','greek','targum','talmud','mishnah','qumran','dead sea','pseudepigrapha','apocrypha','josephus','philo','textual','manuscript','codex','papyr','cuneiform','assyri','babyloni','akkadian','archaeolog','palestine','canaan','pentateuch','genesis','exodus','leviticus','deuteronomy','isaiah','jeremiah','ezekiel','job','psalm','proverb','gospel','matthew','mark','luke','john','acts','romans','corinth','galatian','ephesians','hebrews','revelation','commentary','exegesis','concordance','lexicon','grammar']
          B_terms=['theology','church','christian','patrist','reformation','calvin','luther','augustine','origen','chrysostom','jerome','mission','creed','doctrine','apolog','judaism','religion']
          cand=[]
          for ident,d in docs.items():
            s=(txt(d.get('title'))+' '+txt(d.get('subject'))+' '+txt(d.get('creator'))).lower()
            score=sum(5 for t in A_terms if t in s)+sum(2 for t in B_terms if t in s)
            if score<5: continue
            cand.append((score,ident,d))
          cand.sort(key=lambda x:(-x[0],x[1]))
          out=[]
          for score,ident,d in cand[:320]:
            try:
              m=sess.get('https://archive.org/metadata/'+quote(ident),timeout=45).json()
            except Exception: continue
            md=m.get('metadata',{}) or {}
            coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if 'graduatetheologicalunion' not in coll: continue
            files=m.get('files',[]) or []
            pdfs=[]
            for f in files:
              n=f.get('name','')
              if not n.lower().endswith('.pdf'): continue
              if f.get('private') in (True,'true','1'): continue
              if n.lower().endswith('.lcpdf') or 'encrypted' in n.lower(): continue
              pdfs.append(f)
            restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
            public_pdf=None
            if not restricted and pdfs:
              # favor original/non-derived-like PDFs with size
              pdfs.sort(key=lambda f:(0 if f.get('source')=='original' else 1, -(int(f.get('size',0) or 0))))
              public_pdf=pdfs[0].get('name')
            title=txt(md.get('title') or d.get('title')).strip()
            creator=txt(md.get('creator') or d.get('creator')).strip()
            year=txt(md.get('year') or md.get('date') or d.get('year') or d.get('date')).strip()
            volume=txt(md.get('volume') or d.get('volume')).strip()
            edition=txt(md.get('edition')).strip()
            series=txt(md.get('series')).strip()
            lang=txt(md.get('language') or d.get('language')).strip()
            subject=txt(md.get('subject') or d.get('subject')).strip()
            contributor=txt(md.get('contributor')).strip()
            pages=''
            for key in ('page-progression','pages'):
              pass
            if md.get('description'):
              mm=re.search(r'([0-9]{1,4})\s+p(?:ages|\.)',txt(md.get('description')),re.I)
              if mm: pages=mm.group(1)
            # direct PDF link only if public
            direct='https://archive.org/download/%s/%s'%(ident,quote(public_pdf,safe='')) if public_pdf else ''
            out.append({
              'score':score,'identifier':ident,'title':title,'creator':creator,'year':year,'volume':volume,'edition':edition,'series':series,'language':lang,'subject':subject,'contributor':contributor,'direct_pdf':direct,'restricted':restricted,'pages':pages,
              'item_link':'https://archive.org/details/'+ident
            })
            if len(out)>=160: break
          print('EXAMINED',examined,'UNIQUE',len(docs),'VERIFIED',len(out))
          with open('gtu_candidates.json','w',encoding='utf-8') as f: json.dump({'examined':examined,'unique':len(docs),'records':out},f,ensure_ascii=False,indent=2)
          # compact TSV for logs
          for x in out[:120]:
            print('\t'.join(str(x.get(k,'' )).replace('\t',' ').replace('\n',' ') for k in ['score','identifier','creator','title','year','volume','edition','language','restricted','direct_pdf']))
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates
          path: gtu_candidates.json
          compression-level: 0
