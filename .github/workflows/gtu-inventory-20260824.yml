name: GTU inventory 20260824 fast
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU only fast
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import json, urllib.parse, urllib.request, re, concurrent.futures
          base='https://archive.org/advancedsearch.php'
          qs=[
          'title:(bible OR biblical OR testament OR hebrew OR aramaic OR syriac OR greek OR septuagint OR commentary OR exegesis)',
          'title:(manuscript OR textual OR papyri OR codex OR masoretic OR targum OR talmud OR midrash)',
          'title:(assyrian OR babylonian OR akkadian OR ugaritic OR archaeology OR palestine OR semitic OR phoenician)',
          'title:(calvin OR luther OR augustine OR origen OR chrysostom OR jerome OR patristic OR reformation)',
          'title:(theology OR creed OR church OR mission OR christianity OR judaism OR early christian)',
          'title:(journal OR bulletin OR translator OR biblical)'
          ]
          ids={}; examined=0
          for qi,q0 in enumerate(qs):
            for page in (3,7,13):
              q='collection:graduatetheologicalunion AND mediatype:texts AND ('+q0+')'
              p={'q':q,'fl[]':['identifier','title','creator','year','volume','edition','series','subject'],'rows':80,'page':page,'output':'json','sort[]':'identifier asc' if (qi+page)%2 else 'identifier desc'}
              try:
                d=json.load(urllib.request.urlopen(base+'?'+urllib.parse.urlencode(p,doseq=True),timeout=20))['response']['docs']; examined+=len(d)
                for x in d: ids.setdefault(x['identifier'],x)
              except Exception: pass
          A=re.compile(r'bibl|testament|hebrew|arama|syri|greek|septuag|textual|manuscript|codex|papy|talmud|midrash|assyri|babylon|akkad|ugarit|archaeol|palestine|comment|exeg|calvin|luther|augustin|origen|chrysostom|jerome|josephus|philo|targum|masoret',re.I)
          pool=sorted(ids.items(), key=lambda kv:(-bool(A.search(' '.join(str(kv[1].get(k,'')) for k in ('title','creator','subject')))),kv[0]))[:360]
          def verify(t):
            id,x=t
            try:
              m=json.load(urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(id),timeout=20)); md=m.get('metadata',{})
              col=md.get('collection',[]); col=[col] if isinstance(col,str) else col
              if 'graduatetheologicalunion' not in col:return None
              restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
              fs=[f for f in m.get('files',[]) if f.get('name','').lower().endswith('.pdf') and f.get('private') not in (True,'true') and 'encrypted' not in f.get('name','').lower() and not f.get('name','').lower().endswith('.lcpdf')]
              pdf=fs[0].get('name','') if fs and not restricted else ''
              pc='';
              for k in ('imagecount','pagecount','pages'):
                if md.get(k): pc=str(md[k]); break
              def s(k):
                v=md.get(k,x.get(k,'')); return '; '.join(map(str,v)) if isinstance(v,list) else str(v or '')
              return [id,s('title'),s('creator'),s('year'),s('volume'),s('edition'),s('series'),s('subject')[:350],pdf,pc,'restricted' if restricted else 'public']
            except Exception:return None
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            for r in ex.map(verify,pool):
              if r:out.append(r)
          print('EXAMINED',examined,'UNIQUE',len(ids),'METADATA_CHECKED',len(pool),'VERIFIED',len(out))
          print('ID\tTITLE\tCREATOR\tYEAR\tVOLUME\tEDITION\tSERIES\tSUBJECT\tPDF\tPAGES\tACCESS')
          for r in out[:100]: print('\t'.join(v.replace('\t',' ').replace('\n',' ') for v in r))
          PY
          python /tmp/mine.py
