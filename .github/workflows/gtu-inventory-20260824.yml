name: GTU inventory discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU corpus broadly
        shell: bash
        run: |
          set -euo pipefail
          : > candidates.jsonl
          queries=(
            'collection:graduatetheologicalunion AND mediatype:texts AND (Masoretic OR masorah OR targum OR targumim)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Septuagint OR LXX OR hexapla)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Syriac OR Syriac manuscripts OR Peshitta)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Coptic OR Sahidic OR Bohairic)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Aramaic OR Hebrew grammar OR Semitic)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Akkadian OR Assyrian OR Babylonian OR Ugaritic)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Qumran OR Dead Sea Scrolls OR pseudepigrapha OR apocrypha)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Philo OR Josephus OR rabbinic OR Mishnah OR Talmud)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (textual criticism OR manuscript OR papyri)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (New Testament Greek OR Greek grammar OR Greek lexicon)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (biblical archaeology OR Palestine archaeology OR ancient near east)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Origen OR Chrysostom OR Jerome OR Augustine OR Ephrem OR patristic)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Luther OR Calvin OR Reformation) AND (commentary OR exegesis OR Bible)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (concordance OR bibliography OR lexicon OR grammar) AND Bible'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Isaiah OR Jeremiah OR Ezekiel OR Daniel OR Job OR Psalms OR Proverbs) AND (commentary OR criticism)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (Matthew OR Mark OR Luke OR John OR Romans OR Hebrews OR Revelation) AND (commentary OR criticism)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (biblical theology OR history of interpretation OR hermeneutics)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (creed OR doctrine OR systematic theology OR church history OR missions)'
          )
          for q in "${queries[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            for page in 1 2 4 7; do
              url="https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier,title,creator,year,date,language,subject,volume,edition,series,contributor&rows=50&page=$page&output=json"
              curl -fsSL --retry 3 "$url" -o search.json || continue
              jq -c '.response.docs[]' search.json >> candidates.jsonl
            done
          done
          echo "TOTAL_LINES=$(wc -l < candidates.jsonl)"
          echo "UNIQUE_IDS=$(jq -r .identifier candidates.jsonl | sort -u | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates-20260824
          path: candidates.jsonl
          compression-level: 6
