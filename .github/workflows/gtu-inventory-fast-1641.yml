name: GTU Inventory Fast Miner 1641

on:
  pull_request:
    branches: [main]

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gtu-inventory-hourly-1641
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query exact GTU collection and verify selected PDFs
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, concurrent.futures
          BASE='https://archive.org'
          terms=['genesis','exodus','deuteronomy','psalms','isaiah','jeremiah','prophets','romans','corinthians','paul','gospel','josephus','philo','rabbinic','semite','assyrian','babylonian','archaeology','church fathers','calvin']
          def getj(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GTU-inventory-research/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          found={}
          for term in terms:
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND (title:"{term}" OR subject:"{term}")'
              params={'q':q,'fl[]':['identifier','title','creator','date','year','language','subject','volume','description','contributor'],'rows':25,'page':1,'output':'json'}
              try: docs=getj(BASE+'/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True))['response']['docs']
              except Exception: docs=[]
              for d in docs:
                  if d.get('identifier'): found[d['identifier']]=d
          keysA=['genesis','exodus','deuteronomy','psalm','isaiah','jeremiah','prophet','romans','corinth','paul','gospel','josephus','philo','rabbin','semit','assyri','babylon','archaeolog','hebrew','greek','bible','biblical','testament','exeg','commentary','textual']
          keysB=['father','patrist','calvin','reformation','theology','church']
          ranked=[]
          for d in found.values():
              blob=' '.join(str(d.get(k,'')) for k in ['title','subject','description']).lower()
              score=20*sum(k in blob for k in keysA)+7*sum(k in blob for k in keysB)
              ranked.append((score,d))
          ranked.sort(key=lambda x:(-x[0],str(x[1].get('title',''))))
          ranked=ranked[:70]
          def verify(sd):
              score,d=sd;i=d['identifier']
              try:m=getj(BASE+'/metadata/'+urllib.parse.quote(i))
              except Exception:return None
              md=m.get('metadata',{}); coll=md.get('collection',[])
              if isinstance(coll,str):coll=[coll]
              if 'graduatetheologicalunion' not in coll:return None
              pdfs=[f for f in m.get('files',[]) if f.get('name','').lower().endswith('.pdf') and f.get('size')]
              if not pdfs:return None
              pdfs.sort(key=lambda f:(0 if f.get('source')=='original' else 1, len(f.get('name',''))));p=pdfs[0]
              return {'identifier':i,'title':md.get('title') or d.get('title'),'creator':md.get('creator') or d.get('creator'),'date':md.get('date') or d.get('date') or d.get('year'),'year':d.get('year'),'language':md.get('language') or d.get('language'),'subject':md.get('subject') or d.get('subject'),'volume':md.get('volume') or d.get('volume'),'description':md.get('description') or d.get('description'),'contributor':md.get('contributor') or d.get('contributor'),'edition':md.get('edition'),'series':md.get('series'),'collection':coll,'pdf_name':p.get('name'),'score':score,'item_url':BASE+'/details/'+i,'pdf_url':BASE+'/download/'+i+'/'+urllib.parse.quote(p.get('name'))}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              out=[x for x in ex.map(verify,ranked) if x]
          out.sort(key=lambda x:(-x['score'],str(x.get('title',''))))
          with open('gtu_fast_candidates_1641.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print('examined advanced-search candidates',len(found),'verified detailed candidates',len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-fast-candidates-1641
          path: gtu_fast_candidates_1641.json
          retention-days: 1
