name: EQ direct fetch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download direct from BiblicalStudies
        run: |
          set -e
          mkdir -p out
          cat eq_urls.txt | xargs -P4 -I{} sh -c 'u="$1"; f="out/$(basename "$u")"; curl -L --fail --retry 3 --retry-delay 2 "$u" -o "$f"; test "$(head -c 5 "$f")" = "%PDF-"' _ {}
          test "$(find out -type f -name "*.pdf" | wc -l)" -eq "$(grep -c "^http" eq_urls.txt)"
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: eq-direct-pdfs
          path: out/*.pdf
          if-no-files-found: error
          retention-days: 1
