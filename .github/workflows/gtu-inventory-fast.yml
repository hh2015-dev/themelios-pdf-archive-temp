name: GTU inventory fast temporary
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast verified GTU candidate pass
        run: python3 gtu_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-fast-candidates
          path: gtu_fast.json
