name: BSUK Bible Student Internet Archive discovery

on:
  pull_request:
    paths:
      - bible-student-ia-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bsuk_worker/bible_student_ia_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-bible-student-ia-discovery
          path: bible_student_ia_discovery/
          if-no-files-found: error
          retention-days: 1
