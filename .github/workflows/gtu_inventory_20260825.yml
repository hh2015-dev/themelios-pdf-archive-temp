name: GTU Inventory Discovery 20260825 SearchOnly
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine broad GTU corpus windows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          from collections import OrderedDict
          BASE='collection:graduatetheologicalunion AND mediatype:texts'
          specs=[(3,'identifier asc'),(23,'identifier asc'),(43,'identifier asc'),(63,'identifier asc'),(83,'identifier asc'),(7,'date asc'),(27,'date asc'),(47,'date desc'),(67,'date desc'),(87,'date desc')]
          ids=OrderedDict(); hits=0
          for p,sort in specs:
            params={'q':BASE,'fl[]':['identifier','title','creator','date','year','subject','language','volume','edition','series','contributor'],'rows':100,'page':p,'output':'json','sort[]':sort}
            url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GTUInventory/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
            except Exception:
              continue
            docs=data.get('response',{}).get('docs',[]); hits+=len(docs)
            for d in docs:
              ident=d.get('identifier')
              if ident: ids.setdefault(ident,d)
          recs=[]
          for ident,d in ids.items():
            x=dict(d); x['identifier']=ident; x['item_link']='https://archive.org/details/'+urllib.parse.quote(ident,safe=''); recs.append(x)
          obj={'search_hits_examined':hits,'unique_ids_mined':len(ids),'records':recs}
          json.dump(obj,open('gtu_search_candidates.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps({'search_hits_examined':hits,'unique_ids_mined':len(ids)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-search-candidates-20260825
          path: gtu_search_candidates.json
          compression-level: 6
