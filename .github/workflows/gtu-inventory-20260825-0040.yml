name: GTU inventory fast candidate export
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Export deep GTU-only candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          base='collection:graduatetheologicalunion AND mediatype:texts'
          pages=[4,9,14,19,24,29]
          out=[]
          for p in pages:
            q={'q':base,'fl[]':['identifier','title','creator','date','year','volume','edition','series','language','subject','contributor'],'rows':250,'page':p,'output':'json','sort[]':'identifier asc'}
            u='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(q,doseq=True)
            req=urllib.request.Request(u,headers={'User-Agent':'GTU inventory bot'})
            with urllib.request.urlopen(req,timeout=30) as r:d=json.load(r)
            out.extend(d.get('response',{}).get('docs',[]))
          seen=set()
          with open('gtu-candidates.jsonl','w',encoding='utf-8') as f:
            for x in out:
              i=x.get('identifier')
              if not i or i in seen:continue
              seen.add(i);f.write(json.dumps(x,ensure_ascii=False)+'\n')
          print('FAST_EXAMINED',len(out));print('FAST_UNIQUE',len(seen))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates
          path: gtu-candidates.jsonl
