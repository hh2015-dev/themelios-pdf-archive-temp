name: GTU inventory discovery 20260825-0040
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine and verify GTU-only candidates
        shell: bash
        run: |
          cat > /tmp/discover.py <<'PY'
          import json, urllib.parse, urllib.request, re, time
          from collections import OrderedDict

          BASE='collection:graduatetheologicalunion AND mediatype:texts'
          queries=[
            '(title:(hebrew OR aramaic OR syriac OR semitic) OR subject:(hebrew OR aramaic OR syriac OR semitic))',
            '(title:(septuagint OR lxx OR hexapla OR greek testament OR papyri OR manuscript) OR subject:(septuagint OR textual criticism OR manuscripts))',
            '(title:(isaiah OR jeremiah OR ezekiel OR psalms OR job OR genesis OR exodus OR deuteronomy OR prophets) OR subject:(old testament OR hebrew bible))',
            '(title:(matthew OR mark OR luke OR john OR romans OR corinthians OR hebrews OR revelation) OR subject:(new testament OR biblical greek))',
            '(title:(qumran OR dead sea OR apocrypha OR pseudepigrapha OR josephus OR philo OR talmud OR midrash) OR subject:(judaism OR rabbinic OR second temple))',
            '(title:(assyrian OR babylonian OR akkadian OR ugaritic OR canaanite OR palestine OR archaeology) OR subject:(archaeology OR ancient near east))',
            '(title:(calvin OR luther OR origen OR jerome OR augustine OR chrysostom OR irenaeus) OR subject:(patristic OR reformation OR history of interpretation))',
            '(title:(concordance OR lexicon OR grammar OR bibliography OR commentary) OR subject:(biblical studies OR theology))',
            '(title:(journal OR quarterly OR review OR translator OR semitic studies) AND (subject:(Bible) OR title:(biblical OR bible OR semitic)))',
            '(subject:(church history OR missions OR theology OR early christianity OR apologetics OR creeds))'
          ]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GTU inventory'})
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          docs=OrderedDict(); examined=0
          # vary pages to avoid only top hits
          for qi,q in enumerate(queries):
            for page in (1,3,7):
              full=f'{BASE} AND {q}'
              params={'q':full,'fl[]':['identifier','title','creator','date','year','language','subject'],'rows':60,'page':page,'output':'json','sort[]':'identifier asc'}
              enc=urllib.parse.urlencode(params,doseq=True)
              try: data=get('https://archive.org/advancedsearch.php?'+enc)
              except Exception as e: continue
              for d in data.get('response',{}).get('docs',[]):
                examined+=1
                ident=d.get('identifier')
                if ident and ident not in docs: docs[ident]=d
          print('DISCOVERY_EXAMINED',examined)
          print('UNIQUE_DISCOVERY',len(docs))

          # academic heuristic ranking; metadata verification for first 180
          Aterms=['hebrew','aramaic','syriac','semitic','septuagint','lxx','hexapla','textual','manuscript','papyri','qumran','dead sea','apocrypha','pseudepigrapha','rabbin','talmud','midrash','assyri','babylon','akkad','ugarit','canaan','archaeolog','old testament','new testament','biblical','bible','isaiah','jeremiah','ezekiel','psalm','job','genesis','exodus','deuteronomy','matthew','mark','luke','john','romans','corinth','hebrews','revelation','josephus','philo','concordance','lexicon','grammar','commentary']
          Bterms=['theology','church history','patrist','reformation','calvin','luther','origen','jerome','augustine','chrysostom','irenaeus','missions','apolog','creed','judaism','early christian']
          def score(d):
            s=' '.join(str(d.get(k,'')) for k in ['title','creator','subject']).lower()
            return sum(4 for t in Aterms if t in s)+sum(2 for t in Bterms if t in s)
          ranked=sorted(docs.values(),key=lambda d:(-score(d),str(d.get('identifier',''))))
          out=[]
          for d in ranked[:220]:
            ident=d['identifier']
            try: meta=get('https://archive.org/metadata/'+urllib.parse.quote(ident))
            except Exception: continue
            md=meta.get('metadata',{}) or {}
            coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if 'graduatetheologicalunion' not in coll: continue
            med=md.get('mediatype','')
            if med and med!='texts': continue
            files=meta.get('files',[]) or []
            pdf=''; pages=md.get('numpages','') or ''
            restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
            if not restricted:
              for f in files:
                n=f.get('name','') or ''
                if re.search(r'\.pdf$',n,re.I) and not re.search(r'(encrypted|\.lcpdf$)',n,re.I) and str(f.get('private','false')).lower()!='true':
                  pdf=n; break
            title=md.get('title',d.get('title','')) or ''
            creator=md.get('creator',d.get('creator','')) or ''
            if isinstance(creator,list): creator='; '.join(map(str,creator))
            date=md.get('date',md.get('year',d.get('year',''))) or ''
            volume=md.get('volume','') or ''
            edition=md.get('edition','') or ''
            series=md.get('series','') or ''
            contributor=md.get('contributor','') or ''
            if isinstance(contributor,list): contributor='; '.join(map(str,contributor))
            subject=md.get('subject',d.get('subject','')) or ''
            if isinstance(subject,list): subject='; '.join(map(str,subject[:12]))
            lang=md.get('language',d.get('language','')) or ''
            if isinstance(lang,list): lang='; '.join(map(str,lang))
            out.append({'id':ident,'title':title,'creator':creator,'date':date,'volume':volume,'edition':edition,'series':series,'contributor':contributor,'subject':subject,'language':lang,'pdf':pdf,'pages':pages,'restricted':restricted,'score':score(d)})
            if len(out)>=90: break
          print('VERIFIED_GTUCANDIDATES',len(out))
          for x in out:
            print('CAND\t'+json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY
          python3 /tmp/discover.py
