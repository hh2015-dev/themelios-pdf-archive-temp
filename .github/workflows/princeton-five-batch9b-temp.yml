name: Princeton Five Batch 9B Temp
on:
  pull_request:
    branches: [ main ]
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Hatch Redpath Concordance
        run: curl -L --fail --retry 3 -o hatch-redpath.pdf https://archive.org/download/concordancetosep00hatc_0/concordancetosep00hatc_0.pdf
      - name: Upload Hatch Redpath Concordance
        uses: actions/upload-artifact@v4
        with:
          name: princeton-hatch-redpath-concordance
          path: hatch-redpath.pdf
      - name: Download Mielziner Talmud
        run: curl -L --fail --retry 3 -o mielziner-talmud.pdf https://archive.org/download/introductiontota00miel/introductiontota00miel.pdf
      - name: Upload Mielziner Talmud
        uses: actions/upload-artifact@v4
        with:
          name: princeton-mielziner-talmud
          path: mielziner-talmud.pdf
      - name: Download Taylor Pirqe Aboth
        run: curl -L --fail --retry 3 -o taylor-pirqe-aboth.pdf https://archive.org/download/sayingsofjewish00tayl/sayingsofjewish00tayl.pdf
      - name: Upload Taylor Pirqe Aboth
        uses: actions/upload-artifact@v4
        with:
          name: princeton-taylor-pirqe-aboth
          path: taylor-pirqe-aboth.pdf
      - name: Download Calvin 1587
        run: curl -L --fail --retry 3 -o calvin-1587.pdf https://archive.org/download/institutionofchr1587calv/institutionofchr1587calv.pdf
      - name: Upload Calvin 1587
        uses: actions/upload-artifact@v4
        with:
          name: princeton-calvin-1587
          path: calvin-1587.pdf
      - name: Download Warfield Two Studies
        run: curl -L --fail --retry 3 -o warfield-two-studies.pdf https://archive.org/download/twostudiesinhist00warf/twostudiesinhist00warf.pdf
      - name: Upload Warfield Two Studies
        uses: actions/upload-artifact@v4
        with:
          name: princeton-warfield-two-studies
          path: warfield-two-studies.pdf
