name: BSUK Acta Patristica discovery

on:
  push:
    paths:
      - bsuk_worker/discover_apb.py
      - .github/workflows/bsuk-apb-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python bsuk_worker/discover_apb.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-apb-discovery
          path: apb_discovery/manifest.csv
          if-no-files-found: error
          retention-days: 1
