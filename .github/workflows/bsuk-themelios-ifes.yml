name: BSUK Themelios IFES archive

on:
  push:
    paths:
      - bsuk_worker/download_themelios_ifes.py
      - .github/workflows/bsuk-themelios-ifes.yml
  pull_request:
    paths:
      - bsuk_worker/download_themelios_ifes.py
      - .github/workflows/bsuk-themelios-ifes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python bsuk_worker/download_themelios_ifes.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-themelios-ifes
          path: themelios_ifes_archive/
          if-no-files-found: error
          retention-days: 1
