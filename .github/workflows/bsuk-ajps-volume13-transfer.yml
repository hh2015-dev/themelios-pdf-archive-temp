name: BSUK AJPS Volume 13 Transfer

on:
  push:
    branches:
      - ajps-volume-13-transfer
    paths:
      - 'bsuk_worker/ajps_volume13_transfer.py'
      - '.github/workflows/bsuk-ajps-volume13-transfer.yml'
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Download AJPS Volume 13 PDFs from BSUK
        run: python bsuk_worker/ajps_volume13_transfer.py
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsuk-ajps-v13
          path: out_ajps13/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
