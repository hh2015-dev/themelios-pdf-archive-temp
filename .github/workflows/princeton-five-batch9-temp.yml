name: Princeton Five Batch 9 Temp

on:
  pull_request:
    branches: [main]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Hatch Redpath Concordance
        run: curl -L --fail --retry 4 --retry-delay 3 -o hatch_redpath_concordance.pdf "https://archive.org/download/concordancetosep00hatc_0/concordancetosep00hatc_0.pdf"
      - name: Upload Hatch Redpath Concordance
        uses: actions/upload-artifact@v4
        with:
          name: princeton-hatch-redpath-concordance
          path: hatch_redpath_concordance.pdf
          compression-level: 0

      - name: Download Mielziner Introduction Talmud
        run: curl -L --fail --retry 4 --retry-delay 3 -o mielziner_introduction_talmud.pdf "https://archive.org/download/introductiontota00miel/introductiontota00miel.pdf"
      - name: Upload Mielziner Introduction Talmud
        uses: actions/upload-artifact@v4
        with:
          name: princeton-mielziner-talmud
          path: mielziner_introduction_talmud.pdf
          compression-level: 0

      - name: Download Taylor Pirqe Aboth
        run: curl -L --fail --retry 4 --retry-delay 3 -o taylor_pirqe_aboth.pdf "https://archive.org/download/sayingsofjewish00tayl/sayingsofjewish00tayl.pdf"
      - name: Upload Taylor Pirqe Aboth
        uses: actions/upload-artifact@v4
        with:
          name: princeton-taylor-pirqe-aboth
          path: taylor_pirqe_aboth.pdf
          compression-level: 0

      - name: Download Calvin Institution 1587
        run: curl -L --fail --retry 4 --retry-delay 3 -o calvin_institution_1587.pdf "https://archive.org/download/institutionofchr1587calv/institutionofchr1587calv.pdf"
      - name: Upload Calvin Institution 1587
        uses: actions/upload-artifact@v4
        with:
          name: princeton-calvin-institution-1587
          path: calvin_institution_1587.pdf
          compression-level: 0

      - name: Download Warfield Two Studies
        run: curl -L --fail --retry 4 --retry-delay 3 -o warfield_two_studies.pdf "https://archive.org/download/twostudiesinhist00warf/twostudiesinhist00warf.pdf"
      - name: Upload Warfield Two Studies
        uses: actions/upload-artifact@v4
        with:
          name: princeton-warfield-two-studies
          path: warfield_two_studies.pdf
          compression-level: 0
