name: GTU Inventory 20 Fast
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Parallel GTU metadata verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          : > ids.txt
          terms=('Septuagint' 'Peshitta' 'Masoretic' 'Targum' 'Qumran' 'Aramaic' 'Syriac' 'Akkadian' 'Ugaritic' 'Greek New Testament' 'textual criticism' 'papyri' 'Origen' 'Jerome' 'Augustine' 'Chrysostom' 'Tertullian' 'Josephus' 'Philo' 'Maccabees' 'biblical archaeology' 'Bible commentary')
          examined=0
          for term in "${terms[@]}"; do
            q="collection:graduatetheologicalunion AND mediatype:texts AND (title:(\"$term\") OR subject:(\"$term\"))"
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            curl -fsSL "https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier&rows=30&page=1&output=json" -o s.json
            n=$(jq '.response.docs|length' s.json); examined=$((examined+n))
            jq -r '.response.docs[].identifier' s.json >> ids.txt
          done
          sort -u ids.txt | head -n 180 > uniq.txt
          export -f true 2>/dev/null || true
          cat > verify_one.sh <<'SH'
          #!/usr/bin/env bash
          id="$1"; out="out/${id//\//_}.tsv"
          curl -fsSL "https://archive.org/metadata/$id" -o "/tmp/$id.json" || exit 0
          m="/tmp/$id.json"
          in_gtu=$(jq -r '[(.metadata.collection // [])] | flatten | map(select(.=="graduatetheologicalunion")) | length' "$m")
          [[ "$in_gtu" -gt 0 ]] || exit 0
          restricted=$(jq -r '.metadata["access-restricted-item"] // .metadata.printdisabled // ""' "$m")
          [[ "$restricted" != "true" ]] || exit 0
          pdf=$(jq -r '[.files[] | select((.private // "false") != "true") | select(.name|test("\\.pdf$";"i")) | select((.name|test("encrypted|lcpdf";"i"))|not) | .name][0] // ""' "$m")
          [[ -n "$pdf" ]] || exit 0
          f(){ jq -r "$1 // \"\" | if type==\"array\" then join(\"; \") else tostring end" "$m" | tr '\t\r\n' '   '; }
          title=$(f '.metadata.title'); creator=$(f '.metadata.creator'); date=$(f '.metadata.date'); lang=$(f '.metadata.language'); vol=$(f '.metadata.volume'); ed=$(f '.metadata.edition'); series=$(f '.metadata.series'); contrib=$(f '.metadata.contributor'); pages=$(f '.metadata.imagecount')
          subj=$(jq -r '.metadata.subject // "" | if type=="array" then join(" | ") else . end' "$m" | tr '\t\r\n' '   ')
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$title" "$creator" "$date" "$vol" "$ed" "$series" "$lang" "$subj" "$pages" "$contrib" "$pdf" > "$out"
          SH
          chmod +x verify_one.sh
          cat uniq.txt | xargs -n1 -P12 ./verify_one.sh
          cat out/*.tsv 2>/dev/null | sort > verified.tsv || true
          echo "EXAMINED_SEARCH_HITS=$examined"
          echo "UNIQUE_CANDIDATES=$(wc -l < uniq.txt)"
          echo "VERIFIED_PUBLIC_PDF=$(wc -l < verified.tsv)"
          echo '---VERIFIED TSV START---'
          cat verified.tsv
          echo '---VERIFIED TSV END---'
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-fast-verified
          path: verified.tsv
