name: GTU inventory discovery run
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, concurrent.futures, re, time
          base='https://archive.org/advancedsearch.php'
          terms=[
            'hebrew','aramaic','syriac','septuagint','targum','talmud','mishnah','ugaritic','coptic','papyri',
            'new testament','old testament','biblical commentary','textual criticism','manuscript','apocrypha','pseudepigrapha',
            'patristic','church history','reformation','theology','missionary','judaism','archaeology','concordance','lexicon','grammar'
          ]
          ids=[]
          for idx,t in enumerate(terms):
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND ({t})'
              params={'q':q,'fl[]':['identifier'],'rows':'35','page':str(1+(idx%4)),'output':'json','sort[]':'identifier asc'}
              url=base+'?'+urllib.parse.urlencode(params,doseq=True)
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      docs=json.load(r)['response']['docs']
                  ids += [d['identifier'] for d in docs if d.get('identifier')]
              except Exception as e:
                  print('SEARCHERR',t,e)
          # add broad sampled pages across exact collection
          for page in [3,7,11,17,23,31,41]:
              params={'q':'collection:graduatetheologicalunion AND mediatype:texts','fl[]':['identifier'],'rows':'40','page':str(page),'output':'json','sort[]':'date asc'}
              url=base+'?'+urllib.parse.urlencode(params,doseq=True)
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      docs=json.load(r)['response']['docs']
                  ids += [d['identifier'] for d in docs if d.get('identifier')]
              except Exception as e: print('BROADERR',page,e)
          ids=list(dict.fromkeys(ids))
          print('CANDIDATES',len(ids))
          def norm_creator(x):
              if isinstance(x,list): return '; '.join(map(str,x))
              return '' if x is None else str(x)
          def one(i):
              try:
                  with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(i,safe=''),timeout=35) as r:
                      m=json.load(r)
                  md=m.get('metadata',{})
                  coll=md.get('collection',[])
                  if isinstance(coll,str): coll=[coll]
                  if 'graduatetheologicalunion' not in coll: return None
                  if str(md.get('mediatype','texts')) not in ('texts','text'): return None
                  restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
                  if restricted: return None
                  pdfs=[]
                  for f in m.get('files',[]):
                      n=f.get('name','')
                      if not re.search(r'\.pdf$',n,re.I): continue
                      if re.search(r'(encrypted|\.lcpdf$)',n,re.I): continue
                      if str(f.get('private','false')).lower()=='true': continue
                      pdfs.append(f)
                  if not pdfs: return None
                  # prefer original public pdf, largest sane choice
                  pdf=sorted(pdfs,key=lambda f:int(f.get('size') or 0),reverse=True)[0]
                  title=md.get('title','')
                  creator=norm_creator(md.get('creator',''))
                  date=str(md.get('date') or md.get('year') or '')
                  vol=str(md.get('volume') or '')
                  edition=str(md.get('edition') or '')
                  series=str(md.get('series') or '')
                  lang=md.get('language','')
                  if isinstance(lang,list): lang='; '.join(map(str,lang))
                  subjects=md.get('subject','')
                  if isinstance(subjects,list): subjects=' | '.join(map(str,subjects[:8]))
                  contrib=norm_creator(md.get('contributor',''))
                  pages=str(md.get('page-progression') or '')
                  # derive page count only from scandata/page_numbers not reliable; leave empty unless metadata has imagecount
                  if md.get('imagecount'): pages=str(md.get('imagecount'))
                  return [i,title,creator,date,vol,edition,series,str(lang),str(subjects),contrib,pdf.get('name',''),str(pages)]
              except Exception: return None
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              for r in ex.map(one,ids):
                  if r: out.append(r)
          print('ELIGIBLE',len(out))
          with open('gtu_candidates.tsv','w',encoding='utf-8') as f:
              f.write('identifier\ttitle\tcreator\tdate\tvolume\tedition\tseries\tlanguage\tsubjects\tcontributor\tpdf\tpages\n')
              for row in out:
                  f.write('\t'.join(x.replace('\t',' ').replace('\n',' ') for x in row)+'\n')
          for row in out[:160]:
              print('GTU\t'+'\t'.join(x.replace('\t',' ').replace('\n',' ') for x in row))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates
          path: gtu_candidates.tsv
