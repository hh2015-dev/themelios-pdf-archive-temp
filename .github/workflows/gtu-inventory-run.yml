name: GTU inventory discovery run
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine exact GTU collection fast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, concurrent.futures, re
          base='https://archive.org/advancedsearch.php'
          queries=[
            'hebrew bible','aramaic','syriac','septuagint','textual criticism','new testament greek',
            'targum','dead sea scrolls','ugaritic','biblical archaeology','patristic','reformation commentary',
            'church history','systematic theology','missionary history','judaism'
          ]
          ids=[]
          for idx,t in enumerate(queries):
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND ({t})'
              params={'q':q,'fl[]':'identifier','rows':'18','page':str(1+(idx%3)),'output':'json','sort[]':'identifier asc'}
              try:
                  with urllib.request.urlopen(base+'?'+urllib.parse.urlencode(params),timeout=15) as r:
                      ids += [d['identifier'] for d in json.load(r)['response']['docs'] if d.get('identifier')]
              except Exception as e: print('SEARCHERR',t,e)
          ids=list(dict.fromkeys(ids))[:260]
          print('CANDIDATES',len(ids))
          def s(x):
              if isinstance(x,list): return '; '.join(map(str,x))
              return '' if x is None else str(x)
          def one(i):
              try:
                  req=urllib.request.Request('https://archive.org/metadata/'+urllib.parse.quote(i,safe=''),headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=12) as r: m=json.load(r)
                  md=m.get('metadata',{}); coll=md.get('collection',[])
                  if isinstance(coll,str): coll=[coll]
                  if 'graduatetheologicalunion' not in coll: return None
                  if str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true': return None
                  pdfs=[f for f in m.get('files',[]) if re.search(r'\.pdf$',f.get('name',''),re.I) and not re.search(r'(encrypted|\.lcpdf$)',f.get('name',''),re.I) and str(f.get('private','false')).lower()!='true']
                  if not pdfs: return None
                  pdf=max(pdfs,key=lambda f:int(f.get('size') or 0))
                  subj=md.get('subject',''); subj=' | '.join(map(str,subj[:8])) if isinstance(subj,list) else s(subj)
                  lang=md.get('language',''); lang='; '.join(map(str,lang)) if isinstance(lang,list) else s(lang)
                  return [i,s(md.get('title')),s(md.get('creator')),s(md.get('date') or md.get('year')),s(md.get('volume')),s(md.get('edition')),s(md.get('series')),lang,subj,s(md.get('contributor')),pdf.get('name',''),s(md.get('imagecount'))]
              except Exception: return None
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
              for r in ex.map(one,ids):
                  if r: out.append(r)
          print('ELIGIBLE',len(out))
          for row in out[:120]: print('GTU\t'+'\t'.join(x.replace('\t',' ').replace('\n',' ') for x in row))
          with open('gtu_candidates.tsv','w',encoding='utf-8') as f:
              f.write('identifier\ttitle\tcreator\tdate\tvolume\tedition\tseries\tlanguage\tsubjects\tcontributor\tpdf\tpages\n')
              for row in out: f.write('\t'.join(x.replace('\t',' ').replace('\n',' ') for x in row)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates
          path: gtu_candidates.tsv
