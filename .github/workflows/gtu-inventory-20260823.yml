name: TEMP GTU Inventory Discovery 20260823
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection and verify public PDFs
        shell: bash
        run: |
          cat > /tmp/discover.py <<'PY'
          import requests, json, re, time, unicodedata
          from urllib.parse import quote
          BASE='https://archive.org'
          queries=[
            'hebrew OR hebrew bible OR old testament','aramaic OR syriac OR semitic','septuagint OR lxx OR hexapla','greek new testament OR koine OR new testament greek','textual criticism OR manuscripts OR codex','dead sea scrolls OR qumran OR second temple','apocrypha OR pseudepigrapha OR maccabees','mishna OR talmud OR rabbinic OR targum','assyrian OR babylonian OR akkadian OR ugaritic','biblical archaeology OR palestine archaeology','genesis OR exodus OR leviticus OR numbers OR deuteronomy','isaiah OR jeremiah OR ezekiel OR daniel','psalms OR job OR proverbs OR wisdom','matthew OR mark OR luke OR john gospel','romans OR corinthians OR galatians OR hebrews','revelation OR apocalypse OR acts apostles','commentary OR commentaries OR exegesis','calvin OR luther OR patristic OR fathers','concordance OR lexicon OR grammar OR bibliography','biblical literature OR bible translator OR biblical archaeologist'
          ]
          docs={}
          examined=0
          for qi,q0 in enumerate(queries):
            terms=' OR '.join('title:(%s)'%x.strip() for x in q0.split(' OR '))
            q=f'collection:graduatetheologicalunion AND mediatype:texts AND ({terms})'
            for page in (1,2,3):
              params=[('q',q),('rows','100'),('page',str(page)),('output','json'),('sort[]','date asc')]
              for f in ['identifier','title','creator','year','volume','language','subject','description']:
                params.append(('fl[]',f))
              try:
                r=requests.get(BASE+'/advancedsearch.php',params=params,timeout=30); r.raise_for_status()
                arr=r.json().get('response',{}).get('docs',[])
              except Exception:
                continue
              examined += len(arr)
              for d in arr:
                i=d.get('identifier')
                if i: docs[i]=d
              time.sleep(.05)
          kwsA=['hebrew','old testament','new testament','aramaic','syriac','semitic','greek','septuagint','lxx','textual','manuscript','codex','qumran','dead sea','second temple','apocrypha','pseudepigrapha','mishna','talmud','rabbin','targum','assyri','babylon','akkad','ugarit','archaeolog','genesis','exodus','leviticus','numbers','deuteronomy','isaiah','jeremiah','ezekiel','daniel','psalm','job','proverb','matthew','mark','luke','john','romans','corinth','galatian','hebrews','revelation','apocalypse','acts','commentar','exeg','concordance','lexicon','grammar','biblical','bible']
          kwsB=['calvin','luther','patrist','augustine','church history','reformation','theology','doctrine','mission','judaism','early christian','creed','apologetic']
          def text(d):
            vals=[]
            for k in ('title','creator','subject','description'):
              v=d.get(k,'')
              if isinstance(v,list): vals.extend(map(str,v))
              else: vals.append(str(v))
            return ' '.join(vals).lower()
          def score(d):
            t=text(d)
            s=sum(5 for k in kwsA if k in t)+sum(2 for k in kwsB if k in t)
            y=d.get('year')
            try:
              if 1800 <= int(str(y)[:4]) <= 1950: s+=1
            except: pass
            return s
          ranked=sorted(docs.values(),key=lambda d:(-score(d),str(d.get('title',''))))[:320]
          out=[]; verified=0
          for d in ranked:
            ident=d['identifier']
            try:
              m=requests.get(BASE+'/metadata/'+quote(ident,safe=''),timeout=30).json()
            except Exception:
              continue
            md=m.get('metadata',{})
            coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if 'graduatetheologicalunion' not in coll: continue
            if str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true': continue
            pdfs=[]
            for f in m.get('files',[]):
              n=f.get('name','')
              if not re.search(r'\.pdf$',n,re.I): continue
              if re.search(r'(lcpdf|encrypted)\.pdf$',n,re.I): continue
              if str(f.get('private','false')).lower()=='true': continue
              pdfs.append((int(f.get('size') or 0),n))
            if not pdfs: continue
            pdf=max(pdfs)[1]
            title=md.get('title') or d.get('title','')
            creator=md.get('creator') or d.get('creator','')
            if isinstance(creator,list): creator='; '.join(map(str,creator))
            subject=md.get('subject') or d.get('subject','')
            if isinstance(subject,list): subject='; '.join(map(str,subject[:12]))
            lang=md.get('language') or d.get('language','')
            if isinstance(lang,list): lang='; '.join(map(str,lang))
            year=md.get('year') or md.get('date') or d.get('year','')
            if isinstance(year,list): year=year[0] if year else ''
            volume=md.get('volume') or d.get('volume','')
            if isinstance(volume,list): volume='; '.join(map(str,volume))
            edition=md.get('edition',''); series=md.get('series','')
            contributor=md.get('contributor','Internet Archive; Graduate Theological Union collection')
            if isinstance(contributor,list): contributor='; '.join(map(str,contributor))
            pages=md.get('imagecount','')
            out.append({'identifier':ident,'title':str(title),'creator':str(creator),'year':str(year),'volume':str(volume),'edition':str(edition),'series':str(series),'language':str(lang),'subject':str(subject),'pages':str(pages),'contributor':str(contributor),'pdf_name':pdf,'item_link':BASE+'/details/'+ident,'pdf_link':BASE+'/download/'+ident+'/'+quote(pdf),'score':score(d)})
            verified += 1
            if verified>=180: break
            time.sleep(.04)
          with open('gtu_candidates.json','w',encoding='utf-8') as f: json.dump({'examined_search_hits':examined,'unique_candidates':len(docs),'verified_candidates':len(out),'items':out},f,ensure_ascii=False,indent=2)
          print(json.dumps({'examined_search_hits':examined,'unique_candidates':len(docs),'verified_candidates':len(out)}))
          PY
          python /tmp/discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates-20260823
          path: gtu_candidates.json
          compression-level: 6
