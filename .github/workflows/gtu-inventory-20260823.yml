name: GTU inventory 2026-08-23
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU only and verify public PDFs
        shell: bash
        run: |
          cat > /tmp/gtu.py <<'PY'
          import requests, urllib.parse, concurrent.futures
          terms=[
          'title:(lexicon OR grammar OR concordance) AND (hebrew OR aramaic OR syriac OR greek)',
          'title:(septuagint OR lxx OR hexapla OR targum OR peshitta)',
          'title:(textual criticism OR manuscript OR manuscripts OR papyri OR codex)',
          'title:(dead sea OR qumran OR pseudepigrapha OR apocrypha OR maccabees)',
          'title:(genesis OR exodus OR leviticus OR numbers OR deuteronomy OR joshua OR judges OR samuel OR kings)',
          'title:(isaiah OR jeremiah OR ezekiel OR daniel OR hosea OR amos OR micah OR psalms OR proverbs OR job)',
          'title:(matthew OR mark OR luke OR john OR acts OR romans OR corinthians OR galatians OR hebrews OR revelation)',
          'title:(philo OR josephus OR mishnah OR talmud OR midrash)',
          'title:(ugaritic OR akkadian OR assyrian OR babylonian OR cuneiform OR palestine)',
          'title:(eusebius OR origen OR chrysostom OR augustine OR jerome OR irenaeus OR tertullian)',
          'title:(calvin OR luther) AND (commentary OR commentaries OR sermons)',
          'subject:(Bible) AND subject:(Criticism OR Commentaries OR Language)',
          'subject:(Greek language, Biblical)','subject:(Hebrew language)','subject:(Aramaic language OR Syriac language)',
          'subject:(Dead Sea scrolls)','subject:(Assyriology OR Babylonia OR Palestine Antiquities)',
          'title:(Bible dictionary OR biblical archaeology OR biblical theology)',
          'title:(critical and exegetical commentary)','title:(expository times OR journal of biblical literature OR scripture)']
          seen={}
          def search(q,page=1,rows=60):
            p={'q':q,'fl[]':['identifier','title','creator','date','year','language','subject','volume','contributor'],'rows':rows,'page':page,'output':'json'}
            try:return requests.get('https://archive.org/advancedsearch.php',params=p,timeout=12).json()['response']['docs']
            except:return []
          for t in terms:
            for d in search('collection:graduatetheologicalunion AND mediatype:texts AND ('+t+')'):
              if d.get('identifier'): seen.setdefault(d['identifier'],d)
          for page in [9,17,25,33,41,49]:
            for d in search('collection:graduatetheologicalunion AND mediatype:texts',page,100):
              txt=' '.join(str(d.get(k,'')) for k in ['title','subject','creator']).lower()
              if any(k in txt for k in ['bible','biblical','hebrew','aramaic','syriac','greek','septuagint','targum','manuscript','papyri','qumran','talmud','mishnah','philo','josephus','assyri','babylon','ugarit','commentar','patrist','reformation','calvin','luther','archaeolog']): seen.setdefault(d['identifier'],d)
          def score(d):
            txt=' '.join(str(d.get(k,'')) for k in ['title','subject','creator']).lower(); s=0
            for k,v in [('septuagint',12),('textual criticism',12),('manuscript',10),('hebrew',9),('aramaic',9),('syriac',9),('greek',8),('qumran',12),('dead sea',12),('targum',10),('peshitta',10),('lexicon',9),('grammar',8),('concordance',8),('biblical',7),('bible',5),('commentar',6),('philo',7),('josephus',7),('talmud',8),('mishnah',8),('assyri',7),('babylon',7),('ugarit',8),('archaeolog',6),('calvin',5),('luther',5),('origen',5)]:
              if k in txt:s+=v
            return s
          cand=sorted(seen.values(),key=score,reverse=True)[:180]
          def verify(d):
            ident=d['identifier']
            try:m=requests.get('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=10).json()
            except:return None
            md=m.get('metadata',{}); coll=md.get('collection',[]); coll=[coll] if isinstance(coll,str) else coll
            if 'graduatetheologicalunion' not in coll:return None
            if str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true':return None
            pdf=[]
            for f in m.get('files',[]):
              n=f.get('name',''); lo=n.lower()
              if lo.endswith('.pdf') and not lo.endswith('.lcpdf') and 'encrypted' not in lo and str(f.get('private','false')).lower()!='true': pdf.append(f)
            if not pdf:return None
            p=sorted(pdf,key=lambda f:(('_text.pdf' in f.get('name','').lower()),len(f.get('name',''))))[0]
            return [ident,score(d),md.get('title') or d.get('title',''),md.get('creator') or d.get('creator',''),md.get('date') or md.get('year') or d.get('date') or d.get('year',''),md.get('volume') or d.get('volume',''),md.get('language') or d.get('language',''),md.get('subject') or d.get('subject',''),md.get('contributor') or d.get('contributor',''),p.get('name',''),md.get('pages') or md.get('page_count') or '']
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            rows=[r for r in ex.map(verify,cand) if r]
          rows=sorted(rows,key=lambda r:r[1],reverse=True)
          print('EXAMINED',len(cand),'VERIFIED',len(rows))
          for r in rows[:100]:
            def clean(x):
              if isinstance(x,list):x='; '.join(map(str,x))
              return str(x).replace('\t',' ').replace('\n',' ')
            print('\t'.join(clean(x) for x in r))
          PY
          python3 /tmp/gtu.py | tee /tmp/gtu-results.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-results-fast
          path: /tmp/gtu-results.tsv
