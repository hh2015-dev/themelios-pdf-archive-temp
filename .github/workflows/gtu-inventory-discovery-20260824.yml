name: GTU inventory discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU collection broadly and verify candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re, time
          from collections import OrderedDict
          base='https://archive.org/advancedsearch.php'
          queries=[
            'collection:graduatetheologicalunion AND mediatype:text',
            'collection:graduatetheologicalunion AND (title:(bible OR biblical OR testament OR gospel OR psalm OR isaiah OR jeremiah OR ezekiel OR daniel OR pentateuch OR genesis OR exodus OR leviticus OR numbers OR deuteronomy))',
            'collection:graduatetheologicalunion AND (title:(hebrew OR aramaic OR syriac OR semitic OR greek OR septuagint OR targum OR talmud OR midrash OR mishna OR ugaritic OR akkadian))',
            'collection:graduatetheologicalunion AND (title:(manuscript OR papyri OR textual OR criticism OR archaeology OR apocrypha OR pseudepigrapha OR josephus OR philo OR qumran))',
            'collection:graduatetheologicalunion AND (title:(commentary OR commentaries OR lexicon OR grammar OR concordance OR bibliography OR patristic OR augustine OR origen OR chrysostom OR calvin OR luther))'
          ]
          pages=[3,7,11,15,19]
          docs=OrderedDict()
          for q in queries:
            for p in pages:
              params={'q':q,'fl[]':['identifier','title','creator','year','language','subject'],'rows':'100','page':str(p),'output':'json'}
              url=base+'?'+urllib.parse.urlencode(params,doseq=True)
              try:
                data=json.load(urllib.request.urlopen(url, timeout=30))
              except Exception:
                continue
              for d in data.get('response',{}).get('docs',[]):
                ident=d.get('identifier')
                if ident: docs.setdefault(ident,d)
          print('EXAMINED_UNIQUE',len(docs))
          rx=re.compile(r'(bible|biblical|testament|gospel|hebrew|aramaic|syriac|semitic|greek|septuagint|targum|talmud|midrash|mishna|ugaritic|akkadian|manuscript|papyr|textual|criticism|archaeolog|apocry|pseudep|josephus|philo|qumran|commentar|lexicon|grammar|concordance|bibliograph|patrist|augustin|origen|chrysostom|calvin|luther|psalm|isaiah|jeremiah|ezekiel|daniel|pentateuch|genesis|exodus|leviticus|deuteronomy|acts|romans|corinth|galatians|ephesians|revelation|church history|reformation|theology)',re.I)
          cand=[]
          for ident,d in docs.items():
            txt=' '.join(str(d.get(k,'')) for k in ('title','subject','creator'))
            score=len(rx.findall(txt))
            if score:
              cand.append((score,ident,d))
          cand.sort(key=lambda x:(-x[0],x[1]))
          verified=0
          for score,ident,d in cand[:180]:
            try:
              meta=json.load(urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident), timeout=30))
            except Exception:
              continue
            md=meta.get('metadata',{})
            coll=md.get('collection',[])
            if isinstance(coll,str): coll=[coll]
            if 'graduatetheologicalunion' not in coll: continue
            files=meta.get('files',[])
            pdfs=[]
            for f in files:
              n=f.get('name','')
              if n.lower().endswith('.pdf') and not n.lower().endswith('encrypted.pdf') and str(f.get('private','false')).lower()!='true':
                pdfs.append(n)
            restricted=str(md.get('access-restricted-item',md.get('printdisabled',''))).lower()=='true'
            title=md.get('title') or d.get('title') or ''
            creator=md.get('creator') or d.get('creator') or ''
            if isinstance(creator,list): creator='; '.join(map(str,creator))
            year=md.get('year') or md.get('date') or d.get('year') or ''
            lang=md.get('language') or d.get('language') or ''
            if isinstance(lang,list): lang='; '.join(map(str,lang))
            subject=md.get('subject') or d.get('subject') or ''
            if isinstance(subject,list): subject='; '.join(map(str,subject[:8]))
            volume=md.get('volume','')
            edition=md.get('edition','')
            series=md.get('series','')
            pages=md.get('pages','')
            contributor=md.get('contributor','Graduate Theological Union')
            pdf=pdfs[0] if pdfs and not restricted else ''
            direct='https://archive.org/download/%s/%s'%(ident,urllib.parse.quote(pdf)) if pdf else ''
            rec={'id':ident,'title':title,'creator':creator,'year':year,'language':lang,'subject':subject,'volume':volume,'edition':edition,'series':series,'pages':pages,'contributor':contributor,'restricted':restricted,'pdf':direct,'score':score}
            print('CANDIDATE\t'+json.dumps(rec,ensure_ascii=False,separators=(',',':')))
            verified+=1
            if verified>=90: break
          print('VERIFIED_OUTPUT',verified)
          PY
