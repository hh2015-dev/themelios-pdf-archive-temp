name: BSUK EQ inventory diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'bsuk_worker/eq_inventory_diag.py'
      - '.github/workflows/bsuk-eq-inventory-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python bsuk_worker/eq_inventory_diag.py
