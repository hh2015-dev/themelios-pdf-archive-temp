name: AABNER Volume 1 bridge

on:
  push:
    paths:
      - 'aabner-v1-trigger.txt'
  workflow_dispatch:

jobs:
  fetch-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and download 2021 full issues
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, html, os
          UA={'User-Agent':'Mozilla/5.0'}
          base='https://aabner.org/ojs/index.php/beabs'
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=120) as r:
                  return r.read(), r.headers.get_content_type(), r.geturl()
          arc,_c,_u=get(base+'/issue/archive')
          s=arc.decode('utf-8','replace')
          urls=[]
          for x in re.findall(r'href=["\']([^"\']*/issue/view/[^"\']+)["\']',s,re.I):
              u=urllib.parse.urljoin(base+'/',html.unescape(x))
              u=u.split('#')[0]
              if u not in urls: urls.append(u)
          print('ARCHIVE ISSUE URLS',len(urls))
          os.makedirs('aabner_v1',exist_ok=True)
          got=[]
          for u in urls:
              try:
                  b,c,f=get(u); t=b.decode('utf-8','replace')
              except Exception as e:
                  print('ISSUE ERR',u,e); continue
              # Restrict to 2021 / Volume 1 by page title/body signals.
              plain=re.sub(r'<[^>]+>',' ',t)
              if '2021' not in plain: continue
              if not (re.search(r'Vol\.?\s*1\b',plain,re.I) or re.search(r'Volume\s*1\b',plain,re.I) or '1, 1 (2021)' in plain or '1, 2 (2021)' in plain or '1, 3 (2021)' in plain):
                  continue
              m=re.search(r'Full Issue.*?<a[^>]+href=["\']([^"\']+)["\']',t,re.I|re.S)
              if not m:
                  print('NO FULL ISSUE',u); continue
              landing=urllib.parse.urljoin(u,html.unescape(m.group(1)))
              b2,c2,f2=get(landing)
              pdf=None; final_url=None
              if b2.startswith(b'%PDF'):
                  pdf=b2; final_url=f2
              else:
                  t2=b2.decode('utf-8','replace')
                  vals=re.findall(r'(?:href|src)=["\']([^"\']+)',t2,re.I)
                  for v in vals:
                      cand=urllib.parse.urljoin(landing,html.unescape(v))
                      if '/issue/download/' not in cand: continue
                      try:
                          bb,cc,ff=get(cand)
                          if bb.startswith(b'%PDF') or cc=='application/pdf':
                              pdf=bb; final_url=ff; break
                      except Exception as e: print('CAND ERR',cand,e)
              if pdf is None:
                  print('NO PDF',u); continue
              # derive issue number from visible Vol. 1 No. N label, otherwise from filename slug.
              mi=re.search(r'Vol\.?\s*1\s*(?:No\.?|no\.?)\s*(\d+)',plain,re.I)
              if not mi:
                  mi=re.search(r'1\s*,\s*(\d+)\s*\(2021\)',plain,re.I)
              ino=int(mi.group(1)) if mi else len(got)+1
              name=f'AABNER - Volume 001 Issue {ino:02d} - 2021.pdf'
              path=os.path.join('aabner_v1',name)
              open(path,'wb').write(pdf)
              got.append((ino,name,len(pdf),final_url))
              print('SAVED',ino,name,len(pdf),final_url)
          if not got: raise SystemExit('No 2021 full issues downloaded')
          print('TOTAL',len(got))
          PY
      - name: Upload Volume 1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aabner-volume-001-2021
          path: aabner_v1/*.pdf
          if-no-files-found: error
          compression-level: 0
