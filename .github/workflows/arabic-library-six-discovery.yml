name: Arabic library six discovery
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Search Archive.org by title and creator
        shell: bash
        run: |
          set -euo pipefail
          : > results.txt
          queries=(
            'title:"الإملاء والترقيم في الكتابة العربية" AND creator:"عبد العليم إبراهيم"'
            'title:"فن التحرير العربي" AND creator:"محمد صالح الشنطي"'
            'title:"قواعد الإملاء" AND creator:"عبد السلام محمد هارون"'
            'title:"تعلّم النحو والإملاء والترقيم" AND creator:"عبد الرحمن الهاشمي"'
            'title:"معجم الصواب اللغوي" AND creator:"أحمد مختار عمر"'
            'title:"فن الكتابة الصحيحة" AND creator:"محمود سليمان ياقوت"'
          )
          for q in "${queries[@]}"; do
            echo "=== $q ===" | tee -a results.txt
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            curl -fsSL "https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier,title,creator&rows=10&page=1&output=json" -o search.json
            jq -r '.response.docs[] | [.identifier,.title,(.creator//"")] | @tsv' search.json | tee -a results.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arabic-six-discovery
          path: results.txt
