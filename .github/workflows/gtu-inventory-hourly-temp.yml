name: GTU inventory discovery temp
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU-only Archive corpus
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/all.tsv
          queries=(
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:hebrew OR title:aramaic OR title:syriac OR title:semitic OR title:greek)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:septuagint OR title:manuscript OR title:textual OR title:qumran OR title:papyrus)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:bible OR title:testament OR title:genesis OR title:isaiah OR title:psalms OR title:paul)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:archaeology OR title:assyrian OR title:akkadian OR title:ugaritic OR title:cuneiform)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:calvin OR title:luther OR title:origen OR title:augustine OR title:commentary)'
            'collection:graduatetheologicalunion AND mediatype:texts AND (title:journal OR title:bulletin OR title:review OR title:bibliography OR title:lexicon OR title:grammar)'
          )
          for q in "${queries[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$q")
            for page in 1 3 7; do
              curl -fsSL "https://archive.org/advancedsearch.php?q=$enc&fl[]=identifier,title,creator,year,volume,contributor,collection&rows=100&page=$page&output=json" -o /tmp/s.json
              jq -r '.response.docs[] | [(.identifier//""),(.title//""),((.creator//"")|if type=="array" then join("; ") else . end),((.year//"")|tostring),((.volume//"")|tostring),((.contributor//"")|if type=="array" then join("; ") else . end)] | @tsv' /tmp/s.json >> /tmp/all.tsv
            done
          done
          awk -F '\t' '!seen[$1]++' /tmp/all.tsv | head -n 400 | while IFS=$'\t' read -r id title creator year volume contributor; do
            curl -fsSL "https://archive.org/metadata/$id" -o /tmp/m.json || continue
            in_gtu=$(jq -r '[(.metadata.collection // [])[]?] | any(. == "graduatetheologicalunion")' /tmp/m.json)
            [[ "$in_gtu" == "true" ]] || continue
            restricted=$(jq -r '.metadata["access-restricted-item"] // .metadata.printdisabled // ""' /tmp/m.json)
            pdf=$(jq -r '[.files[]? | select(.name|test("\\.pdf$";"i")) | select((.private//"false") != "true") | select((.name|test("encrypted|lcpdf";"i"))|not) | .name][0] // ""' /tmp/m.json)
            pages=$(jq -r '.metadata.imagecount // ""' /tmp/m.json)
            edition=$(jq -r '.metadata.edition // ""' /tmp/m.json)
            series=$(jq -r '.metadata.series // ""' /tmp/m.json)
            printf 'GTU\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$title" "$creator" "$year" "$volume" "$edition" "$series" "$restricted" "$pdf" "$pages"
          done
