name: BSUK Ashland alternative search v7
on:
  push:
    paths:
      - 'bsuk_worker/ashland_search_v7.py'
      - '.github/workflows/bsuk-ashland-search-v7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bsuk_worker/ashland_search_v7.py
