name: GTU inventory 20260824 fast
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU corpus candidates
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import requests, json
          BASE='https://archive.org'
          q='collection:graduatetheologicalunion AND mediatype:texts'
          pages=[3,8,13,18,23,28,33,38,43,48,53,58]
          docs={}
          fields=['identifier','title','creator','year','date','volume','subject','language','contributor','publisher','edition','series']
          for p in pages:
              params=[('q',q),('rows','200'),('page',str(p)),('output','json'),('sort[]','identifier asc')]
              for f in fields: params.append(('fl[]',f))
              r=requests.get(BASE+'/advancedsearch.php',params=params,timeout=45); r.raise_for_status()
              for d in r.json()['response']['docs']:
                  if d.get('identifier'): docs[d['identifier']]=d
          kwA=['bible','biblical','testament','hebrew','aramaic','syriac','semitic','greek','septuagint','lxx','textual','manuscript','qumran','dead sea','apocry','pseudep','rabbin','talmud','mishna','midrash','assyri','babylon','akkad','ugarit','cuneiform','archaeolog','genesis','exodus','leviticus','numbers','deuteronomy','joshua','judges','samuel','kings','chronicles','ezra','nehemiah','esther','job','psalm','proverb','ecclesiast','isaiah','jeremiah','ezekiel','daniel','hosea','amos','matthew','mark','luke','john','acts','romans','corinth','galatian','ephesian','hebrews','revelation','concordance','lexicon','grammar','philology','patristic','exegesis','commentar']
          kwB=['theology','church history','reformation','calvin','luther','augustine','origen','jerome','tertullian','chrysostom','creed','confession','apologetic','mission','judaism','early christian','religion']
          def text(d):
              z=[]
              for k in ['title','creator','subject','series']:
                  v=d.get(k,''); z.extend(map(str,v if isinstance(v,list) else [v]))
              return ' '.join(z).lower()
          def score(d):
              s=text(d)
              return sum(5 for k in kwA if k in s)+sum(2 for k in kwB if k in s)+(1 if ('journal' in s or 'bulletin' in s) else 0)
          ranked=sorted(docs.values(),key=lambda d:(score(d),str(d.get('year',''))),reverse=True)
          out=[]
          for d in ranked[:400]:
              d=dict(d); d['score']=score(d); d['item_link']=BASE+'/details/'+d['identifier']; out.append(d)
          with open('gtu_candidates_fast.json','w') as f: json.dump({'examined':len(docs),'records':out},f,ensure_ascii=False,indent=2)
          print('EXAMINED',len(docs),'CANDIDATES',len(out))
          for r in out[:30]: print(r['identifier'], r.get('title','')[:100])
          PY
          python3 /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-inventory-fast-20260824
          path: gtu_candidates_fast.json
          compression-level: 6
