name: Founders Journal PDF Bridge

on:
  push:
    paths:
      - 'founders-journal-trigger.txt'
  workflow_dispatch:

jobs:
  inspect-newer:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect newer complete PDFs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p out
          urls=(
            'https://founders.org/wp-content/uploads/2026/04/Founders-Journal-FULL-2024-Spring-COVER.pdf'
            'https://founders.org/wp-content/uploads/2026/04/Founders-Journal-FULL-2025-FAll-.pdf'
            'https://founders.org/wp-content/uploads/2026/04/Founders-Journal-FULL-2026-Spring.pdf'
          )
          names=('Spring-2024' 'Fall-2025' 'Spring-2026')
          : > out/manifest.txt
          for i in 0 1 2; do
            f="out/${names[$i]}.pdf"
            curl -L --fail --retry 3 -A 'Mozilla/5.0' "${urls[$i]}" -o "$f"
            head -c 4 "$f" | grep -q '%PDF'
            pdftotext -f 1 -l 6 -layout "$f" - | head -n 120 > "out/${names[$i]}.txt" || true
            echo "===== ${names[$i]} =====" >> out/manifest.txt
            grep -Eina 'Issue|Founders Journal|Spring|Summer|Fall|Winter|2024|2025|2026' "out/${names[$i]}.txt" | head -n 40 >> out/manifest.txt || true
          done
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: founders-journal-newer-inspection
          path: out/*
          compression-level: 0
          retention-days: 1
