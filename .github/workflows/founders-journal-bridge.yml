name: Founders Journal PDF Bridge

on:
  push:
    paths:
      - 'founders-journal-trigger.txt'
  workflow_dispatch:

jobs:
  scan-newer:
    runs-on: ubuntu-latest
    steps:
      - name: Scan WordPress media for newer Founders Journal PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, re
          out=[]
          for page in range(1,101):
              url=f'https://founders.org/wp-json/wp/v2/media?media_type=application&per_page=100&page={page}'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=json.load(urllib.request.urlopen(req,timeout=30))
              except Exception:
                  break
              if not data: break
              for x in data:
                  u=x.get('source_url','')
                  title=x.get('title',{}).get('rendered','')
                  if u.lower().endswith('.pdf') and ('founders' in u.lower() or 'journal' in u.lower() or 'founders' in title.lower()):
                      out.append({'date':x.get('date'),'title':title,'url':u})
          out.sort(key=lambda x:(x['date'] or '',x['url']))
          with open('founders-media.json','w') as f: json.dump(out,f,indent=2)
          for x in out:
              if (x['date'] or '') >= '2024-01-01': print(x['date'],x['title'],x['url'])
          PY
      - name: Upload media manifest
        uses: actions/upload-artifact@v4
        with:
          name: founders-journal-newer-media-scan
          path: founders-media.json
          retention-days: 1
