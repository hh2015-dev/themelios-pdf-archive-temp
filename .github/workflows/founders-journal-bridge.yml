name: Founders Journal PDF Bridge

on:
  push:
    paths:
      - 'founders-journal-trigger.txt'
  workflow_dispatch:

jobs:
  fetch-founders:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Founders Journal PDFs from WordPress media index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html
          from urllib.parse import quote
          S=requests.Session(); S.headers['User-Agent']='Mozilla/5.0'
          candidates={}
          probes=[
            'FoundersJournal','Founders Journal','Founders-Journal','Founders journal issue','FoundersJournal1','Founders Journal FULL'
          ]
          for q in probes:
            for page in range(1,20):
              u=f'https://founders.org/wp-json/wp/v2/media?search={quote(q)}&per_page=100&page={page}'
              r=S.get(u,timeout=60)
              print('PROBE',q,page,r.status_code,r.headers.get('X-WP-Total'),r.headers.get('X-WP-TotalPages'))
              if r.status_code==400 and 'rest_post_invalid_page_number' in r.text: break
              if r.status_code!=200: break
              arr=r.json()
              if not arr: break
              for m in arr:
                src=html.unescape(m.get('source_url',''))
                title=html.unescape((m.get('title') or {}).get('rendered',''))
                slug=m.get('slug','')
                if '.pdf' not in src.lower(): continue
                blob=' '.join([src,title,slug])
                if re.search(r'founders[-_ ]?journal',blob,re.I): candidates[m['id']]={'id':m['id'],'source_url':src,'title':title,'slug':slug,'date':m.get('date')}
              if page>=int(r.headers.get('X-WP-TotalPages','1')): break
          # Also try likely custom post endpoint to harvest attachment links.
          endpoints=[]
          try:
            types=S.get('https://founders.org/wp-json/wp/v2/types',timeout=60).json()
            for k,v in types.items():
              if 'journal' in (k+' '+str(v.get('name',''))+' '+str(v.get('slug',''))).lower(): endpoints.append(k)
            print('JOURNAL_TYPES',endpoints)
          except Exception as e: print('TYPES_FAIL',repr(e))
          open('media_candidates.json','w').write(json.dumps(list(candidates.values()),indent=2))
          print('CANDIDATES',len(candidates))
          for x in sorted(candidates.values(),key=lambda x:x['source_url']): print(x['source_url'])
          PY
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: founders-journal-media-discovery
          path: media_candidates.json
          compression-level: 0
          retention-days: 1
