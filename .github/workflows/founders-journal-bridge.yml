name: Founders Journal PDF Bridge

on:
  push:
    paths:
      - 'founders-journal-trigger.txt'
  workflow_dispatch:

jobs:
  recover-verified:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://founders.org/wp-content/uploads/2018/06/FoundersJournal112.pdf' -o 'out/Founders Journal - Issue 112.pdf'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://founders.org/wp-content/uploads/2018/09/FoundersJournal113.pdf' -o 'out/Founders Journal - Issue 113.pdf'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://founders.org/wp-content/uploads/2020/02/Founders-Journal-FALL-2019.pdf' -o 'out/Founders Journal - Issue 118.pdf'
          for f in out/*.pdf; do head -c 4 "$f" | grep -q '%PDF'; done
      - name: Upload verified issues
        uses: actions/upload-artifact@v4
        with:
          name: founders-journal-verified-112-113-118
          path: out/*.pdf
          compression-level: 0
          retention-days: 1
