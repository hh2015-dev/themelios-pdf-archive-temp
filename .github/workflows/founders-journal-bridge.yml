name: Founders Journal PDF Bridge

on:
  push:
    paths:
      - 'founders-journal-trigger.txt'
  workflow_dispatch:

jobs:
  verify-117-119:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect issue pages and media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,json
          pages={117:'https://founders.org/journal/journal-22414/',119:'https://founders.org/journal/journal-23977/'}
          report=[]
          for n,u in pages.items():
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              pdfs=sorted(set(re.findall(r'https?://[^\"\'<> ]+?\.pdf',html,re.I)))
              report.append({'issue':n,'page':u,'pdfs':pdfs})
          media=[]
          for page in range(1,101):
              u=f'https://founders.org/wp-json/wp/v2/media?media_type=application&per_page=100&page={page}'
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  data=json.load(urllib.request.urlopen(req,timeout=30))
              except Exception:
                  break
              if not data: break
              for x in data:
                  su=x.get('source_url','')
                  title=x.get('title',{}).get('rendered','')
                  if su.lower().endswith('.pdf'):
                      s=(su+' '+title).lower()
                      if any(k in s for k in ['117','119','summer-2019','summer_2019','2019-summer','winter-2020','winter_2020','2020-winter']):
                          media.append({'date':x.get('date'),'title':title,'url':su})
          with open('report.json','w') as f: json.dump({'pages':report,'media':media},f,indent=2)
          print(json.dumps({'pages':report,'media':media},indent=2))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: founders-journal-117-119-report
          path: report.json
          retention-days: 1
