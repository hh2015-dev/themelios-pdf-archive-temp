name: BSUK Bible Student Wayback recovery

on:
  pull_request:
    paths:
      - bible-student-wayback-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pypdf
      - run: python bsuk_worker/bible_student_wayback.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-bible-student-wayback
          path: bible_student_wayback/
          if-no-files-found: error
          retention-days: 1
