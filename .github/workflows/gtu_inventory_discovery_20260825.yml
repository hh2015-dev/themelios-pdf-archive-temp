name: GTU Inventory Discovery 20260825
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Mine GTU-only Archive corpus
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,json,re
          S=requests.Session(); BASE='https://archive.org/advancedsearch.php'
          queries=[
          ('sem','Hebrew OR Aramaic OR Syriac OR Semitic',4),('text','Septuagint OR textual criticism OR manuscript OR papyri',7),
          ('ot','Genesis OR Exodus OR Isaiah OR Jeremiah OR Psalms OR Job',11),('nt','Matthew OR Mark OR Luke OR John OR Acts OR Romans OR Paul',13),
          ('jud','Qumran OR Dead Sea OR Apocrypha OR Pseudepigrapha OR rabbinic OR Talmud',5),('ane','Assyrian OR Babylonian OR Akkadian OR Ugaritic OR Canaanite OR archaeology',9),
          ('hist','Calvin OR Luther OR Origen OR Augustine OR patristic OR Reformation',8),('ref','lexicon OR grammar OR concordance OR bibliography',6),
          ('journ','Journal OR Biblical OR Bible OR Scripture',15),('theol','theology OR church history OR Judaism OR early Christianity',10)]
          seen={}; examined=0
          for tag,t,page in queries:
            q=f'collection:graduatetheologicalunion AND mediatype:texts AND ({t})'
            p={'q':q,'fl[]':['identifier','title','creator','date','year','language','subject'],'rows':100,'page':page,'output':'json'}
            try: docs=S.get(BASE,params=p,timeout=12).json()['response']['docs']
            except Exception: continue
            examined += len(docs)
            for d in docs:
              if d.get('identifier'):
                d['_tag']=tag; seen.setdefault(d['identifier'],d)
          print('EXAMINED_APPEARANCES',examined); print('UNIQUE_CANDIDATES',len(seen))
          # Exact collection query establishes corpus membership. Print all candidates for downstream sheet-dedup.
          for d in seen.values(): print('CANDIDATE\t'+json.dumps(d,ensure_ascii=False,separators=(',',':')))
          PY
