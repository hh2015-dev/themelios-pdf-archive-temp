name: BSUK Sunday at Home discovery

on:
  push:
    paths:
      - bsuk_worker/discover_sunday_at_home.py
      - .github/workflows/bsuk-sunday-at-home-discovery.yml
  pull_request:
    paths:
      - bsuk_worker/discover_sunday_at_home.py
      - .github/workflows/bsuk-sunday-at-home-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python bsuk_worker/discover_sunday_at_home.py
      - uses: actions/upload-artifact@v4
        with:
          name: bsuk-sunday-at-home-discovery
          path: sunday_at_home_discovery/
          if-no-files-found: error
          retention-days: 1
