name: Princeton Hatch Metadata Temp
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Archive metadata
        run: |
          python - <<'PY'
          import json, urllib.request
          u='https://archive.org/metadata/concordancetosep00hatc_0'
          data=json.load(urllib.request.urlopen(u))
          rows=[]
          for f in data.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith('.pdf'):
                  rows.append({'name':n,'size':f.get('size'),'source':f.get('source'),'format':f.get('format')})
          open('pdf_manifest.json','w').write(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hatch-pdf-manifest
          path: pdf_manifest.json
