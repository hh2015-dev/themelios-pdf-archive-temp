name: TCHS full archive bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download TCHS Vols 1-7 and index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0' 'https://biblicalstudies.org.uk/pdf/congregational-history/01_19_index.pdf' -o 'out/Index_Vols_001-019.pdf'
          test "$(head -c 5 'out/Index_Vols_001-019.pdf')" = '%PDF-'
          for n in $(seq 1 7); do
            v=$(printf '%02d' "$n")
            vol=$(printf '%03d' "$n")
            mkdir -p "out/Volume_${vol}"
            for i in $(seq 1 6); do
              url="https://biblicalstudies.org.uk/pdf/congregational-history/${v}-${i}.pdf"
              file="out/Volume_${vol}/Transactions_of_Congregational_Historical_Society_Volume_${vol}_Issue_0${i}.pdf"
              curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o "$file"
              test "$(head -c 5 "$file")" = '%PDF-'
            done
          done
          test "$(find out -type f -name '*.pdf' | wc -l)" -eq 43
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tchs-vols-1-7
          path: out/
          compression-level: 0
          retention-days: 1
