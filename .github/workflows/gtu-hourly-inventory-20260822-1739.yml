name: GTU Hourly Inventory 20260822 1739
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mine verified GTU candidates
        shell: bash
        run: |
          cat > /tmp/mine_gtu.py <<'PY'
          import requests, json, re, time
          existing = set('''scofieldreferenc0000revc lifeofpopeleoxii0000mill inclusivebiblefi0000unse sim_american-journal-of-archaeology_1941_45_supplement secretsofalchemy0000prin fastiecclesiaesc0006scot bibleitsstory0001unse divineliturgyofs0000orth_k2j5 holybible0000unse_d3u7 preadamitemandem0000rand arabiadesertatop0000musi apocalypseofezra0008unse dictionaryofsymb0000chev septuagintwithap0000unse stathanasiusonin0000atha queerbiblecommen0000unse knightonschronic0000knig beginningsofrome0000corn holybiblecontain0000vari gestaguillelmiof0000guli diebabylonischas0000bezo horaehebraicaeet0001ligh horaehebraicaeet0004ligh papyrusgrecsbibl0000duna_u6o5 enarrationesinps0095augu wiewurdendiebuch0000liet adametsonlignage0000frai agapeinnewtestam0001spic aramaicbibliogra0000jose labibletraductio0001unse labibletraductio0004unse pocketlexicontog0000alex diemischna0004unse_j4d0 diemischna0005unse geseniushebrewgr0000benj grammatikdergrie0002mays_a4j8 greekenglishlexi0001unse_w5e3 hebrewenglishlex0000john lexiconhebraicum0000buxt newtestamentmanu0000merr apologyforbiblei00wats_3 adversusgentesli00arno b12788405 bibliothecapatru04unse bookofcommonpray00revs bookofcommonpray00prot_4 bookofcommonpray00prot_15 bookofcommonpray00prot_22 bim_early-english-books-1475-1640_leben-shleiermamers_wilhelm-dilthey_1870 american-missionary_1866-05_10_5 american-missionary_1868-04_12_4 american-missionary_1873-04_17_4 american-missionary_1874-03_18_3 american-bible-society-record_1866-04_11_4 baptist-magazine-1809_1850-01_42 agapeinnewtestam0002spic agapeinnewtestam0003spic a-grammar-of-the-old-testament-in-greek-1909-vol-1_1909_1 abbreviationsing0000twal accountofprinted0000treg actsofapostleswi0037lumb africanjournalof0012unse abbreviationsing0000mavi aboutoldtestamen0000alba adlerspecialmanu0000vari adnotationesexeg0000maxi agreementbetween0009henr actesdedocheiari0000nicl akathisthymnlitt0000orth abhandlungenvond00reim abridgedprayerbo00jews actsmonumentsofc00foxe_0 165ecritsdeluthe0000guil achtsermon00luth ageofspiritualit0000kurt calvinscommentar0004calv horaehebraicaeet0002ligh horaehebraicaeet0003ligh storyofcreationi0000carm familypicodexale0000unse aristeastophiloc0000unse_r7o3 studyofcodexevan0000bakk_n6o3 dasbuchesternach0000unse reviewguidetonew0000russ selectionsfromgr0000unse_d7m5 aramaischechrest0001koop diemedizinimneue0000ebst diemischna0002unse diemischna0003unse diemischna0006unse_u3m9 gtu_A32400003017419B epistlesofstjohn0000unse_m6y6 gospelaccordingt0001unse_f7p0 gtu_32400004227934_1 gtu_32400004227876_2'''.split())
          q='collection:graduatetheologicalunion AND mediatype:texts'
          params={'q':q,'fl[]':['identifier','title','creator','date','year','language','subject','volume'],'rows':2000,'page':1,'output':'json','sort[]':'identifier asc'}
          docs=requests.get('https://archive.org/advancedsearch.php',params=params,timeout=60).json()['response']['docs']
          A_terms=['bible','biblical','testament','gospel','genesis','exodus','leviticus','numbers','deuteronomy','joshua','judges','samuel','kings','chronicles','ezra','nehemiah','esther','job','psalm','proverb','ecclesiastes','isaiah','jeremiah','ezekiel','daniel','hosea','joel','amos','obadiah','jonah','micah','nahum','habakkuk','zephaniah','haggai','zechariah','malachi','matthew','mark','luke','john','acts','romans','corinthians','galatians','ephesians','philippians','colossians','thessalonians','timothy','titus','philemon','hebrews','james','peter','jude','revelation','apocalypse','hebrew','aramaic','syriac','semitic','greek','septuagint','lxx','textual','manuscript','papyri','papyrus','codex','dead sea','qumran','second temple','apocrypha','pseudepigrapha','mishnah','talmud','rabbin','assyri','babylon','ugarit','archaeolog','lexicon','grammar','concordance','exegesis','commentary','hermeneutic','patristic exegesis','calvin','luther']
          B_terms=['theology','patristic','church history','reformation','creed','confession','apologetic','mission','judaism','early christian','christianity','ecclesiastical','liturgy','doctrine','scholastic','augustine','aquinas','athanasius','chrysostom','origen','tertullian','jerome','eusebius']
          def txt(d):
              vals=[]
              for k in ('title','creator','subject'):
                  v=d.get(k,'')
                  if isinstance(v,list): vals.extend(map(str,v))
                  else: vals.append(str(v))
              return ' '.join(vals).lower()
          scored=[]
          for d in docs:
              ident=d.get('identifier','')
              if not ident or ident in existing: continue
              t=txt(d)
              a=sum(1 for x in A_terms if x in t)
              b=sum(1 for x in B_terms if x in t)
              if not (a or b): continue
              scored.append((a*10+b,d))
          scored.sort(key=lambda x:(-x[0], str(x[1].get('date','')), x[1].get('identifier','')))
          out=[]; examined=0
          for score,d in scored[:350]:
              ident=d['identifier']; examined+=1
              try:
                  md=requests.get(f'https://archive.org/metadata/{ident}',timeout=30).json()
              except Exception: continue
              meta=md.get('metadata',{})
              coll=meta.get('collection',[])
              if isinstance(coll,str): coll=[coll]
              if 'graduatetheologicalunion' not in coll: continue
              files=md.get('files',[])
              pdfs=[f for f in files if str(f.get('name','')).lower().endswith('.pdf') and not str(f.get('name','')).lower().endswith('_text.pdf')]
              if not pdfs: continue
              # Prefer original/simple PDF; exclude obviously derivative text PDFs.
              pdf=sorted(pdfs,key=lambda f:(0 if f.get('source')=='original' else 1, len(f.get('name',''))))[0]
              rec={
                  'identifier':ident,'title':meta.get('title',''),'creator':meta.get('creator',''),'date':meta.get('date') or meta.get('year',''),'year':meta.get('year',''),'volume':meta.get('volume',''),'edition':meta.get('edition',''),'series':meta.get('series',''),'language':meta.get('language',''),'subject':meta.get('subject',''),'contributor':meta.get('contributor',''),'description':meta.get('description',''),'pdf_name':pdf.get('name',''),'pdf_size':pdf.get('size',''),'page_count':pdf.get('pdf_module_version') and '' or meta.get('page-progression',''),'score':score
              }
              # use scandata page count if available from files metadata
              for f in files:
                  if f.get('name','').endswith('_scandata.xml') and f.get('size'): pass
              out.append(rec)
              if len(out)>=80: break
              time.sleep(0.05)
          json.dump({'examined':examined,'candidates':out},open('gtu_candidates.json','w'),ensure_ascii=False,indent=2)
          print('EXAMINED',examined,'VERIFIED',len(out))
          PY
          python /tmp/mine_gtu.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-hourly-candidates-20260822-1739
          path: gtu_candidates.json
          retention-days: 1
