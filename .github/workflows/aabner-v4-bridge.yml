name: AABNER Volume 5 bridge via V4 runner
on:
  push:
    paths:
      - 'aabner-v4-trigger.txt'
jobs:
  fetch-v5:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF merger
        run: python -m pip install --quiet pypdf
      - name: Download and merge official 2025 article PDFs
        shell: bash
        run: |
          python - <<'PY'
          import os,urllib.request
          from pypdf import PdfReader, PdfWriter
          UA={'User-Agent':'Mozilla/5.0'}
          issues={
            1:[
              'https://aabner.org/ojs/index.php/beabs/article/download/1154/1155/',
              'https://aabner.org/ojs/index.php/beabs/article/download/1229/1157/',
              'https://aabner.org/ojs/index.php/beabs/article/download/1256/1169/'
            ],
            2:[
              'https://aabner.org/ojs/index.php/beabs/article/download/1284/1210/',
              'https://aabner.org/ojs/index.php/beabs/article/download/1139/1211/',
              'https://aabner.org/ojs/index.php/beabs/article/download/1206/1212/',
              'https://aabner.org/ojs/index.php/beabs/article/download/1126/1213/',
              'https://aabner.org/ojs/index.php/beabs/article/download/1127/1214/',
              'https://aabner.org/ojs/index.php/beabs/article/download/1178/1215/'
            ]
          }
          os.makedirs('out',exist_ok=True)
          for ino,urls in issues.items():
            parts=[]
            for idx,u in enumerate(urls,1):
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=120) as r: b=r.read()
              if not b.startswith(b'%PDF'): raise SystemExit(f'Not PDF: {u}')
              p=f'out/i{ino:02d}-part-{idx:02d}.pdf';open(p,'wb').write(b);parts.append(p)
              print('SAVED PART',ino,idx,len(b))
            w=PdfWriter()
            for p in parts:
              for page in PdfReader(p).pages:w.add_page(page)
            out=f'out/AABNER - Volume 005 Issue {ino:02d} - 2025 - Combined Official Articles.pdf'
            with open(out,'wb') as f:w.write(f)
            print('MERGED',out,os.path.getsize(out),len(parts))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aabner-volume-005-2025
          path: out/AABNER*.pdf
          if-no-files-found: error
          compression-level: 0
