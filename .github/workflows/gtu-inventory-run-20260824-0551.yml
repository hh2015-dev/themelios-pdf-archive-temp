name: GTU inventory discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fast closed-corpus GTU discovery
        shell: bash
        run: |
          cat > /tmp/mine.py <<'PY'
          import requests,csv
          from collections import OrderedDict
          terms=['Hebrew','Aramaic','Syriac','Semitic','Akkadian','Ugaritic','Septuagint','textual criticism','manuscript','papyri','Qumran','apocrypha','pseudepigrapha','Mishnah','Talmud','archaeology','concordance','lexicon','grammar','Job','Psalms','Isaiah','Jeremiah','Daniel','Matthew','John','Romans','Hebrews','Revelation','Origen','Calvin','Luther','Bible']
          s=requests.Session(); s.headers['User-Agent']='GTU-inventory-research/1.0'
          found=OrderedDict(); appearances=0
          for t in terms:
            for page in (4,9):
              q=f'collection:graduatetheologicalunion AND mediatype:texts AND format:"Text PDF" AND ({t})'
              try:
                r=s.get('https://archive.org/advancedsearch.php',params={'q':q,'fl[]':['identifier','title','creator','date','year','volume','language','contributor'],'rows':80,'page':page,'output':'json'},timeout=12); r.raise_for_status(); docs=r.json()['response']['docs']
              except Exception: continue
              appearances+=len(docs)
              for d in docs:
                i=d.get('identifier')
                if i and i not in found: found[i]=d
          fields=['identifier','title','creator','year','volume','language','contributor','item_link']
          with open('gtu_candidates.tsv','w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,delimiter='\t'); w.writeheader()
            for i,d in found.items():
              def flat(v): return '; '.join(map(str,v)) if isinstance(v,list) else ('' if v is None else str(v))
              w.writerow({'identifier':i,'title':flat(d.get('title')),'creator':flat(d.get('creator')),'year':flat(d.get('year') or d.get('date')),'volume':flat(d.get('volume')),'language':flat(d.get('language')),'contributor':flat(d.get('contributor')),'item_link':'https://archive.org/details/'+i})
          print(f'APPEARANCES={appearances} UNIQUE_TEXT_PDF={len(found)}')
          for i,d in list(found.items())[:100]:
            def flat(v): return '; '.join(map(str,v)) if isinstance(v,list) else ('' if v is None else str(v))
            print('CAND\t'+i+'\t'+flat(d.get('title'))[:150]+'\t'+flat(d.get('creator'))[:90]+'\t'+flat(d.get('year') or d.get('date'))[:24]+'\tVOL='+flat(d.get('volume'))[:24])
          PY
          python /tmp/mine.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-candidates-20260824
          path: gtu_candidates.tsv
          compression-level: 6
