name: GTU inventory discovery 20260824
on:
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected GTU candidates
        shell: bash
        run: |
          cat > /tmp/verify.py <<'PY'
          import requests,urllib.parse,csv
          ids='''comparisonofegyp0000port
epistletoephesia0000john
calvinscommentar0029calv
cyclopaediaofbib0003revj_d8h5
arthursamuelpeak0000john
lefilslhommeetle0000copp
parallelisminisa0001will
bookofpsalms0000hbar
catalogofhebrewb0003jiq
gtu_32400006315463
sim_journal-of-biblical-literature_1912_31_2
sim_journal-of-biblical-literature_1914-06_33_2
sim_journal-of-biblical-literature_1916_35
sim_journal-of-biblical-literature_1929_48_1-2
sim_journal-of-biblical-literature_1937-06_56_2
sim_journal-of-biblical-literature_1946-03_65_1
sim_journal-of-biblical-literature_1950-12_69_4
sim_journal-of-biblical-literature_1959-12_78_4
sim_bulletin-of-the-american-schools-of-oriental-research_1926-04_22
sim_bulletin-of-the-american-schools-of-oriental-research_1926-10_23
sim_bulletin-of-the-american-schools-of-oriental-research_1926-12_24
sim_bulletin-of-the-american-schools-of-oriental-research_1927-04_26
sim_journal-of-near-eastern-studies_1944-01_3_1
philosophy-of-religion-1965_1965
samaritanliturgy0000aeco
gtu_32400003956582_2'''.splitlines()
          s=requests.Session(); s.headers['User-Agent']='GTU-inventory-research/1.0'
          fields=['identifier','valid','title','creator','year','volume','edition','series','language','subjects','pages','contributor','item_link','pdf_link','notes']
          out=[]
          def flat(v): return '; '.join(map(str,v)) if isinstance(v,list) else ('' if v is None else str(v))
          for ident in ids:
            try: m=s.get('https://archive.org/metadata/'+urllib.parse.quote(ident,safe=''),timeout=15).json()
            except Exception as e:
              out.append({'identifier':ident,'valid':'NO','notes':'metadata request failed'}); continue
            md=m.get('metadata') or {}; cols=md.get('collection',[])
            if isinstance(cols,str): cols=[cols]
            restricted=str(md.get('access-restricted-item','')).lower()=='true' or str(md.get('printdisabled','')).lower()=='true'
            pdf=''
            for f in m.get('files',[]):
              n=f.get('name',''); lo=n.lower()
              if lo.endswith('.pdf') and not lo.endswith('.lcpdf') and 'encrypted' not in lo and str(f.get('private','false')).lower()!='true': pdf=n; break
            valid=('graduatetheologicalunion' in cols and not restricted and bool(pdf))
            out.append({'identifier':ident,'valid':'YES' if valid else 'NO','title':flat(md.get('title')),'creator':flat(md.get('creator')),'year':flat(md.get('year') or md.get('date')),'volume':flat(md.get('volume')),'edition':flat(md.get('edition')),'series':flat(md.get('series')),'language':flat(md.get('language')),'subjects':flat(md.get('subject')),'pages':flat(md.get('imagecount')),'contributor':flat(md.get('contributor')),'item_link':'https://archive.org/details/'+ident,'pdf_link':('https://archive.org/download/'+ident+'/'+urllib.parse.quote(pdf,safe='')) if pdf else '','notes':'GTU member; unrestricted public PDF verified' if valid else 'Not eligible after metadata verification'})
          with open('gtu_verified.tsv','w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,delimiter='\t'); w.writeheader(); w.writerows(out)
          print('CHECKED='+str(len(ids))+' VALID='+str(sum(x['valid']=='YES' for x in out)))
          for x in out: print('VERIFY\t'+x['valid']+'\t'+x['identifier']+'\t'+x.get('title','')[:130]+'\t'+x.get('creator','')[:80]+'\t'+x.get('year','')[:24]+'\tVOL='+x.get('volume','')[:24]+'\tPAGES='+x.get('pages','')[:12])
          PY
          python /tmp/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-verified-20260824
          path: gtu_verified.tsv
          compression-level: 6
