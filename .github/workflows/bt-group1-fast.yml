name: BT group3 BiblicalStudies fetch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BiblicalStudies group3 index
        run: |
          set -e
          mkdir -p out-bsuk/pdfs
          python - <<'PY'
          import html,re,urllib.parse,urllib.request,csv
          urls=['https://biblicalstudies.gospelstudies.org.uk/articles_bible-translator_03.php','https://www.biblicalstudies.org.uk/articles_bible-translator_03.php']
          raw=None;base=None
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); base=u; break
            except Exception as e: print('INDEX_FAIL',u,e)
          if raw is None: raise SystemExit('index fetch failed')
          open('out-bsuk/index.html','wb').write(raw)
          t=raw.decode('utf-8','replace'); seen=set(); rows=[]
          for h in re.findall(r'''(?is)href\s*=\s*["']([^"']+?\.pdf(?:\?[^"']*)?)["']''',t):
            u=urllib.parse.urljoin(base,html.unescape(h)); k=u.lower()
            if k in seen: continue
            seen.add(k); rows.append(u)
          with open('out-bsuk/urls.txt','w',encoding='utf-8') as f:
            for n,u in enumerate(rows,1): f.write(f'{n:04d}|{u}\n')
          print('INDEX',base)
          print('UNIQUE_PDF_URLS',len(rows))
          PY
      - name: Parallel download BiblicalStudies-linked PDFs
        run: |
          set -e
          cat out-bsuk/urls.txt | xargs -P8 -I{} bash -c '
            line="$1"; n="${line%%|*}"; u="${line#*|}"; b="$(basename "${u%%\?*}")"; f="out-bsuk/pdfs/${n}__${b}"; curl -L --fail --retry 3 --retry-delay 1 --connect-timeout 20 --max-time 120 "$u" -o "$f"; test "$(head -c 5 "$f")" = "%PDF-"' _ {}
          echo "PDF_COUNT=$(find out-bsuk/pdfs -type f -name '*.pdf' | wc -l)"
      - name: Upload group3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-bsuk-group3
          path: out-bsuk/
          compression-level: 0
          retention-days: 1
