name: BT group2 BiblicalStudies inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BiblicalStudies group2 index
        run: |
          set -e
          mkdir -p out-bsuk
          python - <<'PY'
          import html,re,urllib.parse,urllib.request,csv
          urls=['https://biblicalstudies.gospelstudies.org.uk/articles_bible-translator_02.php','https://www.biblicalstudies.org.uk/articles_bible-translator_02.php']
          raw=None;base=None
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); base=u; break
            except Exception as e: print('INDEX_FAIL',u,e)
          if raw is None: raise SystemExit('index fetch failed')
          open('out-bsuk/index.html','wb').write(raw)
          t=raw.decode('utf-8','replace'); seen=set(); rows=[]
          for h in re.findall(r'''(?is)href\s*=\s*["']([^"']+?\.pdf(?:\?[^"']*)?)["']''',t):
            u=urllib.parse.urljoin(base,html.unescape(h)); k=u.lower()
            if k in seen: continue
            seen.add(k); rows.append(u)
          open('out-bsuk/urls.txt','w',encoding='utf-8').write('\n'.join(rows)+'\n')
          print('INDEX',base)
          print('UNIQUE_PDF_URLS',len(rows))
          PY
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-bsuk-group2-inventory
          path: out-bsuk/
          compression-level: 0
          retention-days: 1
