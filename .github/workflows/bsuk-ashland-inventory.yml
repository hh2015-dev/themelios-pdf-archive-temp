name: BSUK Ashland complete-volume inventory

on:
  push:
    paths:
      - 'bsuk_worker/ashland_inventory.py'
      - '.github/workflows/bsuk-ashland-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inventory dependencies
        run: pip install requests pymupdf
      - name: Measure final split-volume PDFs
        run: python bsuk_worker/ashland_inventory.py
      - name: Upload manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashland-inventory-manifest
          path: ashland_inventory/
          retention-days: 1
          if-no-files-found: warn
