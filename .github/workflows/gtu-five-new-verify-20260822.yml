name: GTU five artifact bridge 20260822
on:
  pull_request:
    branches: [ main ]
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-lietzmann
          path: gtu_temp_pdfs/wiewurdendiebuch0000liet.pdf
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-mischna-v4
          path: gtu_temp_pdfs/diemischna0004unse_j4d0.pdf
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-mischna-v5
          path: gtu_temp_pdfs/diemischna0005unse.pdf
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-lightfoot-v4
          path: gtu_temp_pdfs/horaehebraicaeet0004ligh.pdf
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gtu-bcp-1833
          path: gtu_temp_pdfs/bookofcommonpray00prot_4.pdf
          compression-level: 0
